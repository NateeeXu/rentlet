<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rentlet · Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root{
  --canvas:#f7f7f7;--soft:#f2f2f4;--ink:#222;--ink2:#484848;--muted:#717171;--faint:#9a9aa0;
  --line:#ddd;--hair:#ebebeb;--accent:#542992;--accent-soft:#f1ebff;
  --ok:#1a7f37;--ok-bg:#e9f7ee;--warn:#b86e00;--warn-bg:#fff4e5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);
  --lift:0 1px 2px rgba(0,0,0,.06),0 12px 30px rgba(0,0,0,.10);
  --deep:0 2px 6px rgba(23,20,28,.08),0 28px 56px rgba(30,25,40,.20);
  --ease:cubic-bezier(.22,1,.36,1);--serif:"Newsreader",Georgia,"Times New Roman",serif;--sq:26px;--vh:100vh;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e6e6ea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* review chrome */
.rv{background:#fff;border-bottom:1px solid var(--hair)}
.rv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px}
.rv-title{font-size:14px;font-weight:700;margin-right:6px}
.rv-top button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.rv-top button[aria-selected=true],.rv-dev button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.rv-top .rec{font-size:11px;color:var(--accent);margin-left:4px}
.rv-top button[aria-selected=true] .rec{color:#d9ccf5}
.rv-dev{margin-left:auto;display:flex;gap:6px}
.rv-note{padding:0 16px 12px;font-size:13px;line-height:1.65;color:var(--ink2);margin:0}
.rv-note b{color:var(--ink)}
.stage.phone{width:390px;height:844px;margin:28px auto 48px;padding:0;border-radius:34px;overflow:hidden;transform:translateZ(0);box-shadow:0 0 0 10px #1d1d1f,0 30px 70px rgba(0,0,0,.25)}
/* the phone frame is the screen: fixed sheets, toasts and pickers inside it stay inside it */
.stage.phone .site{width:100%;height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0;border-radius:0;box-shadow:none}
/* site */
.site{container-type:inline-size;background:var(--canvas);position:relative;overflow-x:clip;min-height:100vh}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.hdr{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:30;height:76px}
/* logo | search | actions: the search sits in the true centre while there is room; when it gets tight it moves
   off centre instead of closer to the right-end group, so the gap to Saved, Messages and the menu never drops below 20px */
.hdr .wrap{display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr);align-items:center;gap:20px;height:76px}
/* the search bar fills the middle of this header, so Requests and Post a listing stay in the menu here
   (shown, they push the bar to its 20px minimum even at 1600px) */
.hdr .rl-top{display:none!important}
.hdr .wrap>a:first-child{justify-self:start}
.hdr .hdr-r{justify-self:end}
@container (max-width:640px){.hdr .wrap{gap:8px}}
.msearch{display:flex;align-items:center;height:56px;padding:6px 6px 6px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05),0 8px 22px rgba(0,0,0,.06);transition:box-shadow .25s}
.msearch:hover{box-shadow:0 2px 6px rgba(0,0,0,.06),0 12px 28px rgba(0,0,0,.1)}
.msearch>i{width:1px;height:24px;background:var(--hair);flex:none}
.msearch .seg{display:flex;align-items:center;gap:9px;height:44px;padding:0 16px 0 12px;border-radius:999px;color:var(--ink);text-decoration:none;white-space:nowrap;transition:background .2s}
.msearch .seg:hover,.msearch .seg.ws-on{background:var(--soft)}
.msearch button.seg{border:0;background:none;font:inherit;cursor:pointer;text-align:left}
.msearch button.seg:hover,.msearch button.seg[aria-expanded=true]{background:var(--soft)}
.msearch .seg:hover+i,.msearch i:has(+.seg:hover){opacity:0}
.msearch .seg .ic{width:17px;height:17px;color:var(--ink2)}
.msearch .usd{width:17px;text-align:center;font-size:15px;font-weight:700;color:var(--ink2)}
.msearch .seg span{display:flex;flex-direction:column;font-size:14px;font-weight:600;line-height:1.2}
.msearch .seg em{font-style:normal}
.msearch .ws-in{width:168px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msearch .seg-w{cursor:text}
.msearch .seg small{font-size:12px;font-weight:600;color:var(--muted)}
.msearch .go{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;margin-left:6px;transition:transform .2s var(--ease),background .2s}
.msearch .go:hover{background:#000;transform:scale(1.05)}
.msearch .go .ic{width:18px;height:18px}
/* AI pick, the same night-ink button as the homepage: faint stars at rest, they light up with a sheen on hover */
.aipk{position:relative;isolation:isolate;overflow:hidden;flex:none;height:44px;margin-left:8px;padding:0 16px 0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink);text-decoration:none;font-size:14px;font-weight:650;white-space:nowrap;transition:background .2s}
.aipk:hover{background:var(--soft)}
.aipk:active{transform:scale(.96)}
.aipk .spk{position:relative;z-index:2;width:15px;height:15px;fill:currentColor;transition:transform .6s var(--ease)}
.aipk .t{position:relative;z-index:2}
.aipk .sh{position:absolute;inset:0;pointer-events:none;z-index:1}
.aipk .sh{background:linear-gradient(105deg,transparent 35%,rgba(0,0,0,.07) 50%,transparent 65%);background-size:250% 100%;background-position:130% 0;transition:background-position .9s var(--ease)}
.aipk:hover .sh{background-position:-30% 0}
.aipk:hover .spk{transform:rotate(90deg)}
@keyframes aitw{50%{opacity:.08}}
.aipk{border:0;cursor:pointer;font-family:inherit}
.aipk.picking .spk{animation:aispin .8s var(--ease) infinite}
.aipk.picking .sh{animation:aisweep 1s linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
@keyframes aisweep{from{background-position:130% 0}to{background-position:-30% 0}}
/* page states */
.st-load{min-height:calc(var(--vh,100vh) - 220px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:14px}
.st-load .dots{display:flex;gap:7px}
.st-load .dots i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7b61ff,#542992);animation:stdot 1.1s ease-in-out infinite}
.st-load .dots i:nth-child(2){animation-delay:.15s}.st-load .dots i:nth-child(3){animation-delay:.3s}
@keyframes stdot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-7px);opacity:1}}
.st-box{max-width:460px;margin:72px auto 48px;text-align:center;display:flex;flex-direction:column;align-items:center}
.st-ic{width:56px;height:56px;border-radius:16px;background:#f1eefb;display:grid;place-items:center}
.st-ic svg{width:26px;height:26px;fill:none;stroke:#542992;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.st-box h1{margin:16px 0 0;font-size:15px;font-weight:650;letter-spacing:0}
.st-box p{margin:6px 0 0;font-size:13px;line-height:1.55;color:#717171}
.st-acts{display:flex;gap:16px;align-items:center;margin-top:16px}
.st-link{width:auto!important;margin:0;padding:0;border:0;background:none;font-size:14px;font-weight:650;color:#542992;text-decoration:none;cursor:pointer}
.st-link:hover{text-decoration:underline}
/* dates you can change */
/* sign-in sheet */
.lgsheet{position:relative;width:min(420px,100%)}
.lg-top{display:flex;gap:12px;align-items:flex-start;padding-right:28px}
.lg-ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#f1ebff,#ffeef3)}
.lg-ic svg{width:20px;height:20px;fill:none;stroke:#542992;stroke-width:1.8;stroke-linecap:round}
.lg-top h3{margin:0;font-size:15px;font-weight:650}
.lg-top p{margin:3px 0 0;font-size:13px;line-height:1.45;color:#7a7a80}
.lg-g,.lg-e{width:100%!important;height:46px;margin:0;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;font-size:15px;font-weight:650}
.lgsheet .lg-g{margin-top:18px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.lgsheet .lg-g:hover{border-color:var(--ink)}
.lg-g svg{width:18px;height:18px}
.lgsheet .lg-e{margin-top:10px}
.lg-fine{margin:14px 0 0!important;font-size:12px!important;line-height:1.5;color:#9a9aa0!important;text-align:center}
.lg-x{position:absolute;right:14px;top:14px;width:32px!important;height:32px;min-width:0;margin:0;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.lg-x:hover{background:var(--soft)}
.lg-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
/* search card shares the AI card's frame */
.scard{padding:10px}
.msrch{display:none!important;width:44px!important;height:44px;min-width:0;margin:0;padding:0;border:1px solid var(--line);border-radius:50%;background:#fff;place-items:center;cursor:pointer}
.msrch .ic{width:18px;height:18px}
.sfield{display:flex;align-items:center;gap:10px;height:48px;padding:0 12px 0 14px;border-radius:14px;background:rgba(0,0,0,.05);cursor:text}
.sfield .ic{width:18px;height:18px;color:var(--muted);flex:none}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:15px;font-weight:550;color:var(--ink)}
.sfield input::-webkit-search-cancel-button{display:none}
.sfield kbd{font:600 11px/1 inherit;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
.sfield:focus-within{box-shadow:0 0 0 2px var(--ink)}
.slist{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-top:8px;max-height:min(380px,60vh);overflow:auto}
.slab{margin:4px 6px 2px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.shint{margin:6px 8px 8px;font-size:13px;line-height:1.5;color:var(--muted)}
.snone{margin:8px;display:grid;gap:3px}
.snone b{font-size:14px}.snone span{font-size:13px;color:var(--muted)}
.sitem{min-width:0;display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;color:inherit;text-decoration:none}
.sitem.on{background:var(--soft)}
#sCard .sitem img{width:56px;height:42px;border-radius:10px;object-fit:cover;flex:0 0 56px;display:block}
.stx{flex:1;min-width:0}
.stx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stx>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.stx em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:600}
.spr{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-size:14px;font-weight:750;line-height:1.15;font-variant-numeric:tabular-nums}
.spr small{font-size:11px;font-weight:500;color:var(--muted)}
/* the drop-down card */
.aicard{position:absolute;left:50%;top:calc(100% + 6px);width:min(440px,calc(100cqw - 32px));padding:14px;border-radius:22px;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.16),0 2px 6px rgba(30,25,40,.06);transform:translate(-50%,-8px) scale(.97);transform-origin:50% 0;opacity:0;transition:opacity .2s,transform .35s var(--ease);z-index:40}
.aicard.on{opacity:1;transform:translate(-50%,0) scale(1)}
.aicard[hidden]{display:none}
/* AI picks: a glass panel under the top bar lists one to three other rooms that fit your dates and budget; picking again keeps the panel's height */
.ai-scrim{position:absolute;left:0;right:0;top:100%;height:calc(var(--vh,100vh) - 100%);background:rgba(0,0,0,.08);border:0;padding:0;margin:0;cursor:default;border-radius:0;z-index:35}
.ai-scrim[hidden]{display:none}
.ai-gp{position:absolute;top:calc(100% + 8px);right:max(24px,calc(50% - 300px));z-index:40;width:420px;max-width:calc(100% - 32px);padding:14px 14px 6px;border-radius:22px;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.16),0 2px 6px rgba(30,25,40,.06);overflow:hidden}
.ai-gp[hidden]{display:none}
.ai-h{display:flex;align-items:flex-start;gap:10px;padding:2px 2px 8px 6px}
.ai-h div{flex:1;min-width:0}
.ai-h b{display:block;font-size:16px;font-weight:650}
.ai-h span{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.ai-x{width:44px!important;height:44px;min-width:0;margin:-6px -2px 0 0;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--ink2);cursor:pointer}
.ai-x:hover{background:rgba(0,0,0,.05)}
.ai-x .ic{width:18px;height:18px}
.ai-list{display:grid;align-content:start;gap:2px}
.ai-row{display:flex;align-items:center;gap:12px;min-width:0;height:76px;padding:8px;border-radius:14px;color:inherit;text-decoration:none;animation:airise .52s cubic-bezier(.2,.8,.2,1) both calc(var(--i)*70ms)}
a.ai-row:hover{background:rgba(0,0,0,.05)}
.ai-row img,.ai-row .ai-ph{width:64px;height:48px;border-radius:12px;object-fit:cover;flex:0 0 64px;display:block}
.ai-row img.flip{transform:scaleX(-1)}
.ai-tx{flex:1;min-width:0}
.ai-tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-tx>span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ai-fit{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ai-pr{flex:none;font-size:15px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.ai-pr small{font-size:13px;font-weight:500;color:var(--muted)}
.ai-skr{animation:none}
.ai-skr .ai-l{display:block;height:12px;border-radius:6px;margin:4px 0}
.ai-skr .ai-l.a{width:70%}.ai-skr .ai-l.b{width:48%}.ai-skr .ai-l.c{width:56%}
.ai-skr .ai-p{width:68px;height:14px;border-radius:7px;flex:none}
.ai-sk{background:linear-gradient(100deg,#eeeef1 30%,#fafafb 50%,#eeeef1 70%);background-size:300% 100%;animation:aishim 1.5s ease-in-out infinite}
.ai-empty{min-height:76px;padding:14px 8px}
.ai-empty b{display:block;font-size:15px}
.ai-empty span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.ai-f{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px;padding:2px 4px 0;border-top:1px solid rgba(0,0,0,.08)}
.ai-btn{display:inline-flex;align-items:center;min-height:44px;width:auto!important;min-width:0;margin:0;padding:0 2px;border:0;background:none;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;cursor:pointer}
.ai-btn:hover{text-decoration:underline;text-underline-offset:3px}
.ai-btn[disabled]{color:var(--muted);cursor:default;text-decoration:none}
.ai-link{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 2px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.ai-link span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.ai-link:hover span{text-decoration-thickness:2px}
.ai-link .ic{width:16px;height:16px}
/* a backdrop filter inside a filtered header would only see the header, so the bar goes plain white while a panel is open */
.hdr.flat{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
/* phones: the search pill is hidden, so a round AI pick sits in the bar's right cluster */
.aipk.ai-m{display:none;margin:0}
@keyframes aishim{from{background-position:100% 0}to{background-position:0 0}}
@keyframes airise{from{opacity:0;transform:translateY(12px)}}
/* night-ink family (matches AI pick): a tag, a primary button with a travelling light on its bottom edge, and an outline button that fills with ink */
.nk-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 10px;border-radius:999px;color:#fff;font-size:13px;font-weight:650;background:var(--ink)}
.nk-tag svg{width:13px;height:13px;fill:#fff}
.nk-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border:0;border-radius:999px;color:#fff!important;font-size:15px;font-weight:650;text-decoration:none!important;cursor:pointer;background:var(--ink);transition:transform .18s,box-shadow .2s}
.nk-btn:hover{box-shadow:0 10px 24px rgba(0,0,0,.18)}
.nk-btn:active{transform:scale(.97)}
.nk-btn .arr{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.nk-btn:hover .arr{transform:translateX(4px)}
.nk-ghost{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:48px;padding:0 20px;border:0;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);font-size:15px;font-weight:650;cursor:pointer;transition:background .2s}
.nk-ghost:hover{background:var(--soft)}
.nk-ghost svg{width:15px;height:15px;fill:currentColor;transition:transform .6s cubic-bezier(.22,1,.36,1),filter .3s}
.nk-ghost:hover svg{transform:rotate(180deg);filter:drop-shadow(0 0 5px rgba(170,150,255,.9))}
.nk-ghost.sm,.nk-btn.sm{height:38px;padding:0 15px;font-size:14px}

.hdr img{height:26px;display:block}
.mini-search{display:none;align-items:center;gap:10px;height:44px;padding:0 6px 0 18px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap}
.mini-search span{color:var(--muted);font-weight:500}
.mini-search i{width:1px;height:20px;background:var(--hair)}
.mini-search .go{width:32px;height:32px;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.hdr-r{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-size:15px;font-weight:600;white-space:nowrap;width:auto;flex:0 0 auto;margin:0;background:none;transition:transform .18s,background .18s,border-color .18s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-secondary{background:#fff;border-color:var(--line)}
.btn-secondary:hover{border-color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}
.btn-sm{height:36px;padding:0 13px;font-size:14px}
.sqr{border-radius:var(--sq);overflow:hidden;background:var(--soft);position:relative}
.sqr img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.flip{transform:scaleX(-1)}
@supports (corner-shape:squircle){.sqr{border-radius:calc(var(--sq) * 1.85);corner-shape:squircle}}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.wa{background:var(--warn-bg);color:var(--warn)}
.badge.n{background:var(--soft);color:var(--ink2)}
.tl{font-size:13px;font-weight:650;color:var(--ink2);margin:0}
.big{font-size:30px;font-weight:700;letter-spacing:-.8px;line-height:1.05;font-variant-numeric:tabular-nums;margin:10px 0 0}
.big small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.mut{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.titlebar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:28px;padding:18px 0 14px}
.titlebar>div:first-child{display:contents}
.titlebar h1{grid-column:1;grid-row:1}
.titlebar>div>p{grid-column:1;grid-row:2}
.t-when{font-weight:650;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.titlebar h1{font-family:var(--serif);font-size:38px;font-weight:500;line-height:1.1;letter-spacing:-.6px;margin:0}
.titlebar p{margin:8px 0 0;font-size:15px;color:var(--ink2);display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap}
.tb-acts{grid-column:2;grid-row:2;justify-self:end;display:flex;gap:6px;margin-top:6px}
.tb-acts .btn[aria-pressed=true] .ic{fill:var(--ink)}
/* Save reads "Saved" while aria-pressed is true; src/rentlet.ts keeps aria-pressed current */
.tb-acts [data-rl-save]:not([aria-pressed=true]) .sv-on,.tb-acts [data-rl-save][aria-pressed=true] .sv-off{display:none}
/* the 36px buttons take taps across 44px (on phones they are 44px already) */
.tb-acts .btn{position:relative}
.tb-acts .btn::after{content:'';position:absolute;inset:-5px 0}

/* tiles */
.tile{background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden;min-width:0;transition:box-shadow .25s,transform .25s var(--ease)}
.tile:hover{box-shadow:var(--lift)}
.tile .corner{position:absolute;right:14px;top:14px;font-size:12px;color:var(--muted);font-weight:600}

/* dates block (shared by F1/F2/F3) */
.dates{display:grid;gap:14px;margin-top:12px}
.dates .avail{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dates .avail b{font-size:28px;font-weight:700;letter-spacing:-.7px;font-variant-numeric:tabular-nums}
.dates .avail span{font-size:14px;color:var(--muted)}
.fitbox{display:flex;align-items:flex-start;gap:10px;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.35}
.fitbox .ic{width:20px;height:20px}
.fitbox b{display:block;font-size:15px}
.fitbox.ok{background:var(--ok-bg);color:var(--ok)}
.fitbox.wa{background:var(--warn-bg);color:var(--warn)}
.fitbox.no{background:var(--soft);color:var(--ink2)}
.fitbox .fbar{display:block;height:5px;border-radius:99px;background:rgba(0,0,0,.08);margin-top:8px;overflow:hidden}
.fitbox .fbar i{display:block;height:100%;border-radius:inherit;background:currentColor;transition:width .6s var(--ease)}
.fitbox .n{margin-left:auto;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fitbox .n small{font-size:12px;font-weight:600}
.fitbox.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.03)}}
.yours{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.yours label{border:1px solid var(--line);border-radius:14px;padding:7px 10px;min-width:0;display:block;cursor:pointer;transition:border-color .2s}
.yours label:focus-within,.yours label:hover{border-color:var(--ink)}
.yours small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.yours input{border:0;padding:2px 0 0;font-size:14px;min-width:0;font-weight:650;width:100%;background:transparent;font-variant-numeric:tabular-nums}
/* flip cost card */
.flipc{perspective:900px;cursor:pointer}
.flipc .fi{position:relative;transform-style:preserve-3d;transition:transform .7s var(--ease),height .5s var(--ease)}
.flipc.on .fi{transform:rotateY(180deg)}
.flipc .fa,.flipc .fb{position:absolute;left:0;right:0;top:0;bottom:0;min-width:0;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipc .fb{transform:rotateY(180deg)}
/* listing number, report, original rent, furniture extras */
/* the listing number reads as plain grey text; the copy icon shows on hover */
.lcode{display:inline-flex!important;align-items:center;gap:5px;width:auto!important;margin:0;padding:0;border:0;background:none;font-size:inherit;font-weight:400;color:var(--muted);cursor:pointer}
.lcode .ic{width:13px;height:13px;opacity:0;transition:opacity .15s}
.lcode:hover,.lcode:focus-visible{color:var(--ink)}
.lcode:hover .ic,.lcode:focus-visible .ic{opacity:1}
.was{margin:6px 0 0;font-size:13px;color:var(--muted)}
.was s{text-decoration-thickness:1.5px}
.was b{color:var(--ok);font-weight:650}
.tlx{text-transform:none;letter-spacing:0;font-weight:600}
.fx{margin:10px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.fx b{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:2px}
/* roommates: tap the row to open the details */
.mates{display:flex!important;align-items:center;gap:12px;width:100%!important;margin:14px 0 0;padding:10px 12px 10px 10px;border:1px solid var(--hair);border-radius:16px;background:#fff;text-align:left;cursor:pointer;transition:border-color .2s,box-shadow .25s}
.mates:hover{border-color:var(--line);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.mates .ppl{margin:0;flex:none}
.mates .msum{flex:1;min-width:0}
.mates .msum b{display:block;font-size:14px}
.mates .msum span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mates>.ic{width:16px;height:16px;color:var(--muted);transition:transform .35s var(--ease)}
.mates[aria-expanded=true]>.ic{transform:rotate(180deg)}
.mates[aria-expanded=true] .ppl i:nth-child(2){transform:translateX(6px)}.mates[aria-expanded=true] .ppl i:nth-child(3){transform:translateX(12px)}
.mdet{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.mdet.open{grid-template-rows:1fr}
.mdet>div{overflow:hidden;min-height:0}
.mdet dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:14px 2px 0}
.mdet dt{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.mdet dd{margin:2px 0 0;font-size:14px;font-weight:600}
.mdet p{margin:10px 2px 2px;font-size:13px;color:var(--muted);line-height:1.45}
.mdet p.mnote{margin-top:6px;color:var(--ink2)}
.mdet dl>div{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .4s var(--ease)}
.mdet.open dl>div{opacity:1;transform:none}
.mdet.open dl>div:nth-child(2){transition-delay:.04s}.mdet.open dl>div:nth-child(3){transition-delay:.08s}.mdet.open dl>div:nth-child(4){transition-delay:.12s}
/* layout code with a small explanation pop-up */
.lgc{position:relative}
.lgc b{display:flex!important;align-items:center;gap:4px}
.lgb{width:20px!important;height:20px;min-width:0;margin:0;padding:0;border:0;border-radius:50%;background:none;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer}
.lgb .ic{width:15px;height:15px}
.lgb:hover,.lgc.open .lgb{color:var(--ink);background:var(--soft)}
.lgpop{position:absolute;left:0;top:calc(100% + 8px);z-index:20;width:min(300px,80cqw);padding:14px 16px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.25);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.lgc.open .lgpop{opacity:1;transform:none;pointer-events:auto}
.lgpop b{font-size:14px}
.lgpop p{margin:6px 0 0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.82)}
/* amenities: all six options, the ones this building lacks are faded */
.amen{padding:0 6px}
.about .amen p.tl{padding:0;font-size:12px;line-height:normal;color:var(--muted)}
.amen-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.amen-row span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:6px 11px 6px 9px;border-radius:99px;background:#fff;box-shadow:0 0 0 1px #e6e6ea}
.amen-row .ic{width:15px;height:15px;stroke-width:1.6}
.amen-row span.off{color:var(--muted);background:transparent;box-shadow:0 0 0 1px #e6e6ea;font-weight:500;text-decoration:line-through;text-decoration-color:#b0b0b5}
.amen-row span.off .ic{opacity:.5}
/* gallery: a full-screen button and the video slide */
.gal .expand{position:absolute;right:14px;top:14px;z-index:2;width:34px!important;height:34px;min-width:0;margin:0;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.gal .expand .ic{width:15px;height:15px}
.gal .track>div{cursor:zoom-in;position:relative}
.vplay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35))}
.vplay .ic{width:64px;height:64px;padding:18px 16px 18px 20px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);fill:var(--ink);stroke:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.vplay b{font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.thumbs .vb{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.22)}
.thumbs .vb .ic{width:22px;height:22px;fill:#fff;stroke:none}
.lbx{position:fixed;inset:0;z-index:80;background:rgba(12,12,14,.94);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .22s}
.lbx.on{opacity:1}
.lbx[hidden]{display:none}
.lb-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:64px 80px}
.lb-stage img,.lb-stage video{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
.lb-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;padding:16px 20px;color:#fff;font-size:14px;z-index:2}
.lb-top #lbCount{font-variant-numeric:tabular-nums;opacity:.7}
.lb-top #lbCap{font-weight:650;flex:1}
.lb-top button,.lb-nav{width:44px!important;height:44px;min-width:0;margin:0;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer}
.lb-top button:hover,.lb-nav:hover{background:rgba(255,255,255,.22)}
.lb-nav{position:absolute;top:50%;margin-top:-22px;z-index:2}
.lb-nav.l{left:16px}.lb-nav.r{right:16px}
.lbx .ic{width:20px;height:20px;stroke:currentColor}
@media (max-width:640px){.lb-stage{padding:60px 10px}.lb-nav{top:auto;bottom:18px}}
/* report form */
.sheet.rep{max-height:min(640px,calc(100vh - 32px));overflow:auto}
.reasons{display:grid;gap:8px;margin:4px 0 12px}
.reasons label{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s,background .2s}
.reasons label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.reasons input{margin:3px 0 0;accent-color:var(--ink)}
.reasons b{display:block;font-size:14px}
.reasons em{display:block;font-style:normal;font-size:13px;color:var(--muted);margin-top:1px}
.sheet.rep textarea{min-height:72px}
.btn[disabled]{opacity:.4;cursor:default}
/* receipt printer: a slot slides in at the top, paper feeds down in steps, the front lifts away */
.billc{cursor:pointer;position:relative}
/* what stays, under the photo: icon + name */
.fl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px;margin-top:14px}
.fl span{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);min-width:0}
.fl img{width:22px;height:22px;flex:none}
.fnote{margin:14px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.fnote b{color:var(--ink2);font-weight:650}
/* review variants for the space under the right card (desktop only) */
.panel.rgt .fl{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.panel.rgt .fl span{font-size:14px}
.panel.rgt .fl img{width:20px;height:20px}
@container (min-width:1001px){
  .site[data-fill=B] .bookc{position:sticky;top:96px}
  .site[data-fill=B] .panel.mid .gal{aspect-ratio:16/10}
  .site[data-fill=C] .panel.mid .gal{aspect-ratio:16/9}
  .site[data-fill=C] .panel.mid .thumbs{display:none}
}
/* the right column's one card: host, price, the room's dates, Message, quick asks, first-month estimate */
.bookc .host{margin-top:0}
.bookc .host>div>span{display:block;line-height:1.4;margin-top:2px}
.bk-hr{border:0;border-top:1px solid var(--hair);margin:18px 0}
.bk-pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.bk-pr b{font-family:var(--serif);font-size:38px;font-weight:500;letter-spacing:-.6px;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.bk-pr small{font-size:14px;color:var(--muted)}
.bk-pr .bk-neg{align-self:center;margin-left:4px}
.bk-save{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.bk-save s{color:var(--muted);font-variant-numeric:tabular-nums}
.bk-save:empty{display:none}
.bk-save .ok{color:var(--ok);font-weight:600}.bk-save .wa{color:var(--warn);font-weight:600}
.bk-dates{margin-top:16px;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#fff}
.bk-dates div{padding:10px 14px;min-width:0}
.bk-dates div+div{border-left:1px solid var(--line)}
.bk-dates small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.bk-dates span{display:block;font-size:14px;font-variant-numeric:tabular-nums} /* never cut off; wraps only if it must */
.bk-msg{width:100%!important;height:48px;margin:14px 0 0!important}
.bookc .asks{margin:14px 0 0}
.bookc .safe{margin-top:12px}
/* estimate row: the receipt prints out of a slot under it and hangs over the page; the card keeps its size */
.billc.estc{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);z-index:5}
.billc.estc .fi{height:auto!important}
.billc.estc .fa{position:static;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;font-size:14px}
.billc.estc .fa u{font-weight:600;text-underline-offset:3px}
.billc.estc .fa span{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.billc.estc .fa .ic{width:14px;height:14px}
.billc.estc.on .fa{opacity:1;transform:none}
.billc.estc .slot{top:calc(100% + 4px)}
.billc.estc .feed{top:calc(100% + 9px);bottom:auto;left:0;right:0;z-index:40}
.billc.estc.on{z-index:40}
.billc.estc.on .paper{box-shadow:0 22px 44px rgba(30,25,40,.2)}
.billc .fi{position:relative;transition:height .5s var(--ease)}
.billc .fa{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:opacity .25s,transform .35s var(--ease)}
.billc .fa .big{font-size:36px;margin-top:8px}
.billc.on .fa{opacity:0;transform:translateY(-14px)}
.billc .slot{position:absolute;left:-6px;right:-6px;top:0;height:10px;border-radius:6px;background:linear-gradient(180deg,#2b2b30,#121215);box-shadow:inset 0 -2px 0 rgba(255,255,255,.08),0 3px 8px rgba(0,0,0,.18);transform:scaleX(0);opacity:0;transition:transform .3s var(--ease),opacity .2s;z-index:3}
.billc.on .slot{transform:none;opacity:1}
.billc .feed{position:absolute;left:2px;right:2px;top:5px;bottom:0;overflow:hidden;pointer-events:none}
.billc .paper{position:relative;margin-bottom:8px;padding:10px 13px 10px;background-color:#fffdf6;font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color:#2a2826;font-size:12px;line-height:1.42;
  box-shadow:0 1px 0 rgba(0,0,0,.04);transform:translateY(-110%);
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.018) 0 1px,transparent 1px 3px)}
/* torn edge: a row of paper-coloured teeth hanging under the receipt */
.billc .paper::after{content:"";position:absolute;left:0;right:0;top:100%;height:7px;background:linear-gradient(135deg,#fffdf6 50%,transparent 50%) 0 0/10px 7px repeat-x,linear-gradient(-135deg,#fffdf6 50%,transparent 50%) 0 0/10px 7px repeat-x;filter:drop-shadow(0 2px 1px rgba(0,0,0,.05))}
.billc.on .feed{pointer-events:auto}
.billc.on .paper{animation:printfeed 1.25s steps(14,end) .25s forwards}
.billc.out .paper{animation:printback .35s var(--ease) forwards}
@keyframes printfeed{from{transform:translateY(-110%)}to{transform:none}}
@keyframes printback{from{transform:none}to{transform:translateY(-110%)}}
.paper .rh{display:flex;justify-content:space-between;gap:8px;margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.6px;color:#8a857c;border-bottom:1px dashed #d6d0c4;padding-bottom:4px}
.paper .rl{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.paper .rl span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.paper .rl i{flex:1;min-width:10px;border-bottom:1.5px dotted #c9c2b4;transform:translateY(-4px)}
.paper .rl b{font-weight:600;font-variant-numeric:tabular-nums}
.paper .tot{margin-top:4px;padding-top:4px;border-top:1.5px solid #2a2826;font-weight:700;font-size:14px}
.paper .tot b{font-weight:700}
.paper .rf{margin:4px 0 0;font-size:10px;color:#8a857c;line-height:1.35;white-space:normal}
/* back of the price card: the split as a 2 × 2 grid so it fits the front's height */
.flipc .fin{width:100%}
.flipc .fa{align-items:center;text-align:center}
.flipc .fa .big{font-size:36px;margin-top:8px}
.fbh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fbh b{font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.fbh b small{font-size:12px;font-weight:600;color:var(--muted)}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:9px}
.split div{background:var(--soft);border-radius:12px;padding:6px 10px;min-width:0}
.split span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split b{display:block;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.paid{margin:7px 0 0;font-size:12px;color:var(--muted);line-height:1.35}
.lines{display:grid;gap:9px;margin-top:14px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:8px}
.lines div span:first-child{color:var(--ink2)}
.lines .t{border-top:1px solid var(--ink);padding-top:10px;margin-top:2px;font-weight:700}

/* furniture icons */
/* checks */
.checks{display:grid;gap:12px;margin-top:14px;font-size:14px}
.checks div{display:flex;justify-content:space-between;gap:8px;align-items:center}
.checks .ic{width:15px;height:15px}
/* people */
.ppl{display:flex;margin-top:14px}
.ppl i{width:40px;height:40px;border-radius:99px;border:3px solid #fff;margin-left:-10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:14px;color:#fff;transition:transform .3s var(--ease)}
.ppl i:first-child{margin-left:0}
.tile:hover .ppl i:nth-child(2){transform:translateX(6px)}.tile:hover .ppl i:nth-child(3){transform:translateX(12px)}
.prefs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.prefs span{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;background:#fff;border-radius:99px;padding:6px 11px 6px 9px;box-shadow:0 0 0 1px #e6e6ea}
.prefs img{width:14px;height:14px}
/* What stays / House rules: two sides of one block. Both sides share one grid cell; the side turned away
   collapses to no height halfway through the turn, so the block is always as tall as the side showing. */
.fflip{perspective:1400px}
.ff-in{display:grid;transition:transform .6s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.fflip.on .ff-in{transform:rotateY(180deg)}
.ff{grid-area:1/1;min-width:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ff.back{transform:rotateY(180deg)}
.fflip:not(.sw) .ff.back,.fflip.sw .ff.front{height:0;overflow:visible;pointer-events:none}
.ffh{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin:-12px 0 -6px}
.ffturn{display:inline-flex!important;align-items:center;gap:6px;width:auto!important;min-width:0;height:44px;margin:0 -6px 0 0;padding:0 6px 0 12px;border:0;border-radius:999px;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.ffturn.bk{margin:0 0 0 -6px;padding:0 12px 0 6px}
.ffturn:hover{background:#ececef}
.ffturn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.ffturn:hover svg{transform:translateX(2px)}.ffturn.bk:hover svg{transform:translateX(-2px)}
@media (prefers-reduced-motion:reduce){.ff-in{transition:none}.fflip.on .ff-in{transform:none}.ff.back{transform:none}.fflip:not(.sw) .ff.back,.fflip.sw .ff.front{visibility:hidden}}
/* host */
.host{display:flex;gap:12px;align-items:center;margin-top:14px}
.host b{display:flex!important;align-items:center;gap:8px}
.host .marks{margin-left:auto}
.marks{display:inline-flex;gap:4px}
.vm{position:relative;width:26px!important;height:26px;min-width:0;margin:0;padding:0;border:0;border-radius:50%;background:var(--soft);color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;cursor:default;transition:transform .25s var(--ease),background .2s}
.vm .ic{width:14px;height:14px}
.vm i{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
.vm i svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.vm.ok i{background:var(--ok)}.vm.wa i,.vm.pending i,.vm.more i{background:#e07912}.vm.rejected i{background:#c13515}.vm.none i{background:#b0b0b0}
.vm.none .ic,.vm.rejected .ic{opacity:.55}
.vm:hover,.vm:focus-visible{transform:translateY(-2px);background:#ececef}
.vm::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;width:max-content;max-width:190px;white-space:normal;text-align:center;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);z-index:5}
.vm:hover::after,.vm:focus-visible::after,.vm.show::after{opacity:1;transform:translateX(-50%)}
.marks .vm:last-child::after{left:auto;right:-6px;transform:translateY(4px)}
.marks .vm:last-child:hover::after,.marks .vm:last-child:focus-visible::after,.marks .vm:last-child.show::after{transform:none}
.safe{display:block;text-align:center;font-size:13px;margin-top:10px}
.avatar{width:44px;height:44px;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.host b{display:block;font-size:15px}.host span{font-size:13px;color:var(--muted)}
.asks{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{min-height:32px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;color:var(--ink2);text-align:left;width:auto}
.chip:hover{border-color:var(--ink)}
/* gallery tile */
.gal{position:relative;height:100%;--sq:24px}
.gal .track{display:flex;height:100%;transition:transform .6s var(--ease)}
.gal .track>div{flex:0 0 100%;height:100%}
.gal .track img{width:100%;height:100%;object-fit:cover;display:block}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:99px;border:0;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.gal:hover .nav{opacity:1}
.gal .nav.p{left:12px}.gal .nav.n{right:12px}
.panel.mid .gal{overflow:hidden;box-shadow:0 1px 2px rgba(23,20,28,.08),0 12px 24px -8px rgba(30,25,40,.30),0 30px 50px -26px rgba(30,25,40,.38);transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.panel.mid .gal:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(23,20,28,.08),0 16px 30px -8px rgba(30,25,40,.32),0 38px 60px -26px rgba(30,25,40,.42)}
/* only a soft shade at the bottom so the dots stay readable; no white rim (its corner never matched the squircle clip) */
.gal::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:linear-gradient(180deg,transparent 72%,rgba(0,0,0,.22))}
.gal .cap,.gal .nav,.gal .dots,.gal .pricep{z-index:2}
.thumbs button{box-shadow:0 1px 2px rgba(23,20,28,.08),0 6px 12px -6px rgba(30,25,40,.3)}
.thumbs button::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 0 1px rgba(255,255,255,.12)}
.gal .cap{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.95);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:650}
.gal .dots{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:5px}
.gal .dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.6);transition:width .25s}
.gal .dots i.on{width:16px;background:#fff}
.gal .pricep{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.96);border-radius:99px;padding:7px 13px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dmon{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;font-weight:600;color:var(--muted)}
.gal .datep{position:absolute;right:14px;top:14px;z-index:2;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:8px 13px 8px 11px;box-shadow:0 2px 10px rgba(0,0,0,.14);font-variant-numeric:tabular-nums}
.gal .datep b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.15;white-space:nowrap}
.gal .datep small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:1px;white-space:nowrap}
.gal .pricep small{font-weight:600;color:var(--muted);font-size:12px}

/* ---------- F2 tri-fold ---------- */
/* keep the side margins of .wrap (24px) so narrow laptops never put content against the window edge */
.f2{padding-top:18px;padding-bottom:40px}
/* the right card never drops below ~300px, so names, dates and the price keep one line on narrow laptops */
.tri{display:grid;grid-template-columns:minmax(0,1fr) clamp(304px,30%,360px);min-height:clamp(560px,calc(var(--vh) - 238px),720px);perspective:1800px;filter:drop-shadow(0 26px 40px rgba(30,25,40,.16))}
.panel{background:#fff;padding:30px 28px;display:flex;flex-direction:column;gap:0;min-width:0;transition:transform 1s var(--ease);position:relative}
/* no-card version: the three columns sit straight on the page; things that were grey on white turn white on grey */
.site.flat .panel{background:transparent!important}
.site.flat .panel.mid,.site.flat .panel.rgt{border-color:transparent}
.site.flat .tri{filter:none}
.site.flat .tri{column-gap:8px}
.site.flat .panel.mid{padding-left:4px}.site.flat .panel.rgt{padding-right:4px}
.site.flat .panel .blk{border-top-color:#e6e6ea}
.site.flat .vm{background:#fff;box-shadow:0 0 0 1px #e6e6ea}
.site.flat .facts4 div{border-left-color:#e2e2e6}
.site.flat .billc .fa{background:none}
.panel.rgt{padding-left:24px;padding-right:24px;border-radius:0 28px 28px 0;transform-origin:0 50%;border-left:1px dashed var(--hair)}
.panel.mid{padding:30px 20px 20px;gap:18px;border-radius:28px 0 0 28px;border-right:1px dashed var(--hair)} /* photo top lines up with the right column (30px) */
/* the photo takes the width the map column used to have, at 3:2 */
.panel.mid .gal{flex:none;aspect-ratio:3/2;min-height:0;max-height:none;height:auto;--sq:22px}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;flex:none;padding:0 2px}
.thumbs button{aspect-ratio:16/10;border:0;padding:0;border-radius:12px;overflow:hidden;position:relative;background:var(--soft);transition:transform .25s var(--ease),opacity .25s}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button.on,.thumbs button:hover{opacity:1}
.thumbs button:hover{transform:translateY(-2px)}
.thumbs button.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink),0 6px 12px -6px rgba(30,25,40,.3)}
.about{flex:1 0 auto;display:flex;flex-direction:column;gap:20px;padding:6px 6px 4px}
.about p{padding:0 4px}
.about p{margin:0;font-size:15px;line-height:1.6;color:var(--ink2)}
.about p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.about p.open{display:block}
/* the host's own words, as a quote */
.hquote{margin:0;padding:0} /* no bar; the byline sits on the right (Founder, Oct 30) */
.about .hquote p{margin:0;padding:0;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.5;color:var(--ink)}
.about .hquote p.clamp{-webkit-line-clamp:3}
.hquote cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--muted);text-align:right}
.hquote .more-btn{margin:6px 0 0}
.more-btn{margin:-4px 0 0}
.more-btn{align-self:flex-start;width:auto!important;margin:-12px 0 0 4px;padding:0;border:0;background:none;font-size:14px;font-weight:650;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.facts4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.facts4 div{padding:2px 14px;border-left:1px solid var(--hair)}
.facts4 div:first-child{border-left:0;padding-left:4px}
.facts4 img,.facts4 .ic{width:20px;height:20px;display:block;margin-bottom:9px}
.facts4 img{filter:brightness(0);opacity:.86} /* the icon files come in different colours; show them all in ink */
.lgb{position:relative;height:18px!important;width:18px!important;margin:-2px 0 -2px 2px!important} /* the (i) no longer pushes the first fact down */
.lgb::before,.vm::before,.more-btn::before,.lcode::before{content:"";position:absolute;inset:-13px;border-radius:inherit}
.lcode{position:relative}
.more-btn::before{inset:-12px -8px} /* 44px hit areas around small controls */
.more-btn{position:relative}
.facts4 b{display:block;font-size:14px}
.facts4 span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.panel.rgt{z-index:2;transform-style:preserve-3d}
.panel.rgt{transition:transform 1s var(--ease),background-color .3s,border-color .3s}
.panel.mid{z-index:1;transition:border-radius .6s var(--ease)}
.panel .blk{border-top:1px solid var(--hair);padding:24px 0}
.panel .blk:first-child{border-top:0;padding-top:0}
.panel .blk:last-child{padding-bottom:0}
.tri-wrap{position:relative;margin-bottom:28px}
/* opening: the photo settles first, then the two side columns slide out from behind it */
.tri .panel.mid{transition:opacity .6s var(--ease),transform .8s var(--ease)}
.tri .panel.rgt{transition:opacity .7s var(--ease) .18s,transform .9s var(--ease) .12s}
.tri.intro .panel.mid{opacity:0;transform:scale(.97)}
.tri.intro .panel.rgt{opacity:0;transform:translateX(-28%)}
.tri.intro .panel.rgt{z-index:0}

/* friendly date fields: the native picker sits invisibly on top */
.yours label{position:relative}
.yours .shown{display:block;font-size:14px;font-weight:650;padding-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.yours input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
/* Getting around: full width under the room */
.near{margin:8px 0 34px}
.nb-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.nb-h h2{font-size:22px;letter-spacing:-.4px;margin:0}
.nb-h p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.nb-modes[hidden]{display:none}
.nb-modes{display:flex;background:#fff;border:1px solid var(--hair);border-radius:999px;padding:4px}
.nb-modes button{width:auto!important;min-width:0;margin:0;height:34px;padding:0 14px;border:0;border-radius:999px;background:none;font-size:13px;font-weight:650;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.nb-modes button[aria-pressed=true]{background:var(--ink);color:#fff}
.nb-box{display:grid;grid-template-columns:minmax(0,1fr) 340px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.nb-cats{grid-column:1/-1;display:flex;gap:2px;border-bottom:1px solid var(--hair);padding:0 12px;overflow-x:auto;scrollbar-width:none}

.nb-cats::-webkit-scrollbar{display:none}
.nb-cats button{width:auto!important;min-width:0;margin:0;flex:none;display:flex;align-items:center;gap:7px;height:50px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.nb-cats button:hover{color:var(--ink)}

.nb-map{position:relative;height:420px;background:#efeee9}
.nb-map>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.nb-lb{font-size:14px;font-weight:700;fill:#222;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.nb-pin circle{fill:#fff;stroke:#222;stroke-width:1.5}
.nb-pin g{color:#222}
.nb-pin.on circle{fill:#222}
.nb-pin.on g{color:#fff}
.nb-cap{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--ink2)}
.nb-list{border-left:1px solid var(--hair);padding:8px;overflow:auto;max-height:420px}
.nb-row{width:100%!important;min-width:0;margin:0;display:flex;align-items:center;gap:12px;padding:12px;border:0;border-radius:14px;background:none;text-align:left}
.nb-row:hover,.nb-row.on{background:var(--soft)}
.nb-i{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.nb-row.on .nb-i{background:var(--ink);color:#fff}
.nb-row.on .nb-t small{color:var(--ink2)}
.nb-t{flex:1;min-width:0}
.nb-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-t small{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-row em{font-style:normal;font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.nb-note{margin:6px 8px;font-size:13px;line-height:1.5;color:var(--muted)}

@container (max-width:760px){
  .nb-box{grid-template-columns:minmax(0,1fr)}
  .nb-map{height:300px}
  .nb-list{border-left:0;border-top:1px solid var(--hair);max-height:none}
  .nb-h{align-items:flex-start}
  .nb-modes{width:100%}
  .nb-modes button{flex:1;padding:0 6px}
  .nb-cats button{height:46px;padding:0 10px;font-size:14px}
}
/* more rooms */
.more{margin:8px 0 26px}
.more h2{font-size:22px;letter-spacing:-.4px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.more h2 a{font-size:14px;font-weight:600;color:var(--ink)}
.mrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mc{display:block;color:inherit;text-decoration:none;background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden;transition:transform .3s var(--ease),box-shadow .3s}
.mc:hover{transform:translateY(-4px);box-shadow:var(--lift)}
.mc .ph{aspect-ratio:16/9;overflow:hidden}
.mc .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.mc:hover .ph img{transform:scale(1.04)}
.mc:hover .ph img.flip{transform:scaleX(-1) scale(1.04)}
.mc .tx{padding:12px 14px 14px}
.mc .tx b{display:block;font-size:15px}
.mc .tx span{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.mc .tx span>b{white-space:nowrap;flex:none}
.mc .tx span>span{min-width:0}
.mc .tx .badge{margin-top:8px;display:inline-flex;justify-content:flex-start;gap:6px;width:auto;max-width:100%}
@container (max-width:860px){.mrow{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.mc{scroll-snap-align:start}}

/* dock + sheet + toast */
.dock{position:sticky;bottom:0;z-index:28;display:none;background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--hair);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
/* a full-width bar on the bottom edge, like Airbnb on phones: price and dates on the left, the action on the right */
.dock-in{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.dock .dp{display:grid;grid-template-columns:auto 1fr;column-gap:4px;align-items:baseline;min-width:0}
.dock .dp b{font-size:17px;font-variant-numeric:tabular-nums}
.dock .dp span{font-size:13px;color:var(--muted)}
.dock .dp small{grid-column:1/-1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .btn{height:44px;padding:0 18px;flex:none}
/* the dates never get cut: on the narrowest phones the button drops the host's name */
.dock .btn{white-space:nowrap}
@container (max-width:380px){.dock .dk-who{display:none}.dock .btn{padding:0 16px}}
@container (max-width:340px){.dock .dp small{white-space:normal;overflow:visible}}
/* the preview frame has rounded corners and no system safe area, so leave the room a real phone would */
.stage.phone .dock{padding:12px 22px 26px}
.below{padding:10px 0 60px}
@container (max-width:640px){.below{padding-bottom:20px}.gal .expand{width:40px!important;height:40px}}
.below details{background:none;border-top:1px solid var(--hair);margin:0}
.below details:last-child{border-bottom:1px solid var(--hair)}
.below summary{list-style:none;cursor:pointer;padding:18px 4px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
.below summary::-webkit-details-marker{display:none}
.below .in{padding:0 4px 18px;font-size:15px;color:var(--ink2);line-height:1.6}
.ov{position:fixed;inset:0;z-index:60;background:rgba(20,18,26,.45);display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:24px;width:min(520px,100%);padding:22px;box-shadow:var(--deep);animation:up .35s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
/* Share (Founder, Nov 4: C): one row of round icons; each name shows on hover or focus */
.shsheet{width:min(400px,100%)}
.shh{display:flex;align-items:center;justify-content:space-between;margin:-6px -8px 16px 0}
.shx{width:44px!important;height:44px;min-width:0;margin:0;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.shx:hover{background:#f2f2f4}
.shx svg,.shi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.shrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:360px){.shrow{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}}
.shi{position:relative;width:100%!important;max-width:52px;aspect-ratio:1;height:auto;justify-self:center;min-width:0;margin:0;padding:0;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.shi:hover,.shi[aria-pressed=true]{border-color:var(--ink);background:#f7f7f7}
.shi::after{content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);padding:4px 8px;border-radius:6px;background:#222;color:#fff;font-size:12px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.shi:hover::after,.shi:focus-visible::after{opacity:1}
.shqr{display:flex;gap:16px;align-items:center;margin-top:18px;padding:14px;border-radius:16px;background:#f7f7f7}
.shqr[hidden]{display:none}
.shqr .qr{width:120px;height:120px;flex:none;background:#fff;border-radius:10px;padding:4px}
.shqr .qr svg{width:100%;height:100%;display:block}
.shqr p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.sheet h3{margin:0;font-size:19px}
.sheet p{font-size:14px;color:var(--muted);margin:6px 0 14px}
.sheet textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px}
.sheet .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.rise{animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}

@container (max-width:1000px){
  .tri.intro .panel.rgt{transform:translateY(24px)}
  .tri{grid-template-columns:minmax(0,1fr);height:auto}
  .panel.mid{order:-1;border-radius:28px 28px 0 0}
  .facts4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel.rgt{border-radius:0 0 28px 28px;transform-origin:50% 0;border-left:0}
}
/* one column on phones and tablets: blocks leave their panels and are reordered by what people look at first:
   dates, photos, price, room facts, house rules or roommates, what stays, the map, then the host */
@container (max-width:1000px){
  /* .f2 resets the side padding; give tablets it back (phones keep their own 14px) */
  main.wrap{padding-left:20px;padding-right:20px}
  .tri{display:flex;flex-direction:column;gap:0;filter:none;min-height:0;perspective:none}
  .tri>.panel{display:contents}
  .tri>.panel>*{min-width:0;padding-left:4px;padding-right:4px}
  .tri .gal{order:2;margin-top:14px;min-height:0;max-height:none;aspect-ratio:4/3}
  .tri .thumbs{order:3;margin-top:12px}
  .tri .bookc{order:5}
  .tri .about{order:4}
  .tri .about{order:5}
  .tri .pblk{order:6}
  .tri .fblk{order:7}
  .tri>.panel>.blk,.tri .about{border-top:1px solid var(--hair);padding-top:24px;padding-bottom:24px;margin-top:22px}
  .tri .bookc{padding:16px;border:1px solid var(--hair);border-radius:16px;background:#fff}
  .tri .about{padding-left:4px;padding-right:4px}
  .site:not(.flat) .tri>.panel>.blk,.site:not(.flat) .tri .about{background:#fff;border-top:0;border-radius:22px;padding:22px 18px;margin-top:12px}
  .tri.intro .panel.rgt,.tri.intro .panel.mid{opacity:1;transform:none}
  /* room facts as a clean 2 × 2 grid */
  .tri .thumbs,.gal .cap{display:none}
  .gal{touch-action:pan-y}
  .facts4{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}
  .facts4 div,.facts4 div:first-child{border-left:0;padding:0}
  .facts4 img,.facts4 .ic{margin-bottom:8px}
}
@container (max-width:1120px){.msearch .seg-b,.msearch i.b{display:none}}
@container (max-width:980px){.msearch .seg .ic{display:none}.msearch .seg{padding:0 12px}}
@container (max-width:860px){.msrch{display:grid!important}.scard{top:calc(100% + 6px)}.msearch{display:none}.hdr .wrap{grid-template-columns:auto 1fr}.dock{display:block}.aipk.ai-m{display:inline-flex;width:44px;padding:0;justify-content:center;gap:0}.aipk.ai-m .t{display:none}.ai-gp{right:14px}}
@container (max-width:360px){.aipk.ai-m{display:none}}
@container (max-width:640px){
  .about .hquote p{font-size:18px}
  .fl{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .wrap,main.wrap{padding-left:14px;padding-right:14px}
  .hdr,.hdr .wrap{height:60px}
  .aicard{left:10px;right:10px;width:auto;transform:translateY(-8px) scale(.98)}
  .ai-gp{left:12px;right:12px;width:auto;max-width:none}
  .aicard.on{transform:none}
  .sfield kbd{display:none}
  .hide-s{display:none}
  /* title block: the name across the top, then the quiet line with Share and Save beside it */
  .titlebar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:8px;row-gap:6px;padding:14px 0 6px}
  .titlebar h1{grid-column:1/-1;font-size:28px;line-height:1.12;letter-spacing:-.4px}
  .titlebar>div>p{grid-column:1;grid-row:2;margin:0;font-size:14px;gap:2px 12px}
  .tb-acts{grid-column:2;grid-row:2;gap:0;margin:-6px -8px -6px 0}
  .tb-acts .btn{width:44px!important;height:44px!important}
  .tb-acts .btn::after{display:none}
  .tb-acts [data-report]{display:none}
  .tb-acts .btn{min-width:0;padding:0;border-radius:50%;justify-content:center}
  .tb-acts .btn span{display:none}
  .big{font-size:24px}
    }

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ICON={arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',check:'<path d="M5.5 12.5l4 4 9-9"/>',walk:'<circle cx="13" cy="4.8" r="1.6"/><path d="M10.5 21l2-6.5-2.5-2.5 1.5-4.5 3 2.5 2.5 1M10 8.5L7 10v3.5M12.5 14.5l2.5 2.5V21"/>',chat:'<path d="M5 6.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8l-4.5 3v-3H5A1.5 1.5 0 0 1 3.5 16V8A1.5 1.5 0 0 1 5 6.5z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',down:'<path d="M6 9l6 6 6-6"/>',l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',heart:'<path d="M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6z"/>',share:'<path d="M12 4v11M8 8l4-4 4 4M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/>',cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',wash:'<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8 6.5h2"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T=s=>Date.parse(s+'T00:00:00Z');
const md=s=>{const[,m,d]=s.split('-').map(Number);return `${MN[m-1]} ${d}`};
/* dates use the one site format in when-picker.js */
const mdy=s=>WhenPicker.day(s);
const span=(a,b)=>WhenPicker.label(a,b);
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const nightsBetween=(a,b)=>Math.round((T(b)-T(a))/864e5);
/* fields that match the mini program listing record: 8-digit listing number, layout code, original rent,
   shuttle coverage (covered / not_covered / unknown), amenities from the publish options, furniture level,
   extra items, usage note, and the roommate fields (count, gender, identity, schedule, cooking, cleanliness, guests) */
/* the six amenity options from the publish page, in the same order */
const AMEN=[['washer','Washer & dryer','<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8 6.5h1.5"/>'],['elevator','Elevator','<rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M12 3.5v17M8.5 10l1.5-2 1.5 2M12.5 14l1.5 2 1.5-2"/>'],['gym','Gym','<path d="M6.5 8v8M17.5 8v8M4 10v4M20 10v4M6.5 12h11"/>'],['store','Store downstairs','<path d="M4.5 9.5L6 5h12l1.5 4.5M5 9.5V19h14V9.5"/><path d="M4.5 9.5c0 1.4 1.1 2.3 2.4 2.3s2.4-.9 2.4-2.3c0 1.4 1.1 2.3 2.4 2.3s2.4-.9 2.4-2.3c0 1.4 1.1 2.3 2.4 2.3s2.3-.9 2.3-2.3M10 19v-4h4v4"/>'],['package','Package room','<path d="M12 3.5l7.5 4v9L12 20.5l-7.5-4v-9z"/><path d="M4.5 7.5L12 11.5l7.5-4M12 11.5v9"/>'],['parking','Parking','<rect x="4.5" y="4.5" width="15" height="15" rx="3"/><path d="M10 16V8h3a2.5 2.5 0 0 1 0 5h-3"/>']];
const LAYOUT_EN={Studio:'Studio: bedroom, living area and kitchen share one open space; the bathroom is separate.','1B1B':'1B1B: 1 bedroom and 1 bathroom, usually with a living room and kitchen.','2B1B':'2B1B: 2 bedrooms and 1 bathroom; the two bedrooms share it.','2B2B':'2B2B: 2 bedrooms and 2 bathrooms.','3B2B':'3B2B: 3 bedrooms and 2 bathrooms.','3B3B':'3B3B: 3 bedrooms and 3 bathrooms.'};
const LAYOUT_RULE='The first number counts bedrooms (B), the second bathrooms (B): 2B1B is 2 bedrooms, 1 bathroom.';
const FURN_L={bedframe:'Bed frame',mattress:'Mattress',bedding:'Bedding',wardrobe:'Wardrobe',desk:'Desk',chair:'Desk chair',lamp:'Desk lamp',floorlamp:'Floor lamp'};
let BUDGET=BudgetPicker.load(1500);
/* review only: three ways to fill the empty space under the right card (A: What stays and house rules move under it,
   B: the card follows you down and the photo is shorter, C: a shorter photo with no thumbnail row) */
let FILL='A';try{FILL=localStorage.getItem('cs-room-fill')||'A'}catch(_){}

/* active listings from Firestore (src/listings.ts toRoom), keyed by listing number; filled by RL_onListings */
const ROOMS={};
const KEY=(new URLSearchParams(location.search).get('room')||'').trim();
const ROOM={};
/* a listing photo is a full URL; bundled images are short names */
const pic=x=>!x?'data:image/gif;base64,R0lGODlhAQABAAAAACw=':(/[\/:]/.test(x)?x:`img/${x}.jpg`);
const allIn=()=>ROOM.price+(ROOM.util||0)+(ROOM.deposit||0);
let plan={start:'2027-01-03',end:'2027-04-30'};try{const sp=JSON.parse(sessionStorage.getItem('cs-plan')||'null');if(sp&&sp.start&&sp.end)plan=sp}catch(_){}
let AUTH=RL.authed;

/* existing matching rule: overlap of at least 30 nights and half the stay, rent within budget + 5% */
function fitOf(R){const need=nightsBetween(plan.start,plan.end),ov=Math.max(0,Math.round((Math.min(T(R.end),T(plan.end))-Math.max(T(R.start),T(plan.start)))/864e5)),whole=T(R.start)<=T(plan.start)&&T(R.end)>=T(plan.end);
  if(need<=0)return{k:'no',t:'Check your dates',s:'Move-out needs to be after move-in.',ov:0,need:0};
  if(whole)return{k:'ok',t:'Fits your dates',s:'Every night covered',ov,need};
  if(ov>=30&&ov>=need/2)return{k:'wa',t:`${Math.floor(ov/need*100)}% fits your dates`,s:T(R.start)>T(plan.start)?`Available from ${mdy(R.start)}`:`Ends ${mdy(R.end)}`,ov,need};
  return{k:'no',t:'Doesn’t fit these dates',s:`Available ${span(R.start,R.end)} only`,ov,need}}
const fit=()=>fitOf(ROOM);
const fitIcon=k=>k==='ok'?'check':'cal';
/* dates are picked as one sentence (when-picker.js), from the header When field or the dates row */
function pickDates(anchor){closeAi();closeSearch();WhenPicker.open({anchor,start:plan.start,end:plan.end,onDone:(s,e)=>{plan={...plan,start:s,end:e};drawDates();toast(`Your dates: ${WhenPicker.label(s,e)}`)}})}
/* when dates change: update the verdict, count the covered nights, refresh the other rooms */
/* budget: same picker as the homepage; the histogram shows the rooms on this demo */
function pickBudget(anchor){closeAi();closeSearch();BudgetPicker.open({anchor,value:BUDGET,prices:Object.values(ROOMS).map(R=>R.price),onDone:v=>{BUDGET=v;BudgetPicker.save(v);drawBudget();toast(`Your budget: ${BudgetPicker.label(v).toLowerCase()}`)}})}
function drawBudget(){$$('[data-bud]').forEach(e=>e.textContent=BudgetPicker.label(BUDGET));const sv=$('[data-bsave]');if(sv)sv.innerHTML=saveLine();const m=$('#moreRooms');if(m)m.innerHTML=moreCards()}
function drawDates(){try{sessionStorage.setItem('cs-plan',JSON.stringify(plan))}catch(_){}
  $$('[data-when]').forEach(e=>e.textContent=WhenPicker.label(plan.start,plan.end));
  const m=$('#moreRooms');if(m)m.innerHTML=moreCards()}
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-pin]')&&t.value){plan={...plan,start:t.value};drawDates()}if(t.matches('[data-pout]')&&t.value){plan={...plan,end:t.value};drawDates()}});
document.addEventListener('click',e=>{const i=e.target.closest('.yours label')?.querySelector('input');if(i&&i.showPicker){try{i.showPicker()}catch(_){}}});

let P=[];
/* photos and the room video, in the order the mini program shows them; any slide opens full screen */
const MEDIA=()=>P.map(p=>({t:'img',src:pic(p[0]),cap:p[1],flip:!!p[2]})).concat(ROOM.video?[{t:'video',src:ROOM.video,poster:pic((P[1]||P[0]||[])[0]),cap:'Video tour',flip:false}]:[]);
const gallery=()=>{const M=MEDIA();return `<div class="sqr gal" data-gal><div class="track">${M.map((m,i)=>`<div data-open-lb="${i}">${m.t==='img'?`<img src="${m.src}" alt="${m.cap}" class="${m.flip?'flip':''}">`:`<img src="${m.poster}" alt="" class="${m.flip?'flip':''}"><span class="vplay">${ic2('play')}<b>Play video tour</b></span>`}</div>`).join('')}</div><span class="cap" data-cap>${M[0].cap}</span><button class="nav p" data-gp aria-label="Previous">${ic('l','sm')}</button><button class="nav n" data-gn aria-label="Next">${ic('r','sm')}</button><button type="button" class="expand" data-open-lb-cur aria-label="View full screen" title="View full screen">${ic2('full')}</button><div class="dots">${M.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div></div>`};
function bindGal(){const M=MEDIA();$$('[data-gal]').forEach(gl=>{let i=0;const tr=$('.track',gl),pn=gl.closest('.panel'),go=n=>{i=(n+M.length)%M.length;tr.style.transform=`translateX(${-i*100}%)`;if(pn)$$('[data-thumb]',pn).forEach((b,j)=>b.classList.toggle('on',j===i));$('[data-cap]',gl).textContent=M[i].cap;$$('.dots i',gl).forEach((d,j)=>d.classList.toggle('on',j===i))};
  if(pn)$$('[data-thumb]',pn).forEach(b=>b.onclick=()=>go(+b.dataset.thumb));
  $('[data-gp]',gl).onclick=e=>{e.stopPropagation();go(i-1)};$('[data-gn]',gl).onclick=e=>{e.stopPropagation();go(i+1)};
  $('[data-open-lb-cur]',gl).onclick=e=>{e.stopPropagation();openLb(i)};
  let sx=null,moved=false;gl.addEventListener('pointerdown',e=>{sx=e.clientX;moved=false});gl.addEventListener('pointerup',e=>{if(sx!==null&&Math.abs(e.clientX-sx)>40){moved=true;go(i+(e.clientX<sx?1:-1))}sx=null});
  gl.addEventListener('click',e=>{if(moved||e.target.closest('button'))return;openLb(i)})})}
/* full-screen viewer for photos and the video */
let lbi=0;
function lbShow(){const M=MEDIA(),m=M[lbi],st=$('#lbStage');st.innerHTML=m.t==='img'?`<img src="${m.src}" alt="${m.cap}" class="${m.flip?'flip':''}">`:`<video src="${m.src}" poster="${m.poster}" controls autoplay playsinline muted></video>`;
  const v=$('video',st);if(v)v.addEventListener('loadedmetadata',()=>{if(v.duration===Infinity){v.currentTime=1e9;v.addEventListener('timeupdate',function f(){v.removeEventListener('timeupdate',f);v.currentTime=0;v.play().catch(()=>{})})}});/* a recorded clip has no length in its header until the end is read once */
  $('#lbCount').textContent=`${lbi+1} / ${M.length}`;$('#lbCap').textContent=m.cap}
function openLb(i){lbi=i;lbShow();const lb=$('#lb');lb.hidden=false;requestAnimationFrame(()=>lb.classList.add('on'));$('#lbClose').focus()}
function closeLb(){const lb=$('#lb');lb.classList.remove('on');setTimeout(()=>{lb.hidden=true;$('#lbStage').innerHTML=''},reduced?0:220)}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
document.addEventListener('click',e=>{const t=e.target;
  const fl=t.closest('[data-flip]');if(fl){if(fl.classList.contains('on')){fl.classList.add('out');setTimeout(()=>fl.classList.remove('on','out'),reduced?0:330)}else fl.classList.add('on');return}

  const dy=t.closest('[data-wopen]');if(dy){pickDates(dy);return}
  const bo=t.closest('[data-bopen]');if(bo){pickBudget(bo);return}
  const nc=t.closest('[data-ncat]');if(nc){nb.cat=nc.dataset.ncat;nb.on=0;drawNear();return}

  const ts=t.closest('[data-toast]');if(ts)return toast(ts.dataset.toast);
  if(t.closest('[data-sopen]')){const c=$('#sCard');c.hidden?openSearch():closeSearch();return}

  if(t.closest('[data-aipick]')){$('#aiCard').hidden?openAi(false):closeAi(false);return}

  if(t.closest('[data-aiclose]')){closeAi(true);return}
  if(!t.closest('#aiCard'))closeAi(false);
  const lc=t.closest('[data-code]');if(lc){const c=lc.dataset.code;(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast(`Listing number ${c} copied.`),()=>toast(`Listing number: ${c}`));return}
  const mt=t.closest('[data-mates]');if(mt){const o=mt.getAttribute('aria-expanded')!=='true';mt.setAttribute('aria-expanded',o);mt.nextElementSibling.classList.toggle('open',o);return}
  const lg=t.closest('[data-layout]');if(lg){const o=lg.getAttribute('aria-expanded')!=='true';lg.setAttribute('aria-expanded',o);lg.closest('.lgc').classList.toggle('open',o);return}
  if(!t.closest('.lgpop'))$$('.lgc.open').forEach(c=>{c.classList.remove('open');$('[data-layout]',c).setAttribute('aria-expanded','false')});
  if(t.closest('[data-report]')){gate('report',()=>{$$('#rep input[name=rr]').forEach(r=>r.checked=false);$('#repTx').value='';$('#repGo').disabled=true;$('#rep').classList.add('on')});return}
  if(t.id==='repGo'){$('#rep').classList.remove('on');return toast(`Thanks. We’ll review listing #${ROOM.code}.`)}
  const mo=t.closest('[data-more]');if(mo){const p=$('[data-clamp]'),o=p.classList.toggle('open');mo.textContent=o?'Show less':'Read more';return}
  const vm=t.closest('.vm');if(vm){vm.classList.add('show');clearTimeout(vm._t);vm._t=setTimeout(()=>vm.classList.remove('show'),1800);return}
  if(t.closest('[data-close]')||t.classList.contains('ov'))$$('.ov').forEach(o=>o.classList.remove('on'))});
/* Send: src/chat.ts starts the conversation (or adds to the one that exists) with this first message, then the thread opens */
const SEND_FAIL={own:'This is your own listing.',gone:'This listing is no longer available.',blocked:'This conversation is closed.',failed:'Couldn’t send. Check your connection and try again.'};
$('#send').onclick=()=>{const b=$('#send'),v=$('#msgBox').value;if(b.disabled)return;if(!v.trim()){$('#msgBox').focus();return}
  if(!window.RentletChat)return toast('Still loading. Try again in a moment.');
  b.disabled=true;b.textContent='Sending…';
  RentletChat.start(KEY,v).then(r=>{
    if(r.ok){location.href=`messages.html?c=${encodeURIComponent(r.id)}`;return}
    b.disabled=false;b.textContent='Send message';
    if(r.reason==='signin'){$('#msg').classList.remove('on');AUTH=false;gate('message',()=>$('#msg').classList.add('on'));return}
    toast(SEND_FAIL[r.reason]||SEND_FAIL.failed)},()=>{b.disabled=false;b.textContent='Send message';toast(SEND_FAIL.failed)})};
