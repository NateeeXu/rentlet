<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages · Rentlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script src="when-picker.js?v=7860cfd6"></script>
<style>
:root{
  --canvas:#f7f7f7;--ink:#222;--ink2:#484848;--muted:#717171;--hair:#e8e8e8;--ring:#c4c4c4;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--ease:cubic-bezier(.22,1,.36,1);
  --glass:rgba(255,255,255,.66);--glass-fx:blur(24px) saturate(1.6);--glass-bd:1px solid rgba(255,255,255,.75);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.16),0 2px 6px rgba(30,25,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img,video{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flip{transform:scaleX(-1)}

/* the page is the app: one full-height frame */
.stage{height:100vh;height:100dvh;min-height:480px;background:#fff}

/* ---------- site ---------- */
.site{container-type:inline-size;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#fff}
.hdr{flex:none;background:#fff;border-bottom:1px solid var(--hair)}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:64px;padding:0 24px}
.hdr .logo{display:flex;align-items:center;min-height:44px}
.hdr .logo img{height:24px}
/* the right end: Saved and Messages (signed in), then the menu (rentlet-boot.js draws all three) */
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:600;white-space:nowrap;width:auto;flex:0 0 auto;margin:0;background:none;text-decoration:none;transition:transform .18s,background .18s,border-color .18s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-primary[disabled]{background:#c4c4c4;cursor:not-allowed}
.btn-secondary{background:#fff;border-color:var(--hair);color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink)}
.btn.wide{width:100%;white-space:normal;text-align:center;line-height:1.3;padding:10px 18px}
.ibtn{width:44px;height:44px;border-radius:99px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ibtn:hover{background:var(--canvas)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 300px;position:relative}
@container (max-width:1100px){.body{grid-template-columns:280px minmax(0,1fr) 280px}}

/* inbox */
.inbox{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:#fff}
.inbox-h{padding:16px 18px 0}
.inbox-h h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:0;letter-spacing:-.4px}
.inbox-t{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.tabs{display:flex;gap:18px;margin-top:6px;border-bottom:1px solid var(--hair)}
.tabs button{background:none;border:0;min-height:44px;padding:0;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tabs .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--ink);margin-left:6px}
.search{margin:12px 18px 6px;min-height:44px;border-radius:99px;background:var(--canvas);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--ink);height:44px}
.search input::placeholder{color:var(--muted)}
.undo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 18px;padding:0 0 0 14px;border:1px solid var(--hair);border-radius:14px;font-size:13px;color:var(--ink2)}
.undo button{border:0;background:none;font-weight:600;font-size:13px;min-height:44px;padding:0 14px;text-decoration:underline;text-underline-offset:3px}
.convs{overflow:auto;flex:1;padding:4px 8px 12px}
.conv{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:16px;border:0;background:none;width:100%;text-align:left;min-height:72px}
.conv:hover{background:var(--canvas)}
.conv.on{background:var(--canvas)}
.cv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cv-top b{font-size:15px}
.cv-top time{font-size:12px;color:var(--muted);flex:none}
.conv .rel{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .last{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:1px}
.conv .last span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.conv.unread .last span,.conv.unread .cv-top b{color:var(--ink);font-weight:700}
.unread-dot{width:8px;height:8px;border-radius:99px;background:var(--ink);flex:none}
.unread-dot.mu{background:var(--ring)}
/* a conversation row: options on hover or focus (mouse), hold or right-click */
.conv-w{position:relative}
.conv-w .rowm{position:absolute;right:6px;top:50%;margin-top:-22px;background:#fff;border-color:var(--hair);opacity:0;pointer-events:none;transition:opacity .15s}
.conv-w:hover .rowm,.conv-w .rowm:focus-visible{opacity:1;pointer-events:auto}
.conv-w.held .conv{background:var(--canvas)}
.cv-top .fl{display:inline-flex;align-items:center;gap:6px;flex:none;color:var(--muted)}
.cv-top .fl .ic{width:14px;height:14px}
.av{width:48px;height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;position:relative;flex:none}
.av .vf{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:99px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--hair)}
.av .vf .ic{width:12px;height:12px;stroke-width:2.4}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty p{margin:0 0 14px}

/* thread */
.thread{display:flex;flex-direction:column;min-height:0;background:#fff}
.th-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--hair);flex:none;min-height:64px}
.th-h .av{width:40px;height:40px;font-size:15px}
.th-h .grow{flex:1;min-width:0}
.th-h b{font-size:16px;display:block}
.th-h .grow span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-h .back{display:none;margin-left:-8px}
.who{flex:1;min-width:0;display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:2px 6px 2px 2px;border-radius:14px;min-height:44px}
.who:hover{background:var(--canvas)}
/* profile */
.pf-top{display:flex;gap:14px;align-items:center}
.pf-top .av{width:64px;height:64px;font-size:24px}
.pf-top h2{font-size:20px;margin:0}
.pf-top p{margin:4px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border:1px solid var(--hair);border-radius:99px;font-size:12px;font-weight:600;color:var(--ink)}
.pf-ver{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.pf-ver li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.pf-ver li .ic{margin-top:2px;color:var(--muted)}
.pf-ver li.ok .ic{color:var(--ink)}
.pf-ver b{display:block;font-weight:600}
.pf-ver small{display:block;font-size:12px;color:var(--muted)}
.pf-m{font-size:13px;color:var(--muted);margin:12px 0 0}
.pf .card{margin-top:14px}
.pf-cards{display:grid;gap:14px;margin-top:14px}
.pf .pf-cards>.card{margin-top:0}
.pf-about{font-size:15px;line-height:1.45;margin:14px 0 0}
.pf-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pf-tags span{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--canvas);color:var(--ink2)}
.pf .acts{margin-top:18px}
.pf-room .taken{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.reqc{padding:14px}
.reqc .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.reqc .ct b{font-size:14px}
.reqc .unit{font-size:12px;color:var(--muted);white-space:nowrap}
.reqc .meta{font-size:13px;color:var(--muted);margin:2px 0 0}
.reqc .legs{margin-top:8px}
.reqc .leg{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:7px 0;font-size:14px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums}
.reqc .leg-k{font-size:12px;color:var(--muted);font-weight:600;width:62px}
.reqc .pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--canvas);color:var(--ink2);white-space:nowrap;margin-left:auto}
.reqc .bud{font-size:13px;color:var(--muted);margin:8px 0 0}
.reqc .quote{font-size:14px;margin:8px 0 0;color:var(--ink2)}
.pp{position:absolute;top:0;bottom:0;right:0;left:320px;z-index:30;background:#fff;display:flex;flex-direction:column;border-left:1px solid var(--hair);opacity:0;visibility:hidden;transform:translateX(12px);transition:opacity .25s,transform .35s var(--ease),visibility 0s .35s}
.pp.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .35s var(--ease)}
.pp-h{display:flex;align-items:center;gap:6px;padding:10px 18px 10px 12px;border-bottom:1px solid var(--hair);min-height:64px;flex:none}
.pp-h b{font-size:16px}
.pp-b{flex:1;overflow:auto;padding:24px 32px 32px}
@container (max-width:1100px){.pp{left:280px}}
@container (min-width:901px){
  .pp .pf{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);column-gap:40px;align-items:start;max-width:920px}
  .pp .pf>*{grid-column:1}
  .pp .pf>.card{grid-column:2;grid-row:1 / span 9;margin-top:0}
  .pp .pf>.pf-cards{grid-column:2;grid-row:1 / span 9;margin-top:0}
  .pp .pf .acts{grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px}
}
/* quick messages sheet */
.qtabs{display:flex;gap:6px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 8px;scrollbar-width:none;border-bottom:1px solid rgba(0,0,0,.06)}
.qtabs::-webkit-scrollbar{display:none}
.qtabs button{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.7);font-size:13px;font-weight:600}
.qtabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.qh{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 2px}
.sh-sc>.qh:first-child{margin-top:8px}
.qrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 2px;border:0;border-top:1px solid rgba(0,0,0,.06);background:none;text-align:left;font-size:15px;line-height:20px}
.qh+.qrow{border-top:0}
.qrow span{flex:1}
.qc{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.qc .ic{width:14px;height:14px;stroke-width:2.4}
.qrow[aria-checked=true] .qc{background:var(--ink);border-color:var(--ink);color:#fff}
.sheet.wide{width:min(520px,calc(100% - 32px))}
.gone{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 18px 0;padding:8px 8px 8px 16px;border:1px solid var(--hair);border-radius:16px;font-size:14px;flex:none}
.none{flex:1;background:var(--canvas)}
.msgs{flex:1;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:3px}
.msgs>*{flex:none}
.stamp{align-self:center;font-size:12px;color:var(--muted);margin:10px 0 6px}
.b{max-width:min(72%,520px);padding:10px 14px;border-radius:20px;font-size:15px;line-height:20px;overflow-wrap:anywhere;white-space:pre-wrap}
.b.them{background:#fff;border:1px solid var(--hair);align-self:flex-start}
.b.me{background:var(--ink);color:#fff;align-self:flex-end}
.b.gap{margin-top:10px}
.b.media{padding:0;overflow:hidden;border-radius:18px}
.b.media img{max-width:240px;width:100%;height:auto;max-height:300px;object-fit:cover}
/* message options: the … beside a bubble (mouse), or hold it (touch) */
.b{position:relative}
.b .mm{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;padding:0;border:0;border-radius:99px;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .15s}
.b.me .mm{right:100%}
.b.them .mm{left:100%}
.b:hover .mm,.b .mm:focus-visible{opacity:1;pointer-events:auto}
.b .mm:hover{color:var(--ink)}
.b.held{transform:scale(.98);transition:transform .2s var(--ease)}
/* a reply quotes the message above its own text */
.b .qt{margin:0 0 6px;padding:1px 0 1px 10px;border-left:2px solid var(--ring);font-size:13px;line-height:18px;color:var(--ink2);white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.b .qt b{font-weight:600;margin-right:6px}
.b .qt i{font-style:normal;color:var(--muted)}
.b.me .qt{border-color:rgba(255,255,255,.5);color:rgba(255,255,255,.85)}
.b.me .qt i{color:rgba(255,255,255,.72)}
/* photos and listing cards */
.b.media{overflow:visible}
.b.media.me,.b.media.them{background:none;border:0}
.b .ph{display:block;padding:0;border:0;border-radius:18px;overflow:hidden;background:var(--canvas);max-width:100%;cursor:zoom-in}
.b.up .ph{cursor:default;opacity:.6}
.b.lc,.b.lc.me{padding:0;background:#fff;border:1px solid var(--hair);color:var(--ink);width:280px;white-space:normal}
.lca{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:8px 14px 8px 8px;min-height:80px;text-decoration:none;border-radius:inherit}
.lca img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--canvas)}
.lca small,.lca .lm{display:block;font-size:12px;line-height:16px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lca b{display:block;font-size:14px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lca .lp{display:block;font-size:13px;line-height:18px;font-weight:600;margin-top:2px}
a.lca:hover b{text-decoration:underline;text-underline-offset:3px}
.rcl{align-self:center;display:flex;align-items:center;gap:2px;font-size:13px;color:var(--muted);margin:8px 0;min-height:20px}
.rcl button{border:0;background:none;font-weight:600;font-size:13px;color:var(--ink);min-height:44px;margin:-12px 0;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.b.media video{width:260px;max-width:100%;background:#000}
.mt{font-size:12px;color:var(--muted);margin:3px 4px 4px}
.mt.me{align-self:flex-end}
.new{animation:pop .35s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:12px 14px;display:flex;gap:4px;margin-top:10px}
.typing i{width:7px;height:7px;border-radius:99px;background:var(--muted);animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.sys{align-self:stretch;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
.sys::before,.sys::after{content:"";flex:1;min-width:16px;border-top:1px solid var(--hair)}
/* swap C: a system card in the thread */

/* composer */
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 18px 0;scrollbar-width:none;flex:none}
.quick::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:#fff;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip[hidden]{display:none}
.composer{display:flex;gap:6px;align-items:flex-end;padding:8px 18px max(14px,env(safe-area-inset-bottom));flex:none;position:relative}
.composer textarea{flex:1;min-width:0;height:44px;min-height:44px;resize:none;border-radius:22px;border:1px solid var(--hair);padding:11px 16px;font-size:15px;line-height:20px;overflow-y:hidden;background:#fff;display:block}
.composer textarea:focus{outline:none;border-color:var(--ink)}
.composer .ibtn{border-color:var(--hair)}
.composer .send{background:var(--ink);color:#fff;border:0}
.composer .send:hover{background:#000}
.composer .send[disabled]{background:#c4c4c4;cursor:not-allowed}
.rbar{display:flex;align-items:center;gap:8px;margin:8px 18px 0;padding:2px 2px 2px 14px;border:1px solid var(--hair);border-radius:16px;flex:none;min-width:0}
.rbar>span{flex:1;min-width:0;border-left:2px solid var(--ink);padding-left:10px}
.rbar small{display:block;font-size:12px;color:var(--muted)}
.rbar b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* rail */
.side{border-left:1px solid var(--hair);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fff;min-height:0}
.side>*{flex:none}
.side-h{display:none}
.card{background:#fff;border-radius:16px;border:1px solid var(--hair);padding:14px}
.tl{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tl span{font-weight:400;font-size:13px;color:var(--muted)}
.rcard{display:block;text-decoration:none;padding:0;overflow:hidden}
.rcard img{width:100%;aspect-ratio:2/1;object-fit:cover}
.rcard .rc{padding:12px 14px 14px}
.rcard small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.rcard h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0;letter-spacing:-.2px}
.rcard p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.rcard .pr{margin-top:6px;font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.3px}
.rcard .pr small{display:inline;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px}
a.rcard:hover h3{text-decoration:underline;text-underline-offset:3px}
.st{display:grid;grid-template-columns:22px minmax(0,1fr) 16px;gap:10px;align-items:center;width:100%;min-height:48px;padding:8px 0;border:0;border-top:1px solid var(--hair);background:none;text-align:left;color:var(--ink)}
.settle>.st:first-child{border-top:0}
.st b{display:block;font-size:14px;font-weight:600}
.st .d{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.st>.ic{color:var(--muted);transition:transform .25s var(--ease)}
.st[aria-expanded=true]>.ic{transform:rotate(90deg)}
.tick{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;color:transparent;transition:background .3s,border-color .3s}
.st.wait .tick{border:1.5px dashed var(--muted)}
.st.done .tick{background:var(--ink);border-color:var(--ink);color:#fff}
.tick .ic{width:14px;height:14px;stroke-width:2.4}
.st.flash{animation:flash 1s var(--ease)}
@keyframes flash{30%{background:var(--canvas)}}

  background:var(--glass);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx);border:var(--glass-bd);box-shadow:var(--glass-sh);

.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 14px;border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.7);text-align:left;margin-top:8px}

.opt[disabled]{opacity:.55;cursor:not-allowed}

<body>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const span=(s,e)=>window.WhenPicker?WhenPicker.label(s,e):`${s} – ${e}`;
const pic=x=>x||'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const ICON={check:'<path d="M5.5 12.5l4 4 9-9"/>',send:'<path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',
  more:'<circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/>',
  lock:'<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',copy:'<rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/>',
  bolt:'<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',user:'<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/>',flag:'<path d="M5.5 21V4M5.5 4.5h11l-2 4 2 4h-11"/>',block:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>',
  plus:'<path d="M12 5.5v13M5.5 12h13"/>',image:'<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 15.5 16 11l-7.5 8"/>',home:'<path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v9.5h11V10"/>',
  pin:'<path d="M9 4.5h6l-1 5 3 3v1.5H7v-1.5l3-3z"/><path d="M12 14v6"/>',bell:'<path d="M6.5 16v-5.5a5.5 5.5 0 0 1 11 0V16l1.5 1.5H5z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  mute:'<path d="M6.5 16v-5.5a5.5 5.5 0 0 1 11 0V16l1.5 1.5H5z"/><path d="M10 20a2 2 0 0 0 4 0M4 4l16 16"/>',eyeoff:'<path d="M3 12s3.5-6 9-6c1.6 0 3 .5 4.2 1.2M21 12s-3.5 6-9 6c-1.6 0-3-.5-4.2-1.2"/><path d="M4 20 20 4"/>',
  trash:'<path d="M4.5 7h15M10 7V5h4v2M6.5 7l1 12.5h9l1-12.5"/>',reply:'<path d="M9.5 7 4.5 12l5 5"/><path d="M5 12h9a5.5 5.5 0 0 1 5.5 5.5V19"/>',recall:'<path d="M9 14 4.5 9.5 9 5"/><path d="M5 9.5h9.5a5 5 0 0 1 0 10H11"/>'};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------- words ---------- */
const KEYS=['dates','stays','money','tour','landlord'],ASKS=['dates','tour','money','stays','landlord'];
const LABEL={dates:'Dates',stays:'What stays',money:'Money',tour:'Video tour',landlord:'Landlord OK'};
const SAFE={looking:'You pay the host directly. Rentlet never holds money.',subletting:'Your subletter pays you directly. Rentlet never holds money.'};
/* quick messages: grouped by the decision being made, separate sets per role, several join into ONE message,
   never asks for off-platform contact. k links a line to a settle item for the contextual chips. */
const QR={
 seeker:{groups:[['basics','Basics'],['place','The place'],['money','Money and safety'],['replies','Replies']],items:[
  ['basics','avail','Hi {name}! Is this still available for {dates}?','dates'],['basics','shift','Could the dates move by a week either way?'],['basics','allin','What’s the all-in monthly cost with utilities and Wi-Fi?','money'],['basics','nego','Is the rent negotiable?'],
  ['place','furn','Is it furnished? What stays in the room?','stays'],['place','mates','Who else lives there, and what’s their day-to-day like?'],['place','laundry','Is there laundry in the unit or building? Parking?'],['place','bath','Private or shared bathroom?'],['place','walk','How long is the walk or shuttle to campus?'],['place','pets','Are pets allowed?'],
  ['money','deposit','Is there a deposit? Is it refundable, and when is it returned?'],['money','landlord','Has your landlord or building approved the sublet?','landlord'],['money','lease','Could you show the lease page with your name and the dates? Cover the rest.'],['money','screen','Do I need to apply or pass the building’s screening?'],['money','tour','Could we do a video tour or a visit?','tour'],['money','keys','How do keys and move-in work on day one?'],
  ['replies','fit','This looks like a fit. When could we do a video call?'],['replies','think','Thanks, let me think it over. I’ll reply by tomorrow.'],['replies','found','I’ve found a place. Thanks for your time!']]},
 host:{groups:[['basics','Basics'],['who','Who’s moving in'],['process','Process'],['replies','Replies']],items:[
  ['basics','still','Hi {name}! Are you still looking?'],['basics','dates','What dates do you need, and are they flexible?','dates'],['basics','budget','What’s your budget, with utilities?','money'],
  ['who','who','Is it just you? Any pets?'],['who','life','What’s your schedule like, and how do you feel about quiet hours, smoking, cooking and guests?'],['who','furn','Do you need it furnished, or will you bring your own things?','stays'],
  ['process','app','The building runs its own application and credit check. OK with that?'],['process','pay','Rent and any deposit follow the lease, with a receipt. OK with that?'],['process','ref','Could a previous roommate or landlord vouch for you?'],['process','tour','When could you do a video tour or a visit?','tour'],
  ['replies','avail','Still available. Ask me anything.'],['replies','send','I’ll send photos and the cost breakdown shortly.'],['replies','taken','Sorry, it’s taken.'],['replies','check','Let me check and get back to you.']]}};
/* {dates} is the seeker's plan from the search bar (same session key as the room page), else the room's own dates */
const PLAN=(()=>{try{const p=JSON.parse(sessionStorage.getItem('cs-plan')||'null');if(p&&p.start&&p.end)return p}catch(_){}return null})();
const role=t=>t.tab==='subletting'?'host':'seeker';
const qItems=t=>QR[role(t)].items.map(([g,id,x,k])=>({g,id,k,x:x.replace('{name}',t.p.name).replace('{dates}',PLAN?span(PLAN.start,PLAN.end):t.r.span)}));
const ask=(t,k)=>(qItems(t).find(i=>i.k===k)||{}).x||'';

/* ---------- live data (src/chat.ts sends it to RL_chat.update) ---------- */
let AUTH=RL.authed?'in':'out',ME=RL.user,LIST='loading',TH={},ACTIVE=[],MYC=null,PROF={},FLASH=null,ENTRY=null,WANT=null;
const LOCAL={};/* per conversation: the unsent draft and how much of the thread is already drawn */
let TAB='looking',CUR=null,PENDING=[],Q='',UNDO=null,PICK=null,REPORT=null,VIEW='inbox',RAIL=false,QSEL=new Set(),QTAB='all';
/* UNDO: {id,k:'block'|'hide'}; MM: the message whose menu is open; RECALLED: what I recalled this visit, for Edit */
let MM=null,MMA=null,MMT=0,RECALLED={},LPICK=null,PHOTO_FOR=null,ACT_STATE='loading';
const th=()=>TH[CUR];
/* replies each side sent, counted by src/lib/chatModel.ts over the whole thread (deleted-for-me ones too) */
const count=(t,f)=>t.n?t.n[f]:0;
const unlocked=t=>count(t,'me')>=3&&count(t,'them')>=3&&t.p.ok;
const swapped=t=>t.share.mine&&t.share.theirs;
const doneN=t=>KEYS.filter(k=>t.settle[k][0]==='done').length;
/* blocked and hidden conversations leave the list; pinned ones come first */
const listed=t=>!t.blocked&&!t.hidden;
const inTab=tab=>Object.values(TH).filter(t=>t.tab===tab&&listed(t)).sort((a,b)=>(b.pinned-a.pinned)||(b.ord-a.ord));
const host=t=>t.tab==='subletting';
const kindLabel=k=>k==='instagram'?'Instagram':'Email',kindWord=k=>k==='instagram'?'Instagram':'email';
let site,stage;const isPhone=()=>site&&site.clientWidth<=900;
const chat=()=>window.RentletChat;

/* ---------- render: shell ---------- */
/* the header: the logo, then Saved and Messages (signed in; this page's own link is marked current) and the menu,
   which holds posting, the pages and the account. rentlet-boot.js draws and runs all of it; the page draws it
   again only when the account changes (shell). On phones the thread's back button sits in the thread, not here. */
const header=()=>`<header class="hdr"><div class="wrap"><a class="logo" href="index.html"><img src="img/rentlet-logo.png" alt="Rentlet"></a><div class="hdr-r">${RL.msgs?RL.msgs(true):''}${RL.menu?RL.menu():''}</div></div></header>`;
function shell(){
  if(AUTH!=='in'){
    stage.innerHTML=`<div class="site p-A view-inbox" id="site">${header()}<div class="body"><aside class="inbox" aria-label="Conversations"><div class="inbox-h"><h1>Messages</h1></div><div class="empty"><p>Sign in with your school Google account (an email ending in .edu) to see your messages.</p><button type="button" class="btn btn-primary" data-rl-signin>Sign in</button></div></aside><section class="thread" aria-label="Conversation"><div class="none"></div></section><aside class="side" aria-label="This room"></aside></div><div class="toast" id="toast" role="status"></div></div>`;
    site=$('#site');return}
  stage.innerHTML=`<div class="site" id="site">${header()}
  <div class="body"><aside class="inbox" id="inbox" aria-label="Conversations"><div class="inbox-h"><div class="inbox-t"><h1>Messages</h1><button type="button" class="chip" id="blk" data-act="blocked" aria-haspopup="dialog" hidden></button></div><div class="tabs" role="tablist" id="tabs"></div></div><label class="search">${ic('search','sm')}<span class="sr">Search conversations</span><input id="q" type="search" placeholder="Search people or rooms" autocomplete="off"></label><div id="undo"></div><div class="convs" id="convs"></div></aside>
  <section class="thread" id="thread" aria-label="Conversation"></section><aside class="side" id="side" aria-label="This room"></aside><section class="pp" id="pp" aria-label="Profile"></section></div>
  <div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></div><div class="toast" id="toast" role="status"></div>
  <div class="vw" id="vw" hidden role="dialog" aria-modal="true" aria-label="Photo"><button type="button" class="ibtn" data-act="vw-close" aria-label="Close">${ic('x')}</button><img id="vwImg" alt=""></div><input type="file" id="photoIn" accept="image/jpeg,image/png,image/webp" hidden></div>`;
  site=$('#site');$('#q').value=Q;$('#q').oninput=e=>{Q=e.target.value;renderList()};
  $('#photoIn').onchange=e=>{const f=e.target.files&&e.target.files[0],id=PHOTO_FOR;PHOTO_FOR=null;e.target.value='';if(!f||!id||!chat())return;
    chat().sendPhoto(id,f).then(r=>{if(r!=='ok')toast(sendMsg(r))})};
  renderAll();
}
function siteClass(){if(site)site.className=`site p-A${VIEW!=='inbox'?' v-thread':''} view-${VIEW}`}
function renderAll(){siteClass();renderList();renderThread();renderRail();}

/* ---------- inbox ---------- */
const avatar=(p,s)=>`<span class="av" style="background:${p.col}${s?`;width:${s}px;height:${s}px`:''}" aria-hidden="true">${p.photo?`<img src="${esc(p.photo)}" alt="" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:inherit;object-fit:cover">`:esc((p.name||'?')[0])}${p.ok?`<span class="vf">${ic('check')}</span>`:''}</span>`;
function renderList(){if(!$('#convs'))return;
  /* muted conversations don't light the tab's unread dot */

   case 'c-mute':{const c=TH[a.dataset.id];closeSheet();if(!c)return;const on=!c.muted;return chat().mute(c.id,on).then(ok=>toast(ok?(on?'Muted':'Unmuted'):'Couldn’t save that. Try again.'))}
   case 'c-hide':{const id=a.dataset.id;if(!TH[id])return;closeSheet();closeProfile();chat().hide(id).then(ok=>{if(!ok){UNDO=null;toast('Couldn’t hide. Try again.');renderList()}});UNDO={id,k:'hide'};return leave(id)}
   case 'c-del':return clearSheet(a.dataset.id);
   case 'c-del-go':{const id=a.dataset.id;closeSheet();closeProfile();if(UNDO&&UNDO.id===id)UNDO=null;chat().clear(id).then(ok=>toast(ok?'Conversation deleted':'Couldn’t delete. Try again.'));return leave(id)}
   case 'mmenu':return msgMenu(a.dataset.id,a);
   case 'm-reply':{const m=findMsg(t,a.dataset.id);closeSheet();if(!m)return;t.local.reply={id:m.id,who:m.f==='me'?'yourself':t.p.name,x:clip(snipOf(m))};renderReply();const i=$('#inp');if(i)i.focus();return}
   case 'm-copy':{const m=findMsg(t,a.dataset.id);closeSheet();if(!m)return;return copyText(m.x).then(ok=>toast(ok?'Copied':'Couldn’t copy. Select the text instead.'))}
   case 'm-recall':{const id=a.dataset.id,m=findMsg(t,id);closeSheet();if(!m)return;RECALLED[id]=m.x;if(t.local.reply&&t.local.reply.id===id){t.local.reply=null;renderReply()}
     return chat().recall(t.id,id).then(r=>{if(r==='ok')return;delete RECALLED[id];toast(r==='expired'?'A message can be recalled only within 2 minutes.':'Couldn’t recall. Try again.')})}
   case 're-edit':{const x=RECALLED[a.dataset.id],i=$('#inp');if(!x||!i)return;const cur=i.value.replace(/\s+$/,'');return insert(cur?cur+'\n'+x:x,[])}
   case 'm-del':return delMsgSheet(a.dataset.id);
   case 'm-del-go':{const id=a.dataset.id;closeSheet();if(t.local.reply&&t.local.reply.id===id){t.local.reply=null;renderReply()}return chat().deleteMessage(t.id,id).then(ok=>{if(!ok)toast('Couldn’t delete. Try again.')})}
   case 'reply-x':t.local.reply=null;renderReply();{const i=$('#inp');if(i)i.focus()}return;
   case 'attach':return needsFirst(t)?undefined:attachSheet();
   case 'pick-photo':{closeSheet();PHOTO_FOR=t.id;const f=$('#photoIn');f.value='';return f.click()}
   case 'pick-listing':LPICK=null;return listingSheet();
   case 'lpick':LPICK=a.dataset.code;return listingSheet();
   case 'lsend':{if(!LPICK)return;const code=LPICK,id=t.id;LPICK=null;closeSheet();return chat().sendListing(id,code).then(r=>{if(r!=='ok')toast(sendMsg(r))})}
   case 'photo':return openPhoto(a);
   case 'vw-close':return closePhoto();
   case 'unblock-cur':return chat().unblock(t.id).then(ok=>{if(!ok)toast('Couldn’t unblock. Try again.')});
   case 'share':{if(needsFirst(t))return;PICK=null;MYC=null;shareSheet();const id=t.id;chat().myContact().then(c=>{MYC=c;if(sheetKind==='share'&&CUR===id)shareSheet()},()=>{MYC={instagram:'',email:''};if(sheetKind==='share')shareSheet()});return}
   case 'pick':PICK=a.dataset.kind;return shareSheet();
   case 'share-go':if(!PICK)return;{const kd=PICK;PICK=null;closeSheet();return chat().share(t.id,kd).then(ok=>{if(!ok)toast('Couldn’t share. Try again.')})}
   case 'withdraw':return chat().withdraw(t.id).then(ok=>{if(!ok)toast('Couldn’t withdraw. Try again.')});
   case 'copy':{const v=a.dataset.v;try{navigator.clipboard.writeText(v).catch(()=>{})}catch(_){}return toast('Copied '+v)}
   case 'sheet-close':return closeSheet();
  }});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!site)return;if(closePhoto())return;if(sheetKind)return closeSheet();if($('#pp.on'))return closeProfile();if(RAIL)closeRail()});

/* ---------- hold (touch) or right-click: a message's or a conversation's menu ---------- */
let HOLD=null,NOCLICK=0;
const holdEl=e=>e.target&&e.target.closest?e.target.closest('#msgs .b[data-mid],#convs .conv-w[data-row]'):null;
function openHold(el,at){if(el.dataset.mid)return msgMenu(el.dataset.mid,at||el);return rowMenu(el.dataset.row,at||el)}
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||!site)return;const el=holdEl(e);if(!el)return;
  HOLD={x:e.clientX,y:e.clientY,el,t:setTimeout(()=>{if(!HOLD)return;HOLD.fired=true;el.classList.add('held');openHold(el)},500)}},{passive:true});
document.addEventListener('pointermove',e=>{if(HOLD&&!HOLD.fired&&Math.hypot(e.clientX-HOLD.x,e.clientY-HOLD.y)>10){clearTimeout(HOLD.t);HOLD=null}},{passive:true});
const endHold=()=>{if(!HOLD)return;clearTimeout(HOLD.t);if(HOLD.fired){NOCLICK=Date.now()+700;HOLD.el.classList.remove('held')}HOLD=null};
document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',endHold);
/* the tap that ends a hold must not also open the photo, the room or the conversation underneath */
document.addEventListener('click',e=>{if(Date.now()<NOCLICK){NOCLICK=0;e.preventDefault();e.stopPropagation()}},true);
document.addEventListener('contextmenu',e=>{if(!site)return;const el=holdEl(e);if(!el)return;e.preventDefault();
  if(HOLD){clearTimeout(HOLD.t);if(HOLD.fired)return;HOLD.fired=true}
  openHold(el,{left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY})});

/* ---------- start ---------- */
stage=$('#stage');
shell();
let lastPhone=isPhone();addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;if(!p&&!CUR)autoSelect();closeRail();closeProfile();siteClass();renderRail();markSeen()}});
</script>
