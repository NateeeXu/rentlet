name: Rentlet CI

on: [push]

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

      # Root `npm test` also collects functions/src/*.test.ts, which need the
      # functions' own dependencies; build them too so CI typechecks them.
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
