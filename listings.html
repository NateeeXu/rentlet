<style>
/* All rooms: every room at a campus, as a grid or beside the price map (the homepage's "Rooms near" layout).
   Switching view keeps the same cards and glides them to their new places. */
:root{--canvas:#f7f7f7;--soft:#f2f2f4;--ink:#222;--ink2:#484848;--muted:#717171;--line:#dddddd;--hair:#e8e8e8;--serif:"Newsreader",Georgia,serif;--ease:cubic-bezier(.22,1,.36,1);--shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06)}
html,body{margin:0}
body{background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.site{container-type:inline-size;background:var(--canvas);min-height:100vh;overflow-x:clip;display:flex;flex-direction:column}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%;box-sizing:border-box}

/* the site header */
.hdr{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:72px;position:relative}
.logo{display:flex;align-items:center;min-height:44px}
.logo img{height:30px;display:block}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* the title */
.main{flex:1 0 auto;padding:28px 0 56px}
h1{font-family:var(--serif);font-size:38px;font-weight:500;letter-spacing:-.6px;line-height:1.1;margin:0}

/* the toolbar: Where | When | Budget in one glass bar (the Requests page's), the sort menu, the view */
h1 .cnt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px;vertical-align:middle}
.fld{height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;font-weight:600;min-width:0;position:relative;margin:0}
.fld:hover{border-color:#b8b8bd}
.fld .ic{color:var(--ink2)}
.f-sort{margin-left:auto;cursor:pointer;width:44px;padding:0;justify-content:center;flex:none} /* icon only (Founder, Nov 4); the menu still names each order */
.f-sort .fd{width:100%;justify-content:center}
.f-sort .ic{width:18px;height:18px}
.f-sort .fd{display:flex;align-items:center;gap:8px;height:42px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.sort-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:60;min-width:220px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.12)}
.sort-pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;white-space:nowrap}
.sort-pop button:hover,.sort-pop button[aria-selected=true]{background:var(--soft,#f2f2f4)}
.sort-pop .sp-gap{display:inline-block;width:16px;flex:none}
.dbar{position:sticky;top:72px;z-index:10;background:transparent;display:flex;align-items:center;gap:10px;padding:12px 0;margin:8px 0 8px}
.rbar{flex:0 1 720px;min-width:0;display:flex;align-items:stretch;height:64px;border-radius:999px}
.rbar,.dbar .f-sort{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.14),0 2px 6px rgba(30,25,40,.06)}
.dbar .f-sort{width:48px;height:48px}
.dbar .f-sort:hover{background:rgba(255,255,255,.75)}
.rseg{position:relative;display:flex;align-items:center;min-width:0;margin:0}
.rseg+.rseg::before{content:"";position:absolute;left:0;top:24%;bottom:24%;width:1px;background:rgba(0,0,0,.1)}
.rsb{display:flex!important;flex-direction:column;justify-content:center;gap:2px;width:100%!important;height:100%;min-width:0;margin:0;padding:0 24px;border:0;border-radius:999px;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;z-index:1}
.rsb:hover{background:rgba(255,255,255,.55)}
.rsb.ws-on,.rsb[aria-expanded=true]{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.rseg:has(.rsb:hover)::before,.rseg:has(.rsb:hover)+.rseg::before,.rseg:has(.ws-on)::before,.rseg:has(.ws-on)+.rseg::before{opacity:0}
.rbl{font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--ink)}
.rbv{font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.r-when .rx{position:absolute;right:10px;z-index:2;width:32px;height:32px;margin:0;border-radius:50%;border:0;background:var(--soft);font-size:16px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.dbar{flex-wrap:wrap}
.rbar{flex:0 1 600px}
.r-where{flex:1.5 1 0}.r-when{flex:1.2 1 0}.r-bud{flex:.9 1 0}
.r-when:has(.rx:not([hidden])) .rsb{padding-right:48px}
.rx[hidden]{display:none!important}
.dbar .sp{flex:1 1 0}
.sort-pop{z-index:60}
.vseg{position:relative;display:inline-flex;flex:none;height:48px;padding:4px;border-radius:999px;box-sizing:border-box;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.14),0 2px 6px rgba(30,25,40,.06)}
.vseg[hidden]{display:none}
.vseg button{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:auto;height:38px;margin:0;padding:0 14px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:650;color:var(--muted);white-space:nowrap;transition:color .25s}
.vseg button[aria-pressed=true]{color:var(--ink)}
.vseg .ind{position:absolute;z-index:0;top:4px;left:0;height:38px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.14);transition:transform .4s var(--ease),width .4s var(--ease)}

/* the cards (the homepage's) */
.sk{background:linear-gradient(100deg,#eeeef1 30%,#fafafb 50%,#eeeef1 70%);background-size:300% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:8px}
.sk-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sk-card .sk-ph{aspect-ratio:4/3;border-radius:0}
.sk-card .sk-l{height:14px;margin:14px 16px 0}
.sk-card .w60{width:60%}.sk-card .w40{width:40%}
.sk-card .tall{height:36px;margin-bottom:16px;border-radius:12px}
@keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}
.cx-lnk{border:0;background:none;padding:0;font-size:14px;font-weight:650;color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;cursor:pointer}
.cx-swap>*{animation:cxin .42s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes cxin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cx-card{display:block;color:inherit;text-decoration:none;cursor:pointer;outline:none;min-width:0}
.cx-card .cph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--soft)}
.cx-card .cph img{width:100%;height:100%;object-fit:cover;display:block}
.cx-card .cph img.flip{transform:scaleX(-1)}
.cx-card .ctg{position:absolute;left:12px;top:12px;z-index:2;background:#fff;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600}
.cx-card .csv{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer}
.cx-card .csv::after{content:'';position:absolute;inset:-5px}
.cx-card .csv .ic{width:17px;height:17px}
.cx-card .csv[aria-pressed=true] .ic{fill:var(--ink)}
.cx-card .cbd{padding:10px 2px 0}
.cx-card .ct{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}
.cx-card .ct b{font-weight:600;white-space:nowrap}
.cx-card .ct b small{font-weight:500;color:var(--muted);font-size:13px}
.cx-card .cm,.cx-card .cf,.cx-card .cf2{font-size:14px;color:var(--muted);margin-top:2px}
.cx-card .cf2{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-card .cfx{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:13px;font-weight:600;color:var(--ink);opacity:0;transform:translateY(14px);transition:opacity .22s,transform .3s cubic-bezier(.22,1,.36,1);pointer-events:none}
.cx-card .cfx span{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-card .fi{width:16px;height:16px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cx-card .cph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.18));opacity:0;transition:opacity .25s}
.cx-card:hover .cfx,.cx-card:focus-visible .cfx{opacity:1;transform:none}
.cx-card:hover .cph::after,.cx-card:focus-visible .cph::after{opacity:1}
.cx-card:focus-visible .cph{box-shadow:0 0 0 2px var(--ink)}
@media (hover:none){.cx-card .cfx,.cx-card .cph::after{display:none}.cx-card .cf2{display:block}}
.cx-empty{grid-column:1/-1;text-align:center;padding:28px 16px;border:1px solid var(--hair);border-radius:16px}
.cx-empty h3{margin:0;font-size:16px}
.cx-empty p{margin:6px 0 16px;font-size:14px;color:var(--muted)}
.cx-empty-a{display:flex;gap:8px 20px;align-items:center;justify-content:center;flex-wrap:wrap}
.cx-pri{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 24px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:650;white-space:nowrap;cursor:pointer}
.cx-pri:hover{background:#000}
.cx-cnt{margin-left:2px;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);white-space:nowrap}
.cx-map{width:100%;height:100%}
.cx-shuttle{position:absolute;top:12px;left:12px;z-index:900;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:14px;font-weight:650;color:#222;text-decoration:none;white-space:nowrap}
.cx-shuttle:hover{background:#fff}
.leaflet-container a.cx-shuttle{color:#222} /* Leaflet colours every link in a map blue */
.cx-shuttle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hm-full .cx-shuttle{top:calc(12px + env(safe-area-inset-top,0px));left:calc(64px + env(safe-area-inset-left,0px));height:44px}
.cx-showmap{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto!important;min-width:0;flex:0 0 auto;height:48px;margin:0;padding:0 20px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:650;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;pointer-events:auto;transition:transform .18s}
.cx-showmap:active{transform:scale(.97)}
.cx-showmap .ic{width:18px;height:18px}
.cx-card{transform-origin:0 0}
.cx-card.pin-hot .cph{box-shadow:0 0 0 2px var(--ink)}
.cx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px}
.cx-grid.moving{position:relative;z-index:2;pointer-events:none}
/* frosted glass on whatever sits on a photo or the map: the homepage's material */
:root{--gl-bg:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.34));--gl-fx:blur(16px) saturate(1.8);--gl-bd:1px solid rgba(255,255,255,.72);--gl-sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.2),0 8px 22px -6px rgba(20,16,40,.32);--gl-ink:#17151f}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .cx-card .ctg,.cx-card .csv,.cx-shuttle{color:var(--gl-ink);background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-fx);backdrop-filter:var(--gl-fx);border:var(--gl-bd);box-shadow:var(--gl-sh)}
  .cx-shuttle:hover{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.55))}
  .cx-card .cfx{background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.56));-webkit-backdrop-filter:var(--gl-fx);backdrop-filter:var(--gl-fx);border:var(--gl-bd);box-shadow:var(--gl-sh)}
}
@media (prefers-reduced-transparency:reduce){.cx-card .ctg,.cx-card .csv,.cx-shuttle,.cx-card .cfx{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}

/* grid, or cards beside the map. In the grid the map waits out of sight at its final size, so it needs no resizing
   when it comes in; position:fixed keeps it from lengthening the page. */
.split{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:24px;align-items:start}
.split.map{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.split.map .cx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.mapcol{z-index:1;border:1px solid var(--hair);border-radius:14px;overflow:hidden;background:var(--soft);box-sizing:border-box;height:calc(100vh - 96px - var(--bar,84px));min-height:420px;max-height:880px}
.split.map .mapcol{position:sticky;top:calc(72px + var(--bar,84px))}
.split:not(.map) .mapcol{position:fixed;top:calc(72px + var(--bar,84px));right:0;width:calc((min(1072px,100vw - 48px) - 24px)/2.2);visibility:hidden;pointer-events:none}
.endn{margin:30px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.endn[hidden]{display:none}
.mapbar{display:none}

/* the footer */
.foot{border-top:1px solid var(--hair);padding:32px 0 calc(28px + env(safe-area-inset-bottom))}
.fcols{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:24px}
.fcols h4{margin:0 0 10px;font-size:13px}
.fcols a{display:block;font-size:14px;color:var(--muted);text-decoration:none;padding:3px 0}
.fcols a:hover{color:var(--ink);text-decoration:underline}
.fcols .brand img{height:28px}
.fcols .brand p{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.fbot{margin-top:24px;padding-top:16px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.foot{margin-top:auto}

@container (max-width:1040px){
}
@container (max-width:900px){
  .cx-grid,.split.map .cx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split,.split.map{display:block}
  .mapcol,.split.map .mapcol,.split:not(.map) .mapcol{display:none}
  .vseg{display:none}
  .dbar{position:static;padding:12px 0 10px}
  .rbar{flex:1 1 100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));height:auto;border-radius:28px;padding:6px}
  .r-where{grid-column:1/-1}
  .rseg{min-height:60px}
  .rseg+.rseg::before{display:none}
  .rsb{padding:0 18px;border-radius:22px}
  .dbar .sp{display:none}
  .dbar .f-sort{order:3}
  .mapbar{position:sticky;z-index:6;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;margin-top:24px;pointer-events:none}
  .mapbar[hidden]{display:none}
}
@container (max-width:860px){
  .fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.fcols .brand{grid-column:1/-1}
}
@container (max-width:640px){
  .wrap{padding:0 16px}
  .hdr .wrap{height:60px;gap:8px}
  .logo img{height:24px}
  .main{padding:24px 0 40px}
  h1{font-size:28px;letter-spacing:-.4px}
  .fcols a{display:flex;align-items:center;min-height:44px;padding:0}
}
@container (max-width:600px){
  .cx-grid,.split.map .cx-grid{grid-template-columns:minmax(0,1fr);gap:24px}
}
@media (prefers-reduced-motion:reduce){.cx-swap>*{animation:none}.sk{animation:none}.vseg .ind,.vseg button,.cx-card .cfx{transition:none}}
</style>

const FICONS={walk:ICONS.walk,sofa:'<path d="M4 11.5V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.5"/><path d="M3 13a1.5 1.5 0 0 1 3 0v1.5h12V13a1.5 1.5 0 0 1 3 0v4.5H3z"/><path d="M5.5 17.5V19M18.5 17.5V19"/>',
  bath:'<path d="M4 12h16v2.5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M6.5 12V6.5A2 2 0 0 1 10.3 6"/><path d="M7.5 18.5 6.5 20M16.5 18.5l1 1.5"/>',
  wash:'<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><circle cx="12" cy="13" r="4"/><path d="M8.5 6.8h.01M11 6.8h2"/>'};
const fic=k=>`<svg class="fi" viewBox="0 0 24 24" aria-hidden="true">${FICONS[k]}</svg>`;
const ROOM_CODE=/^[1-9][0-9]{7}$/;
const roomSaved=c=>!!(window.RL&&typeof RL.isSaved==='function'&&RL.isSaved('room',String(c)));
const roomName=l=>l.building||l.title;
const heartBtn=(l,cls)=>ROOM_CODE.test(String(l.code||''))?`<button type="button" class="${cls}" data-rl-save="room:${l.code}" aria-pressed="${roomSaved(l.code)}" aria-label="Save ${roomName(l)}">${ic('heart')}</button>`:'';
const lfacts=l=>[l.furnished?'Furnished':'Not furnished',l.bath==='private'?'Private bath':'Shared bath',l.laundry?'Laundry in building':'Ask about laundry'];
const walkTx=l=>l.walk!=null?`${l.walk} min walk`:'';
function cxCard(l,i,sub,more=''){const f=lfacts(l);
  return `<article class="cx-card" role="link" tabindex="0" data-cxhref="room.html?room=${l.key}" ${more} style="--i:${i}" aria-label="${roomName(l)}${l.building?`, ${l.title}`:''}, ${l.area}, ${money(l.price)} a month. ${[walkTx(l)&&walkTx(l)+' to campus',...f].filter(Boolean).join(', ')}">
    <div class="cph"><img src="${pic(l.img)}" alt="" class="${l.flip?'flip':''}" style="object-position:${l.pos||'50% 50%'}"><span class="ctg">${wl(l.start,l.end)}</span>
      ${heartBtn(l,'csv')}
      <span class="cfx" aria-hidden="true">${l.walk!=null?`<span>${fic('walk')}${l.walk} min to campus</span>`:''}<span>${fic('sofa')}${f[0]}</span><span>${fic('bath')}${f[1]}</span><span>${fic('wash')}${f[2]}</span></span></div>
    <div class="cbd"><div class="ct"><span>${roomName(l).replace(/-/g,'‑')}</span><b>${money(l.price)}<small> / mo</small></b></div><div class="cm">${l.building?`${l.title.replace(/-/g,'‑')} · `:''}${l.area}</div><div class="cf">${sub}</div><div class="cf2">${[walkTx(l),f[0],f[1]].filter(Boolean).join(' · ')}</div></div></article>`}
const skeleton=n=>Array.from({length:n},()=>`<div class="sk-card"><div class="sk sk-ph"></div><div class="sk sk-l w60"></div><div class="sk sk-l w40"></div><div class="sk sk-l tall"></div></div>`).join('');

/* ---------- state: kept for this tab, so coming back from a room finds the page as it was ---------- */
const SCH=WhereSearch.SCHOOLS;
const schoolName=id=>(SCH.find(x=>x[0]===id)||[])[1]||'';
const SORTS=[['new','Newest'],['low','Lowest price'],['high','Highest price'],['soon','Soonest move-in'],['near','Closest to campus']];
const BY={new:(a,b)=>b.createdAtMs-a.createdAtMs,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price,soon:(a,b)=>T(a.start)-T(b.start),near:(a,b)=>(a.walk==null?1e9:a.walk)-(b.walk==null?1e9:b.walk)};
const read=k=>{try{return JSON.parse(sessionStorage.getItem(k)||'null')||{}}catch(_){return{}}};
const was=read('rl-all');
const S={school:[was.school,read('cs-plan').school].find(id=>id&&schoolName(id))||SCH[0][0],
  start:was.start&&was.end?was.start:null,end:was.start&&was.end?was.end:null,
  budget:typeof was.budget==='number'&&was.budget>0?was.budget:Infinity,
  sort:BY[was.sort]?was.sort:'new',view:was.view==='map'?'map':'grid',sortOpen:false};
const save=()=>{try{sessionStorage.setItem('rl-all',JSON.stringify({view:S.view,sort:S.sort,school:S.school,start:S.start,end:S.end,budget:S.budget===Infinity?null:S.budget}))}catch(_){}};
const L=[];let LOADED=false,FAILED=false,painted=false,CUR=[],hasPins=false;

/* the homepage's rule for whether a room suits the dates: the whole stay, or at least 30 nights and at least half of it */
const datesOk=l=>{const need=nights(S.start,S.end),s=T(l.start)>T(S.start)?l.start:S.start,e=T(l.end)<T(S.end)?l.end:S.end,ov=Math.max(0,nights(s,e)),whole=T(l.start)<=T(S.start)&&T(l.end)>=T(S.end);return need>0&&(whole||(ov>=30&&ov>=need/2))};
const scoped=()=>L.filter(l=>l.school===S.school&&(S.budget===Infinity||l.price<=S.budget*1.05)&&(!S.start||datesOk(l)));

/* ---------- the page: drawn once, so the toolbar keeps its pickers and focus; only the cards and labels change ---------- */
const header=()=>`<header class="hdr"><div class="wrap">
  <a class="logo" href="index.html" aria-label="Rentlet home"><img src="img/rentlet-logo.png" alt="Rentlet"></a>
  <div class="hdr-right">${RL.msgs?RL.msgs():''}${RL.menu?RL.menu():''}</div></div></header>`;
const footer=()=>`<footer class="foot" data-flow><div class="wrap"><div class="fcols">
  <div class="brand"><img src="img/rentlet-logo.png" alt="Rentlet"><p>Sublets and lease takeovers near Northwestern.</p></div>
  <div><h4>Find</h4><a href="index.html">Rooms near campus</a><a href="listings.html">All rooms</a><a href="requests.html">Requests</a><a href="shuttle.html">Shuttle</a></div>
  <div><h4>Post</h4><a href="post.html">Post a listing</a><a href="request.html">Post a request</a></div>
  <div><h4>About</h4><a href="how-it-works.html">Safety &amp; rules</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a><a href="#feedback" data-rl-feedback>Send feedback</a></div></div>
  <div class="fbot"><span>© 2026 Rentlet</span><span>A student class project. Not affiliated with or endorsed by Northwestern University.</span></div></div></footer>`;
const SHUTTLE='<a class="cx-shuttle" href="shuttle.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 15.5V9a3 3 0 0 1 3-3h9.5l4.5 4.5v5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z"/><path d="M3.5 11h17M9.5 6v5M14.5 6v5"/><circle cx="8" cy="17.5" r="1.7"/><circle cx="16" cy="17.5" r="1.7"/></svg>Shuttle map</a>';
$('#site').innerHTML=header()+`<main class="main"><div class="wrap">
  <h1>All rooms<span class="cnt" id="cnt"></span></h1>
  <div class="dbar" id="dbar">
    <div class="rbar" role="group" aria-label="Filter rooms">
      <form class="rseg r-where" data-wform><div class="rsb" data-wseg aria-label="Campus"><span class="rbl">Where</span><span class="rbv" data-wval></span></div></form>
      <div class="rseg r-when"><button type="button" class="rsb" data-when aria-haspopup="dialog" aria-expanded="false"><span class="rbl">When</span><span class="rbv" data-whenv></span></button><button type="button" class="rx" data-clear aria-label="Clear dates" hidden>×</button></div>
      <div class="rseg r-bud"><button type="button" class="rsb" data-bud aria-haspopup="dialog" aria-expanded="false"><span class="rbl">Budget</span><span class="rbv" data-budv></span></button></div>
    </div>
    <span class="sp"></span>
    <div class="fld f-sort" id="sortF"><button type="button" class="fd" data-sortbtn aria-haspopup="listbox" aria-expanded="false">${ic('sort')}</button></div>
    <div class="vseg" id="vseg" role="group" aria-label="View"><i class="ind"></i><button type="button" data-view="grid">${ic('grid','sm')}Grid</button><button type="button" data-view="map">${ic('map','sm')}Map</button></div>
  </div>
  <div class="split${S.view==='map'?' map':''}" id="split">
    <div class="cx-grid" id="grid" aria-busy="true"></div>
    <div class="mapcol" id="mapcol"><div class="cx-map" id="cxMap">${SHUTTLE}</div></div>
  </div>
  <p class="endn" id="endn" data-flow hidden>That’s every room for now. <button type="button" class="cx-lnk" data-ask>Create a housing request</button></p>
  <div class="mapbar" id="mapbar" hidden><button type="button" class="cx-showmap" data-showmap aria-haspopup="dialog">${ic('map')}Show map</button></div>
</div></main>`+footer();
const grid=$('#grid'),split=$('#split'),col=$('#mapcol'),vseg=$('#vseg');

/* ---------- the toolbar ---------- */
const whenTx=()=>S.start?wl(S.start,S.end):'Any dates';
function syncBar(){$('[data-wval]').textContent=schoolName(S.school);$('[data-whenv]').textContent=whenTx();$('[data-when]').setAttribute('aria-label',`Dates: ${whenTx()}`);$('[data-clear]').hidden=!S.start;
  const b=BudgetPicker.label(S.budget);$('[data-budv]').textContent=b;$('[data-bud]').setAttribute('aria-label',`Budget: ${b}`);
  const s=SORTS.find(x=>x[0]===S.sort)[1],sb=$('[data-sortbtn]');sb.setAttribute('aria-label',`Sort: ${s}`);sb.title=`Sort: ${s}`}
/* the view actually shown: the map needs at least one room with a spot */
const shown=()=>S.view==='map'&&hasPins?'map':'grid';
function placeInd(){const b=$('[aria-pressed=true]',vseg),i=$('.ind',vseg);if(b&&b.offsetWidth){i.style.width=b.offsetWidth+'px';i.style.transform=`translateX(${b.offsetLeft}px)`}}
function syncView(){const v=shown();$$('[data-view]',vseg).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));vseg.hidden=!hasPins;$('#mapbar').hidden=!hasPins;placeInd()}
function closeSort(focus){if(!S.sortOpen)return;S.sortOpen=false;const p=$('.sort-pop'),b=$('[data-sortbtn]');if(p)p.remove();b.setAttribute('aria-expanded','false');$('#sortF').classList.remove('open');if(focus)b.focus()}
function openSort(viaKeyboard){S.sortOpen=true;const b=$('[data-sortbtn]');b.setAttribute('aria-expanded','true');$('#sortF').classList.add('open');
  $('#sortF').insertAdjacentHTML('beforeend',`<div class="sort-pop" role="listbox" aria-label="Sort">${SORTS.map(([v,t])=>`<button type="button" role="option" aria-selected="${S.sort===v}" data-sort="${v}">${S.sort===v?ic('check','sm'):'<span class="sp-gap"></span>'}${t}</button>`).join('')}</div>`);
  if(viaKeyboard)$('.sort-pop [aria-selected=true]').focus()}
new ResizeObserver(()=>document.documentElement.style.setProperty('--bar',$('#dbar').offsetHeight+'px')).observe($('#dbar'));

/* ---------- moving the cards: each one starts where it was on screen and glides to its new place ---------- */
const EASE='cubic-bezier(.22,1,.36,1)',DUR=560;
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const wide=()=>$('#site').clientWidth>900;
const stop=el=>el.getAnimations().forEach(a=>a.cancel());
let moveT=0;
function flip(change){
  const cards0=$$('.cx-card[data-code]',grid),old=new Map(cards0.map(c=>[c.dataset.code,c.getBoundingClientRect()]));
  const tail=$$('[data-flow]').map(e=>[e,e.getClientRects().length?e.getBoundingClientRect().top:null]);
  cards0.forEach(stop);tail.forEach(([e])=>stop(e));
  change();
  if(calm())return;
  const vh=innerHeight;let moved=false;
  $$('.cx-card[data-code]',grid).forEach((c,i)=>{const a=old.get(c.dataset.code),b=c.getBoundingClientRect(),delay=Math.min(i,8)*18;
    if(!a){moved=true;c.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:380,easing:EASE,delay:delay+120,fill:'backwards'});return}
    const dx=a.left-b.left,dy=a.top-b.top,s=a.width/b.width;
    if(Math.abs(dx)<.5&&Math.abs(dy)<.5&&Math.abs(s-1)<.002)return;
    if((a.bottom<0&&b.bottom<0)||(a.top>vh&&b.top>vh))return;
    moved=true;c.animate([{transform:`translate(${dx}px,${dy}px) scale(${s})`},{transform:'none'}],{duration:DUR,easing:EASE,delay,fill:'backwards'})});
  tail.forEach(([e,top])=>{if(top==null||!e.getClientRects().length)return;const d=top-e.getBoundingClientRect().top;if(Math.abs(d)>.5)e.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:DUR,easing:EASE})});
  /* above the map and out of the pointer's way only while cards are really travelling */
  clearTimeout(moveT);if(!moved){grid.classList.remove('moving');return}
  grid.classList.add('moving');moveT=setTimeout(()=>grid.classList.remove('moving'),DUR+150)}
function setView(v){
  if(v===S.view||!hasPins)return;
  ensureMap();
  const before=col.getBoundingClientRect(),opacity=parseFloat(getComputedStyle(col).opacity),running=col.getAnimations().length>0,anim=!calm()&&wide();
  flip(()=>{S.view=v;split.classList.toggle('map',v==='map');syncView();save()});
  stop(col);if(!anim)return;
  const after=col.getBoundingClientRect(),dx=before.left-after.left,dy=before.top-after.top;
  if(v==='map')col.animate([running?{opacity,transform:`translate(${dx}px,${dy}px)`}:{opacity:0,transform:'translateX(56px) scale(.98)'},{opacity:1,transform:'none'}],{duration:DUR,easing:EASE});
  else col.animate([{opacity:running?opacity:1,visibility:'visible',transform:`translate(${dx}px,${dy}px)`},{opacity:0,visibility:'hidden',transform:`translate(${dx+56}px,${dy}px) scale(.98)`}],{duration:320,easing:EASE})}

/* ---------- the map: drawn only when wanted, so a visitor who stays on the grid loads no map ---------- */
let mapOn=false;
function drawPins(){if(!mapOn||!window.RentletHomeMap)return;
  const rooms=CUR.filter(l=>l.lat!=null&&l.lng!=null).map(l=>({code:l.key,lat:l.lat,lng:l.lng,price:l.price,title:roomName(l),img:pic(l.img),dates:wl(l.start,l.end)}));
  RentletHomeMap.draw($('#cxMap'),rooms,{label:`Map of rooms near ${schoolName(S.school)}`,onHover:code=>$$('.cx-card[data-code]',grid).forEach(c=>c.classList.toggle('pin-hot',c.dataset.code===code))})}
function ensureMap(){if(mapOn)return;mapOn=true;drawPins()}
window.RL_homeMap=drawPins; /* src/homemap.ts calls this once it has loaded, in case the list was drawn first */

/* ---------- the cards ---------- */
const emptyHtml=()=>{const none=!L.some(l=>l.school===S.school);
  return `<div class="cx-empty"><h3>${none?`No rooms near ${schoolName(S.school)} yet`:'Nothing lines up with these filters'}</h3><p>Post what you need and hosts near campus can message you.</p><div class="cx-empty-a"><button type="button" class="cx-pri" data-ask>Create a housing request</button>${none?'':'<button type="button" class="cx-lnk" data-clearall>Clear filters</button>'}</div></div>`};
function update(anim=true){
  syncBar();
  if(!LOADED){grid.innerHTML=FAILED?`<div class="cx-empty"><h3>Couldn’t load the rooms</h3><p>Check your connection and try again.</p><div class="cx-empty-a"><button type="button" class="cx-pri" data-retry>Try again</button></div></div>`:skeleton(4);hasPins=false;syncView();grid.setAttribute('aria-busy',String(!FAILED));return}
  CUR=scoped().sort((a,b)=>BY[S.sort](a,b)||b.createdAtMs-a.createdAtMs);
  $('#cnt').textContent=plural(CUR.length,'room');
  hasPins=CUR.some(l=>l.lat!=null&&l.lng!=null);
  const first=!painted,html=CUR.length?CUR.map((l,i)=>cxCard(l,i,agoOf(l.createdAtMs),`data-code="${l.key}"`)).join(''):emptyHtml();
  const paint=()=>{grid.classList.toggle('cx-swap',first);grid.innerHTML=html;grid.setAttribute('aria-busy','false');split.classList.toggle('map',shown()==='map');$('#endn').hidden=!CUR.length;syncView()};
  if(anim&&!first)flip(paint);else paint();
  painted=true;
  if(shown()==='map')ensureMap();
  /* on wide screens the map is drawn ahead of time, while the page is idle, so its tiles are there for the first switch */
  else if(hasPins&&wide()&&!mapOn)(window.requestIdleCallback||setTimeout)(ensureMap);
  drawPins();save()}

/* a request filled in from what is on screen */
function ask(){const p=read('cs-plan');p.school=S.school;if(S.start&&S.end){p.start=S.start;p.end=S.end}
  try{sessionStorage.setItem('cs-plan',JSON.stringify(p))}catch(_){}
  if(S.budget!==Infinity)BudgetPicker.save(S.budget);
  location.href='request.html?from=search'}

/* ---------- what you can do here ---------- */
const whereForm=$('[data-wform]');whereForm.addEventListener('submit',e=>e.preventDefault());
WhereSearch.attach({form:whereForm,seg:$('[data-wseg]',whereForm),valueEl:$('[data-wval]',whereForm),current:schoolName(S.school),onCampus:v=>{S.school=v;update()}});
vseg.addEventListener('pointerenter',ensureMap);vseg.addEventListener('focusin',ensureMap);
document.addEventListener('click',e=>{const t=e.target;if(!t||!t.closest)return;
  const sb=t.closest('[data-sortbtn]');if(sb){if(S.sortOpen)closeSort(false);else openSort(e.detail===0);return}
  const so=t.closest('[data-sort]');if(so){const kb=e.detail===0;S.sort=so.dataset.sort;closeSort(kb);update();return}
  if(S.sortOpen&&!t.closest('.sort-pop'))closeSort(false);
  const v=t.closest('[data-view]');if(v){setView(v.dataset.view);return}
  const w=t.closest('[data-when]');if(w){WhenPicker.open({anchor:w,mode:'leave',start:S.start,end:S.end,onDone:(s,en)=>{S.start=s;S.end=en;update()}});return}
  if(t.closest('[data-clear]')){S.start=S.end=null;update();return}
  const bd=t.closest('[data-bud]');if(bd){BudgetPicker.open({anchor:bd,value:S.budget,prices:L.filter(l=>l.school===S.school).map(l=>l.price),onDone:v2=>{S.budget=v2;update()}});return}
  if(t.closest('[data-clearall]')){S.start=S.end=null;S.budget=Infinity;update();return}
  if(t.closest('[data-ask]')){ask();return}
  if(t.closest('[data-retry]')){location.reload();return}
  const m=t.closest('[data-showmap]');if(m){ensureMap();if(window.RentletHomeMap)RentletHomeMap.open(m);return}
  const c=t.closest('[data-cxhref]');if(c)location.href=c.dataset.cxhref});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sortOpen){closeSort(true);return}
  if(S.sortOpen&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const o=$$('.sort-pop button'),i=o.indexOf(document.activeElement),d=e.key==='ArrowDown'?1:-1;e.preventDefault();o[(i+d+o.length)%o.length].focus();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-cxhref]')){e.preventDefault();location.href=e.target.dataset.cxhref}});
addEventListener('rentlet:menu',()=>closeSort(false));
/* a card under the pointer or focus darkens its price on the map */
let hot=null;const hi=code=>{if(code===hot||!mapOn||!window.RentletHomeMap)return;hot=code;RentletHomeMap.highlight(code)};
const cardCode=t=>{const c=t&&t.closest&&t.closest('.cx-card[data-code]');return c?c.dataset.code:null};
grid.addEventListener('mouseover',e=>hi(cardCode(e.target)));grid.addEventListener('mouseleave',()=>hi(null));
grid.addEventListener('focusin',e=>hi(cardCode(e.target)));grid.addEventListener('focusout',()=>hi(null));
addEventListener('resize',placeInd);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInd);

window.RL_onAuth=()=>{const r=$('.hdr-right');if(r)r.innerHTML=(RL.msgs?RL.msgs():'')+(RL.menu?RL.menu():'');if(LOADED)update(false)};
window.RL_onListings=list=>{if(list){LOADED=true;FAILED=false;L.splice(0,L.length,...list.map(d=>RentletListings.toCard(d)))}else if(!LOADED)FAILED=true;update()};
update(false);
</script>
<script type="module" src="/src/rentlet.ts"></script>
<script type="module" src="/src/homemap.ts"></script>
