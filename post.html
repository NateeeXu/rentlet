<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Post a listing · Rentlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Post a listing: one question per screen (flow A from post-options.html). The page is one screen tall; each step
   centres when it is short and scrolls inside when it is long; the header and the Back / Next bar never move. */
:root{--canvas:#f7f7f7;--soft:#f2f2f4;--ink:#222;--ink2:#484848;--muted:#717171;--faint:#9a9aa0;--line:#dddddd;--hair:#e8e8e8;--ok:#1a7f37;--warn:#8a5200;--serif:"Newsreader",Georgia,serif;--ctl:52px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
.stage{container-type:inline-size;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--canvas)}
.hd{flex:none;background:#fff;border-bottom:1px solid var(--hair)}
.hd .wrap{height:64px;display:flex;align-items:center;gap:16px}
.hd img{height:26px}
.hd .r{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.hd .r .save{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0 8px;height:44px;display:inline-flex;align-items:center;white-space:nowrap;flex:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

/* one set of controls: the same height, font and radius everywhere */
h2.q{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.5px;line-height:1.15;margin:0}
.hint{margin:8px 0 0;font-size:15px;color:var(--muted);line-height:1.5}
.grp{margin-top:28px}
.grp+.grp{margin-top:22px}
.lbl{display:block;font-size:14px;font-weight:650;color:var(--ink);margin-bottom:8px}
.lbl small{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.in{height:var(--ctl);border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:16px;gap:8px;min-width:0;margin:0}
.in input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:16px;font-variant-numeric:tabular-nums;padding:0}
.in .u{color:var(--muted);font-size:14px;white-space:nowrap}
.in .pre{color:var(--muted);font-size:16px}
.in.ta{height:auto;padding:12px 14px;align-items:flex-start}
.in.ta textarea{border:0;outline:0;flex:1;resize:none;font-size:16px;line-height:1.5;background:none;min-width:0;padding:0}
.in:focus-within,.in.ws-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* fields that open the homepage pickers (campus, rent) or drive the inline calendar (dates) */
.in.pk{width:100%;text-align:left;cursor:pointer;justify-content:space-between;font-variant-numeric:tabular-nums}
.in.pk:hover,.in.ws:hover{border-color:#b8b8bd}
.in.pk[aria-expanded=true],.in.pk.act{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.in .pkph{color:var(--muted)}
/* the rent fields: a typed amount, with the homepage price picker one tap away for comparing */
.in.num{cursor:text}
.in .pkb{flex:none;width:44px;height:44px;margin:0 -10px 0 0;padding:0;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--muted)}
.in .pkb:hover{background:var(--soft);color:var(--ink)}
.in .pkb[aria-expanded=true]{color:var(--ink)}
/* an answer the step still needs, shown after Next or Publish found it missing */
.need{margin:8px 0 0;font-size:14px;font-weight:600;line-height:1.4;color:var(--warn)}
.need.top{margin:0 0 10px}
.ns{color:var(--warn)}
.cal{margin-top:16px}
.in svg.ch{width:16px;height:16px;flex:none;color:var(--muted)}
.in.ws{cursor:pointer}
.in.ws .ws-in{font-size:16px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--ctl);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.opt:hover{border-color:#b8b8bd}
.opt b{display:block;font-size:15px;font-weight:600}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.opt.on,.opt.on:hover{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .tk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.opt.on .tk{background:var(--ink);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.ad{margin-top:16px;border-top:1px solid #ececef}
.ad-r{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ececef}
.ad-r b{font-size:14px;font-weight:650}
.ad-c{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ad-c .g{display:flex;flex-wrap:wrap;gap:6px}
.ad-c .g+.g{padding-left:10px;border-left:1px solid #dedee3}
.ad-n{margin:10px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:560px){.ad-r{grid-template-columns:1fr;gap:8px}.ad-c .g+.g{padding-left:0;border-left:0}}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none}
.chip:hover{border-color:#b8b8bd}
.chip.on,.chip.on:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:var(--ctl);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.tog b{font-size:15px;font-weight:600}
.tog span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tog .lk{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.sw{width:44px;height:26px;border-radius:99px;background:var(--ink);position:relative;flex:none;border:0;padding:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.off{background:#cfcfd4}.sw.off::after{right:auto;left:3px}
.note{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
/* the picked place on a small map right above the street address (as in the mini program): a black pin, and
   "Adjust position" (top right) to move it to the entrance; the HERE notice stays at the bottom right */
.pl-box{margin-bottom:16px}
.pl-box[hidden]{display:none}
.pl-map{position:relative;height:220px;border-radius:16px;overflow:hidden;background:#eef1f5;border:1px solid var(--hair);isolation:isolate}
.pl-map.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pl-map.stale .pl-map-c{opacity:.45;filter:grayscale(1)}
.pl-map-c{position:absolute;inset:0;z-index:0}
.pl-map .leaflet-control-zoom{display:none}
.pl-adj{position:absolute;top:10px;right:10px;z-index:1;display:inline-flex;align-items:center;justify-content:center;width:auto;min-width:0;height:44px;margin:0;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);box-shadow:0 1px 4px rgba(0,0,0,.18);font-size:14px;font-weight:650;color:var(--ink);white-space:nowrap}
.pl-adj:hover{background:#fff}
.pl-adj[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.pl-adj:disabled{opacity:.55;cursor:default}
.pl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-top:2px;font-size:13px;color:var(--muted);line-height:1.4}
.pl-row span{min-width:0}
.pl-lk{flex:none;width:auto;min-width:0;height:44px;margin:0 -6px 0 0;padding:0 6px;border:0;background:none;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;display:inline-flex;align-items:center}
.pl-lk[hidden]{display:none}
.sub{margin:0;font-size:13px;color:var(--muted);margin-bottom:8px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ph{aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted);text-align:center;border:1px dashed #cfcfd4;position:relative;overflow:hidden;cursor:pointer;margin:0;padding:6px}
.ph:hover{border-color:#9a9aa0}
.ph.has{border:0;cursor:default}
.ph.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has img.flip{transform:scaleX(-1)}
.ph.has em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:12px;font-weight:650;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 8px;color:var(--ink)}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.ph b{font-size:14px;color:var(--ink)}
/* step 12: lease proof files, private to the host and the Rentlet team */
.pf{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pf-h{margin:0 0 10px;font-size:15px;font-weight:650;color:var(--ink)}
.pf-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0;border-top:1px solid var(--line)}
.pf-row:first-of-type{border-top:0}
.pf-ic{flex:none;width:36px;height:36px;border-radius:8px;background:#f2f2f4;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2)}
.pf-n{flex:1;min-width:0;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-s{flex:none;font-size:13px;color:var(--muted)}
.pf-row .x{flex:none;width:44px!important;height:44px;min-width:0;margin:0 -8px 0 0;padding:0;border:0;border-radius:50%;background:none;font-size:20px;color:var(--ink);cursor:pointer}
.pf-row .x:hover{background:#f2f2f4}
.pf-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:88px;margin-top:10px;border:1px dashed #c8c8cc;border-radius:12px;cursor:pointer;text-align:center;font-size:13px;color:var(--muted)}
.pf-add:hover{border-color:var(--ink)}
.pf-add b{font-size:14px;color:var(--ink)}
.pf-note{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
/* a restored draft had files that a draft can't keep: say so on the step that needs them */
.sk{display:block;max-width:100%;border-radius:7px;background:linear-gradient(90deg,#e9e9ec 25%,#f2f2f4 50%,#e9e9ec 75%);background-size:200% 100%;animation:sksh 1.5s linear infinite}
@keyframes sksh{from{background-position:100% 0}to{background-position:-100% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.lost{margin:20px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;line-height:1.5;color:var(--ink2)}
/* the rent picker with too few real rents at this campus to compare: no bars (and, from budget-picker.js, no counts) */
body.rl-norents .bp-hist{display:none}
.btn{height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.lnk{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0 8px;margin:0 -8px;height:44px}
.btn.lnk:disabled{opacity:.35;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}

.a-top{height:3px;background:var(--hair);position:relative;flex:none}
.a-top i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s cubic-bezier(.22,1,.36,1)}
.a-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.a-q{width:min(600px,100%);margin:auto;padding:40px 24px} /* margin:auto centres a short step; a long one scrolls */
.a-step{font-size:13px;color:var(--muted);margin:0 0 8px}
.a-foot{flex:none;background:#fff;border-top:1px solid var(--hair)}
.a-foot .wrap{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.a-steps{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.a-steps button{width:32px;height:32px;border-radius:50%;border:1px solid var(--hair);background:#fff;font-size:12px;color:var(--muted);padding:0}
.a-steps button.on{border-color:var(--ink);color:var(--ink);font-weight:650}
.a-steps button.done{background:var(--soft);border-color:var(--soft);color:var(--ink2)}
.a-steps button:disabled{opacity:.4;cursor:default}
.review{display:grid;margin-top:8px}
.rrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;padding:12px 0;border-top:1px solid var(--hair);font-size:14px;align-items:start}
.rrow:first-child{border-top:0}
.rrow dt{color:var(--muted)}
.rrow dd{margin:0;font-weight:600;line-height:1.4}
.rrow .edit{font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0}
.rcard{border:1px solid var(--hair);border-radius:18px;background:#fff;overflow:hidden}
.rcard img{width:100%;aspect-ratio:16/9;object-fit:cover}
.rcard .rc{padding:14px 16px}
.rcard h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:0}
.rcard p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.rcard .pr{margin-top:8px;font-family:var(--serif);font-size:26px;font-weight:500}
.rcard .pr small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;color:var(--muted)}
.done{text-align:center}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:22px}
.done .acts{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.done .acts .btn{flex:none;white-space:nowrap}

@container (max-width:700px){
  .hd .wrap{height:56px;gap:12px}.hd .r .save{padding:0}
  .wrap{padding:0 16px}
  h2.q{font-size:26px}
  .a-q{padding:24px 16px 28px}
  .opts.two,.row2{grid-template-columns:minmax(0,1fr)}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a-foot .wrap{height:auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .a-steps{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .rrow dt{grid-column:1/-1}
}
/* small phones: Save and exit stays; the heart and chat icons step aside (both are in the menu) */
@container (max-width:380px){
  .hd .r .save{font-size:13px}
  .hd .r .save~.rl-msgs{display:none}
}
</style>

<style id="rentlet-base">
/* Rentlet: the review chrome around the approved designs is hidden; the page itself is unchanged. */
.rv,.review-foot,.rv-note,.rv-toggle{display:none!important}
html,body{background:#f7f7f7}
:root{--brand:#4E2A84;--brand-dark:#3b1f64;--brand-soft:#efeaf6}
a:has(>img[src$="rentlet-logo.png"]){display:inline-flex;align-items:center;min-height:44px}

<body>
<div class="stage" id="stage"></div>
<script src="where-search.js?v=a730c995"></script>
<script src="when-picker.js?v=f5fa1089"></script>
<script src="budget-picker.js?v=43431017"></script>
<script>
const $=s=>document.querySelector(s);
/* everything the form knows, so a click anywhere can redraw the screen without losing anything. Every fact starts
   unanswered (null or empty), so a listing only shows what the host chose; act (which date the calendar sets next)
   and map (every listing shows on the map) are not answers. */
const S={step:0,done:false,f:{},
  subletType:null,transferChannel:null,dep:null,refund:null,map:true,hasRoommates:null,gender:null,shuttle:null,route:null,layout:null,
  start:null,end:null,act:'in',rent:null,orig:null,unit:null,bath:null,furn:null,neg:null,view:null,terms:null,proof:null,
  campus:'',campusId:null,video:null,
  multi:{fees:[],amen:[],habits:[],items:[]},amenD:{},
  prefs:{},
  photos:{bedroom:[],living:[],bath:[],kitchen:[],building:[],amenities:[]}};
/* edit mode (post.html?edit={listing number}, from Profile): the same steps, filled in from the published listing.
   state: loading, ok, signin, denied, missing or error. An edit never reads or writes the draft. */
const EDIT_PARAM=new URLSearchParams(location.search).get('edit'),EDIT_OK=/^[1-9][0-9]{7}$/.test(EDIT_PARAM||'');
let EDIT=EDIT_PARAM===null?null:{code:EDIT_OK?EDIT_PARAM:'',state:EDIT_OK?'loading':'missing'};
if(EDIT)document.title='Edit your listing · Rentlet';
/* the campus the visitor picked on the homepage (their own choice), then the draft saved in this browser */
try{const p=JSON.parse(sessionStorage.getItem('cs-plan')||'{}'),row=p.school&&WhereSearch.SCHOOLS.find(x=>x[0]===p.school);if(row){S.campusId=row[0];S.campus=row[1]}}catch(_){}
/* the draft: every answer is saved in this browser (localStorage) as the host goes, so a reload, a closed tab or a
   phone that drops the page keeps the form; it is cleared once the listing is published. Files (photos, the video,
   lease proof) can't be kept in a draft: LOST counts the ones it had, so the Photos and proof steps ask for them again.
   An older draft (rl-post-draft-v2, this tab only) is picked up once and moved to the new key. */
const DRAFT_KEY='rl-post-draft-v3',OLD_DRAFT='rl-post-draft-v2';
let LOST={photos:0,video:0,proof:0},FROM_OLD=false;
if(!EDIT)try{let raw=localStorage.getItem(DRAFT_KEY);if(!raw){raw=sessionStorage.getItem(OLD_DRAFT);FROM_OLD=!!raw}
  const d=raw?JSON.parse(raw):null;
  if(d&&typeof d==='object'){const {files,photos,...rest}=d,fl=files||{};
    LOST={photos:+fl.photos||0,video:fl.video||rest.video?1:0,proof:+fl.proof||0};
    Object.assign(S,rest,{done:false,map:true,video:null});
    if(!S.f||typeof S.f!=='object')S.f={};if(!S.prefs||typeof S.prefs!=='object')S.prefs={};if(!S.amenD||typeof S.amenD!=='object'||Array.isArray(S.amenD))S.amenD={};
    S.multi=Object.assign({fees:[],amen:[],habits:[],items:[]},S.multi);for(const k in S.multi)if(!Array.isArray(S.multi[k]))S.multi[k]=[]}}catch(_){}
const money=v=>'$'+v.toLocaleString('en-US');
const val=(k,d)=>k in S.f?S.f[k]:d;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
/* a typed dollar amount: "1,480" -> 1480; blank or not a number -> null */
const dollars=v=>{const n=Math.round(parseFloat(String(v??'').replace(/[^\d.]/g,'')));return n>0?n:null};
const depAmt=()=>dollars(val('dep',''));
const TODAY=(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)(new Date());
const MAXPH=20; /* firestore.rules: at most 20 photos a listing */
const toast=m=>{if(window.Rentlet&&Rentlet.toast)Rentlet.toast(m)};
/* what rooms at this campus ask, for the rent picker's histogram: the live listings (src/listings.ts subscribeActive),
   loaded when the Money step first shows; rooms whose move-out day has passed are left out. With fewer than MIN_RENTS
   real rents there is nothing fair to compare with, so the picker shows no bars, counts or typical range. */
const MIN_RENTS=8;
let LIVE=[],LIVE_ON=false;
const rents=()=>{const p=LIVE.filter(l=>l.campusId===S.campusId&&!(l.end&&l.end<TODAY)).map(l=>l.price);return p.length>=MIN_RENTS?p:[]};
const pkLabel=()=>rents().length?'Compare with rooms nearby':'Pick the rent on a slider';
function liveRents(){if(LIVE_ON||!window.RentletListings||S.done||STEPS[S.step].q!=='Money')return;LIVE_ON=true;
  RentletListings.subscribeActive(list=>{LIVE=list.map(d=>({campusId:d.campusId,price:Number(d.price)||0,end:String(d.end||'')})).filter(l=>l.price>0);
    document.querySelectorAll('[data-pk]').forEach(b=>{b.setAttribute('aria-label',pkLabel());b.title=pkLabel()})},()=>{LIVE=[]})}
addEventListener('rentlet:ready',()=>liveRents());

     ['Rules',Object.values(S.prefs).filter(Boolean).join(' · ')||'None set',9],
     ['Photos',line([`${pc} photo${pc===1?'':'s'}`,`${areasDone()} of ${AREAS.length} areas`,S.video&&'video'],ok(10)),10],
     ['Verification',S.proof==='student'?'School email ✓':S.proof==='lease'?line([`School email ✓ · lease proof (${nOf(PROOF.length+(EDIT&&EDIT.proof||0),'file')})`],ok(11)):NS,11]
   ].map(([t,v,n])=>`<div class="rrow"><dt>${t}</dt><dd>${v}</dd><button type="button" class="edit" data-go="${n}">Edit</button></div>`).join('')}</dl>
   ${grp('A note for the listing',ta('note','','e.g. I’m away for winter quarter. Quiet room with a proper desk.'),'optional · shows as a quote')}
   <p class="note">${EDIT?'Your changes show as soon as you save.':'Goes live as soon as you publish, with a listing number, and leaves search after the move-out day. Up to 3 listings at a time.'}</p>`}}];
/* what a step still needs, and the first step (from the top) that still needs something */
const missing=i=>STEPS[i]&&STEPS[i].need?STEPS[i].need():[];
const firstGap=()=>{for(let i=0;i<STEPS.length;i++){const m=missing(i);if(m.length)return [i,m[0]]}return null};
/* the step dots go back anywhere, and forward past answered steps up to the first one that still needs something */
const reach=()=>{if(EDIT)return STEPS.length-1;for(let k=S.step;k<STEPS.length;k++)if(missing(k).length)return k;return STEPS.length-1};

/* edit mode, before the form: the shape of the review step while it loads, or why it can't open */
const skB=(w,h=13,x='')=>`<i class="sk" style="width:${w};height:${h}px;${x}"></i>`;
const editLoadingView=()=>`${header()}<div class="a-top"><i style="width:100%"></i></div><div class="a-scroll"><div class="a-q" role="status" aria-busy="true" aria-label="Loading your listing"><div aria-hidden="true">${skB('120px',13)}${skB('min(320px,70%)',30,'margin-top:14px;border-radius:9px')}${skB('90%',14,'margin-top:14px')}
  <div class="rcard" style="margin-top:26px;padding:14px;display:grid;gap:9px">${skB('100%',150,'border-radius:12px')}${skB('62%',15)}${skB('40%',12)}</div>
  <dl class="review grp">${Array.from({length:6},()=>`<div class="rrow"><dt>${skB('70px',12)}</dt><dd>${skB('78%',13)}</dd><span>${skB('26px',12)}</span></div>`).join('')}</dl></div></div></div>`;
const editStateView=()=>{if(EDIT.state==='loading')return editLoadingView();
  const back=`<a class="btn sec" href="profile.html#listings">Back to Profile</a>`,[h,p,acts]={
    signin:['Sign in to edit this listing','Use the school Google account you posted it with.',`<button type="button" class="btn" data-edit-signin>Sign in with Google</button>`],
    denied:['You can’t edit this listing','Only the host who posted it can.',back],
    missing:['We couldn’t find this listing','It may have been deleted, or the link may be wrong.',back],
    error:['Couldn’t load your listing','Check your connection and try again.',`${back}<button type="button" class="btn" data-edit-retry>Try again</button>`]}[EDIT.state];
  return `${header()}<div class="a-top"><i style="width:100%"></i></div><div class="a-scroll"><div class="a-q done"><h2 class="q">${h}</h2><p class="hint">${p}</p><div class="acts">${acts}</div></div></div>`};
const editedView=()=>`${header()}<div class="a-top"><i style="width:100%"></i></div><div class="a-scroll"><div class="a-q done"><div class="ok">✓</div><h2 class="q">Your changes are saved</h2><p class="hint">Listing #${S.code}. ${EDIT.status==='active'?'The listing shows them now.':'It’s still off search.'}</p><div class="grp" style="text-align:left">${card()}</div><div class="acts">${EDIT.status==='active'?`<a class="btn sec" href="room.html?room=${S.code}">See your listing</a>`:''}<a class="btn" href="profile.html#listings">Back to Profile</a></div></div></div>`;
const page=()=>{if(EDIT&&EDIT.state!=='ok')return editStateView();
  const n=STEPS.length,i=Math.min(S.step,n-1),s=STEPS[i],last=i===n-1;
  if(S.done&&EDIT)return editedView();
  if(S.done)return `${header()}<div class="a-top"><i style="width:100%"></i></div><div class="a-scroll"><div class="a-q done"><div class="ok">✓</div><h2 class="q">Your listing is live</h2><p class="hint">Listing #${S.code}. It’s in search now. You can edit it, mark it as taken or take it down from Profile.</p><div class="grp" style="text-align:left">${card()}</div><div class="acts"><a class="btn sec" href="room.html?room=${S.code}">See your listing</a><a class="btn" href="index.html">Back to home</a></div></div></div>`;
  return `${header(EDIT?'<button type="button" class="save" data-cancel>Cancel</button>':'<button type="button" class="save" data-save title="Your answers are saved in this browser as you go">Save and exit</button>')}<div class="a-top"><i style="width:${EDIT?100:(i+1)/n*100}%"></i></div><div class="a-scroll" id="ascroll"><div class="a-q"><p class="a-step">${EDIT?`Listing #${EDIT.code}`:`Step ${i+1} of ${n}`}</p><h2 class="q">${EDIT&&last?'Edit your listing':s.q}</h2>${EDIT&&last?'<p class="hint">Change what you need, then save. The listing number and link stay the same.</p>':s.h?`<p class="hint">${s.h}</p>`:''}${s.body()}</div></div>
  <div class="a-foot"><div class="wrap"><button class="btn lnk" data-back ${EDIT?'style="visibility:hidden" tabindex="-1" aria-hidden="true"':i===0?'disabled':''}>Back</button><div class="a-steps">${STEPS.map((x,k)=>`<button type="button" data-go="${k}" aria-label="Step ${k+1}: ${x.q}"${k===i?' aria-current="step"':''}>${k+1}</button>`).join('')}</div><button class="btn" data-next>${EDIT?(last?'Save changes':'Done'):last?'Publish':'Next'}</button></div></div>`};
/* the dots' state follows the answers, also while one is being typed (typing doesn't redraw the step) */
function syncDots(){const i=S.step,r=reach();document.querySelectorAll('.a-steps [data-go]').forEach(b=>{const k=+b.dataset.go;
  b.className=k===i?'on':(k<i||EDIT)&&!missing(k).length?'done':'';b.disabled=k>r;b.title=k>r?`Finish step ${r+1} first`:STEPS[k].q})}

/* the missing-answer line stays only while that answer is still missing on this step */
const stillNeeded=()=>NEED&&NEED.step===S.step&&missing(NEED.step).some(([k,m])=>k===NEED.key&&m===NEED.msg);
function clearNeed(){if(NEED&&!stillNeeded()){NEED=null;const m=$('#need-msg');if(m)m.remove()}syncDots();autosave()}
const FOCUSABLE='input:not([type=file]),textarea,button:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* Next or Publish found a missing answer: go to its step, say what's missing under the field, and focus the field */
function showNeed(i,[key,msg]){
  if(key==='dates')S.act=S.start&&S.start>=TODAY?'out':'in'; /* the calendar sets the day that's missing */
  S.step=i;NEED={step:i,key,msg};render();toast(msg);
  const box=$(`[data-need="${key}"]`),sel={dates:`[data-side=${S.act}]`,dep:'[data-f=dep]',addr:'[data-f=addr]',layout:S.layout==='Other'?'[data-f=layoutOther]':'',proof:S.proof==='lease'?'.pf-add':''}[key];
  let f=(sel&&$(sel))||(box&&(box.matches(FOCUSABLE)?box:box.querySelector(FOCUSABLE)));
  if(!f&&box){box.tabIndex=-1;f=box}
  if(f){f.focus();f.setAttribute('aria-describedby','need-msg')}
  const m=$('#need-msg');if(m)m.scrollIntoView({block:'nearest'})}

function render(){
  if(window.BudgetPicker)BudgetPicker.close();
  plAdjustDone();plMapDrop(); /* a pin being moved keeps its spot; the map is drawn again below */
  if(NEED&&!stillNeeded())NEED=null;
  const st=$('#stage');st.innerHTML=page();
  /* the dates step carries the homepage calendar itself; a pick updates the two fields and the chips in place
     (a first tap sets move-in and clears move-out until the second tap) */
  calApi=null;st.querySelectorAll('[data-cal]').forEach(m=>{calApi=WhenPicker.mount({mount:m,start:S.start,end:S.end,act:S.act,onChange:(s,e,act)=>{S.act=act;S.start=s||null;S.end=s&&e&&e>s?e:null;syncDates(S.start,S.end);clearNeed()}})});
  /* the campus field is the homepage's city → campus list */
  document.querySelectorAll('.ws-pop').forEach(p=>p.remove());
  st.querySelectorAll('[data-wform]').forEach(f=>{f.addEventListener('submit',e=>e.preventDefault());const out=f.querySelector('[data-wval]');
    WhereSearch.attach({form:f,seg:f.querySelector('[data-wseg]'),valueEl:out,current:S.campus,onCampus:(v,name)=>{S.campusId=v;S.campus=name;placeCampus();render()}});
    if(!S.campus)out.innerHTML='<span class="pkph">Choose a campus</span>'});
  /* the building field lists the apartment directory, the street address field HERE addresses */
  PL_OPEN=null;st.querySelectorAll('[data-f=building],[data-f=addr]').forEach(placeField);plMapSync();syncDots();
  liveRents();autosave()}
/* the draft (see DRAFT_KEY): every answer but the files, plus how many files it had; saved a moment after each change */
const draftState=()=>{const {photos,video,done,code,...rest}=S;
  return Object.assign(rest,{files:{photos:Math.max(photoCount(),LOST.photos),video:S.video||LOST.video?1:0,proof:S.proof==='lease'?Math.max(PROOF.length,LOST.proof):LOST.proof}})};
let SAVE_T=0,SAVED=null;
function saveDraft(){clearTimeout(SAVE_T);SAVE_T=0;if(S.done)return;
  try{const j=JSON.stringify(draftState());if(j!==SAVED){localStorage.setItem(DRAFT_KEY,j);SAVED=j;sessionStorage.removeItem(OLD_DRAFT)}}catch(_){}}
const autosave=()=>{if(S.done||SAVED==null)return;clearTimeout(SAVE_T);SAVE_T=setTimeout(saveDraft,400)};
function clearDraft(){clearTimeout(SAVE_T);SAVE_T=0;try{localStorage.removeItem(DRAFT_KEY);sessionStorage.removeItem(OLD_DRAFT)}catch(_){}}
/* a tab closed or a phone switching apps saves what's pending at once */
addEventListener('pagehide',()=>{if(SAVE_T)saveDraft()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&SAVE_T)saveDraft()});

document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-cancel]')){location.href='profile.html#listings';return}
  if(t.closest('[data-edit-retry]')){loadEdit();return}
  if(t.closest('[data-edit-signin]')){RL.signIn();return}
  const nx=t.closest('[data-next]');if(nx){if(S.step>=STEPS.length-1){(EDIT?saveEdit:publish)(nx);return}
    const m=missing(S.step)[0];if(m){showNeed(S.step,m);return}
    S.step=EDIT?STEPS.length-1:S.step+1;render();window.scrollTo(0,0);return}
  const rp=t.closest('[data-rmproof]');if(rp){PROOF.splice(+rp.dataset.rmproof,1);render();return}
  if(t.closest('[data-back]')){S.step=Math.max(0,S.step-1);render();return}
  if(t.closest('[data-edit]')){S.done=false;S.step=STEPS.length-1;render();return}
  if(t.closest('[data-save]')){SAVED='';saveDraft();location.href='index.html';return}
  const g=t.closest('[data-go]');if(g){const k=+g.dataset.go;if(k>S.step&&k>reach())return;S.step=k;render();return}
  /* a single choice; an optional one clears when tapped again */
  const set=t.closest('[data-set]')||t.closest('[data-one]');if(set){const [k,v]=(set.dataset.set||set.dataset.one).split(':');S[k]=CLEARABLE.includes(k)&&S[k]===v?null:v;if(k==='dep'&&v==='none')S.refund=null;render();return}
  const rf=t.closest('[data-refund]');if(rf){S.refund=rf.dataset.refund==='1';render();return}
  const pr=t.closest('[data-pref]');if(pr){const [k,v]=pr.dataset.pref.split(':');S.prefs[k]=S.prefs[k]===v?'':v;render();return}
  const m=t.closest('[data-multi]');if(m){const [g,v]=m.dataset.multi.split(':'),a=S.multi[g],i=a.indexOf(v);
    if(i>=0){a.splice(i,1);const d=g==='amen'&&AMEN_D.find(x=>x[0]===v);if(d)delete S.amenD[d[1]]}else{if(g==='fees'){if(v==='Nothing extra')a.length=0;else{const j=a.indexOf('Nothing extra');if(j>=0)a.splice(j,1)}}a.push(v)}render();return}
  const ad=t.closest('[data-amend]');if(ad){const [k,g,v]=ad.dataset.amend.split(':'),d=S.amenD[k]||(S.amenD[k]={});if(d[g]===v)delete d[g];else d[g]=v;if(!Object.keys(d).length)delete S.amenD[k];render();return}
  const dd=t.closest('[data-dates]');if(dd){[S.start,S.end]=dd.dataset.dates.split(':');S.act='in';if(calApi)calApi.set(S.start,S.end);syncDates(S.start,S.end);clearNeed();return}
  const sd=t.closest('[data-side]');if(sd){S.act=sd.dataset.side;if(calApi)calApi.setAct(S.act);syncDates(S.start,S.end);return}
  const rm=t.closest('[data-rm]');if(rm){const [k,i]=rm.dataset.rm.split(':');S.photos[k].splice(+i,1);render();return}
  if(t.closest('[data-video-rm]')){VIDEO=null;S.video=null;render();return}
  /* a full set of photos: the file chooser doesn't open */
  if(t.closest('label.ph')&&photoCount()>=MAXPH){e.preventDefault();toast(`You can add up to ${MAXPH} photos. Remove one to add another.`);return}
  /* the price picker, in its rent mode, from the chart button inside each rent field */
  const p=t.closest('[data-pk]');if(p){const k=p.dataset.pk;
    const pr=rents();document.body.classList.toggle('rl-norents',!pr.length);
    return BudgetPicker.open({anchor:p,mode:'rent',value:S[k]||0,prices:pr,title:k==='orig'?'What you pay now':'Your rent a month',note:k==='orig'?'Shown struck through next to your rent.':'',onDone:v=>{S[k]=v;render()}})}
  const nb=t.closest('.in.num');if(nb&&!t.closest('input,button'))nb.querySelector('input').focus()});
/* the photo and file tiles open their file chooser from the keyboard too */
document.addEventListener('keydown',e=>{const l=e.target.closest&&e.target.closest('label[tabindex]');if(l&&(e.key==='Enter'||e.key===' ')){e.preventDefault();l.click()}});
/* typed text survives every redraw; a rent field keeps a whole number of dollars */
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.f,n=el.dataset.num;if(k)S.f[k]=el.value;if(n)S[n]=dollars(el.value);if(k||n)clearNeed()});
/* photos and the video come from real files, checked here so nothing fails only at Publish */
const VIDEO_OK=f=>/^video\/(mp4|quicktime|webm)$/.test(f.type)||(!f.type&&/\.(mp4|m4v|mov|webm)$/i.test(f.name));
document.addEventListener('change',e=>{const el=e.target,file=el.files&&el.files[0];if(!file)return;
  if(el.dataset.area){el.value='';const a=el.dataset.area,full=`You can add up to ${MAXPH} photos. Remove one to add another.`;
    if(photoCount()>=MAXPH)return toast(full);
    if(!/^image\//.test(file.type))return toast('Add a photo (JPG, PNG or WebP).');
    const fr=new FileReader();fr.onload=()=>{if(photoCount()>=MAXPH)return toast(full);S.photos[a].push(fr.result);render()};fr.readAsDataURL(file)}
  else if('video' in el.dataset){el.value='';
    if(!VIDEO_OK(file))return toast('Add the video as an MP4, MOV or WebM file.');
    if(file.size>=60*1024*1024)return toast('That video is over 60 MB. Try a shorter clip.');
    VIDEO=file;S.video=file.name;render()}
  else if('proof' in el.dataset){el.value='';
    if(!/^(image\/(jpeg|png|webp|heic|heif)|application\/pdf)$/.test(file.type))return toast('Add a photo (JPG, PNG, WebP or HEIC) or a PDF.');
    if(file.size>=10*1024*1024)return toast('That file is over 10 MB. Try a smaller photo or PDF.');
    if(PROOF.length<3){PROOF.push(file);render()}}});
/* from here on, changes save themselves; an older draft moves to the new key on the first save */
if(!EDIT)SAVED=FROM_OLD?'':JSON.stringify(draftState());
if(EDIT&&EDIT.state==='loading'){addEventListener('rentlet:ready',loadEdit,{once:true});setTimeout(()=>{if(EDIT.state==='loading'){EDIT.state='error';render()}},20000)}
render();
</script>
<script type="module" src="/src/rentlet.ts"></script>
