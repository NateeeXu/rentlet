<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages · Rentlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<script src="when-picker.js?v=7860cfd6"></script>
<style>
:root{
  --canvas:#f7f7f7;--ink:#222;--ink2:#484848;--muted:#717171;--hair:#e8e8e8;--ring:#c4c4c4;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--ease:cubic-bezier(.22,1,.36,1);
  --glass:rgba(255,255,255,.66);--glass-fx:blur(24px) saturate(1.6);--glass-bd:1px solid rgba(255,255,255,.75);
  --glass-sh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.16),0 2px 6px rgba(30,25,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img,video{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flip{transform:scaleX(-1)}

/* the page is the app: one full-height frame */
.stage{height:100vh;height:100dvh;min-height:480px;background:#fff}

/* ---------- site ---------- */
.site{container-type:inline-size;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#fff}
.hdr{flex:none;background:#fff;border-bottom:1px solid var(--hair)}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:64px;padding:0 24px}
.hdr .logo{display:flex;align-items:center;min-height:44px}
.hdr img{height:24px}
.hdr nav{display:flex;gap:4px;margin-left:8px}
.hdr nav a,.hdr nav span{font-size:14px;font-weight:600;color:var(--ink2);padding:0 12px;min-height:44px;display:flex;align-items:center;border-radius:999px;text-decoration:none}
.hdr nav a:hover{background:var(--canvas)}
.hdr nav span{color:var(--ink);background:var(--canvas)}
.hdr-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.me-link{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:99px;text-decoration:none}
.me-av{width:36px;height:36px;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:600;white-space:nowrap;width:auto;flex:0 0 auto;margin:0;background:none;text-decoration:none;transition:transform .18s,background .18s,border-color .18s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-primary[disabled]{background:#c4c4c4;cursor:not-allowed}
.btn-secondary{background:#fff;border-color:var(--hair);color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink)}
.btn.wide{width:100%;white-space:normal;text-align:center;line-height:1.3;padding:10px 18px}
.ibtn{width:44px;height:44px;border-radius:99px;border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.ibtn:hover{background:var(--canvas)}

.body{flex:1;min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr) 300px;position:relative}
@container (max-width:1100px){.body{grid-template-columns:280px minmax(0,1fr) 280px}}

/* inbox */
.inbox{border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0;background:#fff}
.inbox-h{padding:16px 18px 0}
.inbox-h h1{font-family:var(--serif);font-size:28px;font-weight:500;margin:0;letter-spacing:-.4px}
.tabs{display:flex;gap:18px;margin-top:6px;border-bottom:1px solid var(--hair)}
.tabs button{background:none;border:0;min-height:44px;padding:0;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.tabs .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--ink);margin-left:6px}
.search{margin:12px 18px 6px;min-height:44px;border-radius:99px;background:var(--canvas);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--muted)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--ink);height:44px}
.search input::placeholder{color:var(--muted)}
.undo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 18px;padding:0 0 0 14px;border:1px solid var(--hair);border-radius:14px;font-size:13px;color:var(--ink2)}
.undo button{border:0;background:none;font-weight:600;font-size:13px;min-height:44px;padding:0 14px;text-decoration:underline;text-underline-offset:3px}
.convs{overflow:auto;flex:1;padding:4px 8px 12px}
.conv{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:16px;border:0;background:none;width:100%;text-align:left;min-height:72px}
.conv:hover{background:var(--canvas)}
.conv.on{background:var(--canvas)}
.cv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cv-top b{font-size:15px}
.cv-top time{font-size:12px;color:var(--muted);flex:none}
.conv .rel{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .last{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:1px}
.conv .last span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.conv.unread .last span,.conv.unread .cv-top b{color:var(--ink);font-weight:700}
.unread-dot{width:8px;height:8px;border-radius:99px;background:var(--ink);flex:none}
.av{width:48px;height:48px;border-radius:99px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;position:relative;flex:none}
.av .vf{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:99px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--hair)}
.av .vf .ic{width:12px;height:12px;stroke-width:2.4}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty p{margin:0 0 14px}

/* thread */
.thread{display:flex;flex-direction:column;min-height:0;background:#fff}
.th-h{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--hair);flex:none;min-height:64px}
.th-h .av{width:40px;height:40px;font-size:15px}
.th-h .grow{flex:1;min-width:0}
.th-h b{font-size:16px;display:block}
.th-h .grow span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-h .back{display:none;margin-left:-8px}
.who{flex:1;min-width:0;display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:2px 6px 2px 2px;border-radius:14px;min-height:44px}
.who:hover{background:var(--canvas)}
/* profile */
.pf-top{display:flex;gap:14px;align-items:center}
.pf-top .av{width:64px;height:64px;font-size:24px}
.pf-top h2{font-size:20px;margin:0}
.pf-top p{margin:4px 0 0;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rchip{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border:1px solid var(--hair);border-radius:99px;font-size:12px;font-weight:600;color:var(--ink)}
.pf-ver{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.pf-ver li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.pf-ver li .ic{margin-top:2px;color:var(--muted)}
.pf-ver li.ok .ic{color:var(--ink)}
.pf-ver b{display:block;font-weight:600}
.pf-ver small{display:block;font-size:12px;color:var(--muted)}
.pf-m{font-size:13px;color:var(--muted);margin:12px 0 0}
.pf .card{margin-top:14px}
.pf-about{font-size:15px;line-height:1.45;margin:14px 0 0}
.pf-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pf-tags span{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--canvas);color:var(--ink2)}
.pf .acts{margin-top:18px}
.pf-room .taken{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.reqc{padding:14px}
.reqc .ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.reqc .ct b{font-size:14px}
.reqc .unit{font-size:12px;color:var(--muted);white-space:nowrap}
.reqc .meta{font-size:13px;color:var(--muted);margin:2px 0 0}
.reqc .legs{margin-top:8px}
.reqc .leg{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:7px 0;font-size:14px;border-top:1px solid var(--hair);font-variant-numeric:tabular-nums}
.reqc .leg-k{font-size:12px;color:var(--muted);font-weight:600;width:62px}
.reqc .pill{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--canvas);color:var(--ink2);white-space:nowrap;margin-left:auto}
.reqc .bud{font-size:13px;color:var(--muted);margin:8px 0 0}
.reqc .quote{font-size:14px;margin:8px 0 0;color:var(--ink2)}
.pp{position:absolute;top:0;bottom:0;right:0;left:320px;z-index:30;background:#fff;display:flex;flex-direction:column;border-left:1px solid var(--hair);opacity:0;visibility:hidden;transform:translateX(12px);transition:opacity .25s,transform .35s var(--ease),visibility 0s .35s}
.pp.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s,transform .35s var(--ease)}
.pp-h{display:flex;align-items:center;gap:6px;padding:10px 18px 10px 12px;border-bottom:1px solid var(--hair);min-height:64px;flex:none}
.pp-h b{font-size:16px}
.pp-b{flex:1;overflow:auto;padding:24px 32px 32px}
@container (max-width:1100px){.pp{left:280px}}
@container (min-width:901px){
  .pp .pf{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);column-gap:40px;align-items:start;max-width:920px}
  .pp .pf>*{grid-column:1}
  .pp .pf>.card{grid-column:2;grid-row:1 / span 9;margin-top:0}
  .pp .pf .acts{grid-template-columns:repeat(2,minmax(0,1fr));max-width:420px}
}
/* quick messages sheet */
.qtabs{display:flex;gap:6px;overflow-x:auto;margin:12px -20px 0;padding:0 20px 8px;scrollbar-width:none;border-bottom:1px solid rgba(0,0,0,.06)}
.qtabs::-webkit-scrollbar{display:none}
.qtabs button{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.7);font-size:13px;font-weight:600}
.qtabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.qh{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 2px}
.sh-sc>.qh:first-child{margin-top:8px}
.qrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:10px 2px;border:0;border-top:1px solid rgba(0,0,0,.06);background:none;text-align:left;font-size:15px;line-height:20px}
.qh+.qrow{border-top:0}
.qrow span{flex:1}
.qc{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.qc .ic{width:14px;height:14px;stroke-width:2.4}
.qrow[aria-checked=true] .qc{background:var(--ink);border-color:var(--ink);color:#fff}
.sheet.wide{width:min(520px,calc(100% - 32px))}
.gone{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 18px 0;padding:8px 8px 8px 16px;border:1px solid var(--hair);border-radius:16px;font-size:14px;flex:none}
.none{flex:1;background:var(--canvas)}
.msgs{flex:1;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:3px}
.msgs>*{flex:none}
.stamp{align-self:center;font-size:12px;color:var(--muted);margin:10px 0 6px}
.b{max-width:min(72%,520px);padding:10px 14px;border-radius:20px;font-size:15px;line-height:20px;overflow-wrap:anywhere;white-space:pre-wrap}
.b.them{background:#fff;border:1px solid var(--hair);align-self:flex-start}
.b.me{background:var(--ink);color:#fff;align-self:flex-end}
.b.gap{margin-top:10px}
.b.media{padding:0;overflow:hidden;border-radius:18px}
.b.media img{max-width:240px;width:100%;height:auto;max-height:300px;object-fit:cover}
.b.media video{width:260px;max-width:100%;background:#000}
.mt{font-size:12px;color:var(--muted);margin:3px 4px 4px}
.mt.me{align-self:flex-end}
.new{animation:pop .35s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:12px 14px;display:flex;gap:4px;margin-top:10px}
.typing i{width:7px;height:7px;border-radius:99px;background:var(--muted);animation:bounce 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.sys{align-self:stretch;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
.sys::before,.sys::after{content:"";flex:1;min-width:16px;border-top:1px solid var(--hair)}
/* swap C: a system card in the thread */

/* composer */
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 18px 0;scrollbar-width:none;flex:none}
.quick::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:#fff;font-size:13px;font-weight:500;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.composer{display:flex;gap:6px;align-items:flex-end;padding:8px 18px max(14px,env(safe-area-inset-bottom));flex:none;position:relative}
.composer textarea{flex:1;min-width:0;height:44px;min-height:44px;resize:none;border-radius:22px;border:1px solid var(--hair);padding:11px 16px;font-size:15px;line-height:20px;overflow-y:hidden;background:#fff;display:block}
.composer textarea:focus{outline:none;border-color:var(--ink)}
.composer .ibtn{border-color:var(--hair)}
.composer .send{background:var(--ink);color:#fff;border:0}
.composer .send:hover{background:#000}
.composer .send[disabled]{background:#c4c4c4;cursor:not-allowed}

/* rail */
.side{border-left:1px solid var(--hair);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fff;min-height:0}
.side>*{flex:none}
.side-h{display:none}
.card{background:#fff;border-radius:16px;border:1px solid var(--hair);padding:14px}
.tl{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tl span{font-weight:400;font-size:13px;color:var(--muted)}
.rcard{display:block;text-decoration:none;padding:0;overflow:hidden}
.rcard img{width:100%;aspect-ratio:2/1;object-fit:cover}
.rcard .rc{padding:12px 14px 14px}
.rcard small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.rcard h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0;letter-spacing:-.2px}
.rcard p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.rcard .pr{margin-top:6px;font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.3px}
.rcard .pr small{display:inline;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px}
a.rcard:hover h3{text-decoration:underline;text-underline-offset:3px}
.st{display:grid;grid-template-columns:22px minmax(0,1fr) 16px;gap:10px;align-items:center;width:100%;min-height:48px;padding:8px 0;border:0;border-top:1px solid var(--hair);background:none;text-align:left;color:var(--ink)}
.settle>.st:first-child{border-top:0}
.st b{display:block;font-size:14px;font-weight:600}
.st .d{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.st>.ic{color:var(--muted);transition:transform .25s var(--ease)}
.st[aria-expanded=true]>.ic{transform:rotate(90deg)}
.tick{width:22px;height:22px;border-radius:99px;border:1.5px solid var(--ring);display:flex;align-items:center;justify-content:center;color:transparent;transition:background .3s,border-color .3s}
.st.wait .tick{border:1.5px dashed var(--muted)}
.st.done .tick{background:var(--ink);border-color:var(--ink);color:#fff}
.tick .ic{width:14px;height:14px;stroke-width:2.4}
.st.flash{animation:flash 1s var(--ease)}
@keyframes flash{30%{background:var(--canvas)}}
.lock{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45;margin:4px 0 0}
.lock .ic{margin-top:1px}
.cx{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:14px;padding:4px 4px 4px 12px;margin-top:8px}
.cx span{min-width:0}
.cx small{display:block;font-size:12px;color:var(--muted)}
.cx b,.cx a{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.mut{font-size:13px;color:var(--muted);margin:8px 0 0;line-height:1.45}
.swapc .btn{margin-top:10px}
/* swap B: the card turns over */

/* sheet, scrim */
.scrim{position:absolute;inset:0;background:rgba(34,34,34,.2);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s}
.scrim.on{opacity:1;visibility:visible;transition:opacity .25s}
.sheet{position:absolute;z-index:60;left:50%;top:50%;width:min(400px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:hidden;display:flex;flex-direction:column;padding:0;border-radius:24px;
  background:var(--glass);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx);border:var(--glass-bd);box-shadow:var(--glass-sh);
  opacity:0;visibility:hidden;transform:translate(-50%,-47%) scale(.98);transition:opacity .25s,transform .35s var(--ease),visibility 0s .35s}
.sheet.on{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition:opacity .25s,transform .35s var(--ease)}
.sh-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sheet>.sh-h{flex:none;padding:16px 12px 0 20px}
.sh-top{flex:none;padding:0 20px}
.sh-sc{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;position:relative;padding:2px 20px 20px}
.sh-ft{flex:none;display:grid;gap:8px;padding:12px 20px 20px;border-top:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.55)}
.sh-ft.two{grid-template-columns:auto minmax(0,1fr)}
.sheet.tall{height:min(720px,calc(100% - 48px));max-height:none}
.sheet.tall .sh-sc{background:rgba(255,255,255,.6)}
.sh-h h2{font-size:17px;margin:10px 0 0}
.sh-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sh-b{font-size:14px;line-height:1.5;color:var(--ink2);margin-top:10px}
.sh-b p{margin:0 0 8px}
.acts{display:grid;gap:8px;margin-top:14px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.list li{display:flex;gap:8px;align-items:center}
.dl{margin:0;display:grid;gap:0}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(0,0,0,.08)}
.dl div:first-child{border-top:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;text-align:right;color:var(--ink);font-weight:600}
.safe{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink2);margin:10px 0 0}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 14px;border:1px solid var(--hair);border-radius:14px;background:rgba(255,255,255,.7);text-align:left;margin-top:8px}
.opt[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .rd{width:18px;height:18px;border-radius:99px;border:1.5px solid var(--ring);flex:none}
.opt[aria-checked=true] .rd{border:5px solid var(--ink)}
.opt small{display:block;font-size:12px;color:var(--muted)}
.opt b{display:block;font-size:14px}

.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-size:14px;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* phone pieces (hidden on desktop) */
.pinl{display:none}
.pinl{grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:60px;padding:8px 14px;border:0;border-bottom:1px solid var(--hair);background:#fff;text-align:left;flex:none}
.pinl img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.pinl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinl .s{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pinl .n{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.pinl .n b{font-size:14px}
.pinl .n span{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--muted)}

@container (max-width:900px){
  .hdr nav{display:none}
  .body{grid-template-columns:minmax(0,1fr);overflow:hidden}
  .inbox{border-right:0}
  .side{border-left:0}
  .th-h .back{display:flex}
  /* A and B: thread slides over the inbox */
  .p-A .thread{position:absolute;inset:0;z-index:5;transform:translateX(100%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s}
  .p-A.v-thread .thread{transform:none;visibility:visible;transition:transform .4s var(--ease)}
  .p-A .pinl{display:grid}
  /* A: the rail is a bottom sheet */
  .p-A .side{position:absolute;left:0;right:0;bottom:0;top:auto;z-index:45;max-height:86%;border-radius:24px 24px 0 0;
    background:rgba(255,255,255,.88);-webkit-backdrop-filter:var(--glass-fx);backdrop-filter:var(--glass-fx);border:var(--glass-bd);box-shadow:var(--glass-sh);
    padding:8px 16px max(16px,env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
  .p-A .side.open{transform:none;visibility:visible;transition:transform .45s var(--ease)}
  .p-A .side-h{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;margin:0 -16px;padding:4px 8px 0 16px;z-index:2}
  .side-h b{font-size:15px}
  /* B: a room header in the thread that folds */
  /* C: bottom tab bar, one panel at a time */
  .pp{left:0;border-left:0;opacity:1;transform:translateX(100%);transition:transform .4s var(--ease),visibility 0s .4s}
  .pp.on{transform:none;transition:transform .4s var(--ease)}
  .pp-h{min-height:60px}
  .pp-b{padding:16px 16px max(20px,env(safe-area-inset-bottom))}
}
@container (max-width:640px){

let TAB='looking',CUR=null,PENDING=[],Q='',EMPTY=false,UNDO=null,PICK=null,REPORT=null,VIEW='inbox',RAIL=false,QSEL=new Set(),QTAB='all';
const th=()=>TH[CUR];
const count=(t,f)=>t.msgs.filter(m=>m.f===f).length;
const unlocked=t=>count(t,'me')>=3&&count(t,'them')>=3&&t.p.ok;
const swapped=t=>t.share.mine&&t.share.theirs;
const doneN=t=>KEYS.filter(k=>t.settle[k][0]==='done').length;
const inTab=tab=>EMPTY?[]:Object.values(TH).filter(t=>t.tab===tab&&!t.blocked).sort((a,b)=>b.ord-a.ord);
const host=t=>t.tab==='subletting';
const kindLabel=k=>k==='wechat'?'Instagram':'Email',kindWord=k=>k==='wechat'?'Instagram':'email';
const lastLine=t=>{const m=[...t.msgs].reverse().find(m=>m.f==='me'||m.f==='them');if(!m)return 'New conversation';const x=m.img?'Sent a photo':m.vid?'Sent a video tour':m.x.replace(/\n+/g,' ');return (m.f==='me'?'You: ':'')+x};
let site,stage;const isPhone=()=>site&&site.clientWidth<=900;

/* ---------- render: shell ---------- */
function shell(){
  stage.innerHTML=`<div class="site" id="site"><header class="hdr"><div class="wrap"><a class="logo" href="index.html"><img src="img/rentlet-logo.png" alt="Rentlet"></a><nav aria-label="Main"><a href="index.html">Find a place</a><a href="requests.html">Requests</a><a href="how-it-works.html">How it works</a><span aria-current="page">Messages</span></nav><div class="hdr-r"><a class="btn btn-secondary post" href="post.html">Post a listing</a><a class="me-link" href="profile.html" aria-label="Your profile"><span class="me-av" aria-hidden="true">Y</span></a></div></div></header>
  <div class="body"><aside class="inbox" id="inbox" aria-label="Conversations"><div class="inbox-h"><h1>Messages</h1><div class="tabs" role="tablist" id="tabs"></div></div><label class="search">${ic('search','sm')}<span class="sr">Search conversations</span><input id="q" type="search" placeholder="Search people or rooms" autocomplete="off"></label><div id="undo"></div><div class="convs" id="convs"></div></aside>
  <section class="thread" id="thread" aria-label="Conversation"></section><aside class="side" id="side" aria-label="This room"></aside><section class="pp" id="pp" aria-label="Profile"></section></div>
  <div class="scrim" id="scrim"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"></div><div class="toast" id="toast" role="status"></div></div>`;
  site=$('#site');$('#q').value=Q;$('#q').oninput=e=>{Q=e.target.value;renderList()};
  if(!CUR&&!isPhone()){const f=inTab(TAB)[0];if(f)CUR=f.id}
  renderAll();
}
function siteClass(){site.className=`site p-A${VIEW!=='inbox'?' v-thread':''} view-${VIEW}`}
function renderAll(){siteClass();renderList();renderThread();renderRail();}
function refresh(flash){renderList();if(th()){renderMsgs();renderQuick();renderRail(flash);renderPin();}}

/* ---------- inbox ---------- */
const avatar=(p,s)=>`<span class="av" style="background:${p.col}${s?`;width:${s}px;height:${s}px`:''}" aria-hidden="true">${p.name[0]}${p.ok?`<span class="vf">${ic('check')}</span>`:''}</span>`;
function renderList(){
  $('#tabs').innerHTML=['looking','subletting'].map(t=>`<button role="tab" data-act="tab" data-tab="${t}" aria-selected="${TAB===t}">${t==='looking'?'Looking':'Subletting'}${inTab(t).some(x=>x.unread)?'<i class="dot"></i><span class="sr">, unread</span>':''}</button>`).join('');
  $('#undo').innerHTML=UNDO?`<div class="undo"><span>${esc(TH[UNDO].p.name)} is blocked.</span><button data-act="unblock">Undo</button></div>`:'';
  const all=inTab(TAB),q=Q.trim().toLowerCase(),list=q?all.filter(t=>(t.p.name+' '+t.r.title+' '+t.r.area).toLowerCase().includes(q)):all;
  $('#convs').innerHTML=!all.length?(TAB==='looking'?`<div class="empty"><p>No conversations yet. Rooms you message show up here.</p><a class="btn btn-secondary" href="index.html">Find a place</a></div>`:`<div class="empty"><p>When someone messages you about your room it shows up here.</p><a class="btn btn-secondary" href="post.html">Post a listing</a></div>`)
   :!list.length?`<div class="empty"><p>No matches.</p></div>`
   :list.map(t=>`<button class="conv${t.id===CUR?' on':''}${t.unread?' unread':''}" data-act="conv" data-id="${t.id}" aria-current="${t.id===CUR}">${avatar(t.p)}<span style="min-width:0"><span class="cv-top"><b>${esc(t.p.name)}</b><time>${t.when}</time></span><span class="rel">${t.taken?'Taken · ':''}${esc(t.r.title)}</span><span class="last"><span>${esc(lastLine(t))}</span>${t.unread?'<i class="unread-dot" aria-label="Unread"></i>':''}</span></span></button>`).join('');
}

/* ---------- thread ---------- */
function renderThread(){const t=th(),el=$('#thread');
  if(!t){el.innerHTML='<div class="none"></div>';return}
  el.innerHTML=`<div class="th-h"><button class="ibtn back" data-act="back" aria-label="Back to messages">${ic('back')}</button><button class="who" data-act="profile" aria-label="${esc(t.p.name)}, view profile">${avatar(t.p,40)}<span class="grow"><b>${esc(t.p.name)}</b><span>${esc(t.p.role)}${t.p.ok?'':' · verification in review'}</span></span></button><button class="ibtn" data-act="more" aria-label="More options" aria-haspopup="dialog">${ic('more')}</button></div>
   ${t.taken?`<div class="gone"><span>${esc(t.p.name)}’s room was taken on ${t.taken}.</span><a class="btn btn-secondary" href="index.html">See similar rooms</a></div>`:''}
   <button class="pinl" id="pinl" data-act="rail"></button>
   <div class="msgs" id="msgs" aria-live="polite"></div><div class="quick" id="quick"></div>
   <form class="composer" id="composer" autocomplete="off"><button type="button" class="ibtn" data-act="qopen" aria-label="Quick messages" aria-haspopup="dialog">${ic('bolt')}</button><button type="button" class="ibtn attach" data-act="attach" aria-label="Attach a photo">${ic('photo')}</button><input type="file" id="file" accept="image/*" multiple hidden><label class="sr" for="inp">Message ${esc(t.p.name)}</label><textarea id="inp" rows="1" placeholder="Message ${esc(t.p.name)}"></textarea><button class="ibtn send" type="submit" aria-label="Send" disabled>${ic('send')}</button></form>`;
  t.drawn=t.msgs.length;bindComposer(t);renderMsgs();renderQuick();renderPin();
}
function msgHtml(t,m,i){const nw=i>=t.drawn?' new':'';
  if(m.f==='day')return `<div class="stamp">${m.x}</div>`;
  if(m.f==='sys')return `<div class="sys${nw}">${esc(m.x)}</div>`;
  if(m.f==='unlock')return `<div class="sys${nw}">Contact details unlocked</div>`;
  const prev=t.msgs[i-1],next=t.msgs[i+1],gap=prev&&(prev.f==='me'||prev.f==='them')&&prev.f!==m.f?' gap':'';
  const body=m.img?`<img src="${m.img}" alt="Photo you sent">`:m.vid?`<video src="${m.vid}" controls playsinline preload="metadata" aria-label="Video tour"></video>`:esc(m.x);
  return `<div class="b ${m.f}${m.img||m.vid?' media':''}${gap}${nw}">${body}</div>`+(!next||next.f!==m.f?`<div class="mt ${m.f}">${m.t||''}</div>`:'')}
function renderMsgs(){const t=th(),el=$('#msgs');if(!t||!el)return;
  el.innerHTML=t.msgs.map((m,i)=>msgHtml(t,m,i)).join('')+(t.typing?`<div class="typing" aria-label="${esc(t.p.name)} is typing"><i></i><i></i><i></i></div>`:'');
  t.drawn=t.msgs.length;el.scrollTop=el.scrollHeight}
/* quick asks come from the items that are still open */
function openAsks(t){return t.taken?[]:ASKS.filter(k=>t.settle[k][0]==='open'&&!(host(t)&&k==='landlord'))}
/* at most two quick asks, drawn from the settle items still open; the bolt sheet has the full set */
function renderQuick(){const t=th(),el=$('#quick');if(!t||!el)return;
  el.innerHTML=openAsks(t).slice(0,2).map(k=>`<button type="button" class="chip" data-act="ask" data-k="${k}">${esc(ask(t,k))}</button>`).join('');
  el.hidden=!el.innerHTML}
const MAXH=5*20+22+2;
function grow(){const i=$('#inp');if(!i)return;i.style.height='auto';const h=Math.min(i.scrollHeight+2,MAXH);i.style.height=h+'px';i.style.overflowY=i.scrollHeight+2>MAXH?'auto':'hidden';$('#composer .send').disabled=!i.value.trim()}
function bindComposer(t){const i=$('#inp'),f=$('#composer'),file=$('#file');i.value=t.draft||'';grow();
  i.addEventListener('input',()=>{t.draft=i.value;if(!i.value.trim())PENDING=[];grow()});
  i.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();submit()}});
  f.addEventListener('submit',e=>{e.preventDefault();submit()});
  file.addEventListener('change',()=>{[...file.files].filter(x=>x.type.startsWith('image/')).forEach(x=>send(null,URL.createObjectURL(x)));file.value=''})}
function submit(){const i=$('#inp'),v=i.value.trim();if(!v)return;i.value='';th().draft='';grow();send(v)}
function insert(text,keys,caret){const t=th();if(!t)return;closeSheet();closeRail();const i=$('#inp');i.value=text;t.draft=text;PENDING=keys;grow();i.focus();if(caret!=null)i.setSelectionRange(caret,caret);else i.setSelectionRange(text.length,text.length)}

/* ---------- sending and simulated replies ---------- */
function send(text,img){const t=th();if(!t)return;
  t.msgs.push(img?{f:'me',img,t:clock()}:{f:'me',x:text,t:clock()});t.when=clock();t.ord=++ORD;
  const ks=PENDING.slice();PENDING=[];
  ks.forEach(k=>{if(t.settle[k][0]==='open')t.settle[k]=['wait','']});
  if(ks.includes('money'))moneyNote(t);
  checkUnlock(t);refresh();queueReply(t,ks)}
function moneyNote(t){if(!t.notes.money){t.notes.money=1;t.msgs.push(SY(SAFE[t.tab]))}}
function checkUnlock(t){if(unlocked(t)&&!t.notes.unlock){t.notes.unlock=1;t.msgs.push({f:'unlock'})}}
function queueReply(t,ks){t.q.push(ks);if(!t.typing)setTimeout(()=>runReply(t),reduced?60:500)}
function runReply(t){if(!t.q.length)return;t.typing=true;if(t.id===CUR)renderMsgs();
  setTimeout(()=>{const batch=t.q.splice(0);const keys=[...new Set(batch.flat())];const out=[];let flash=null;
    if(!keys.length)out.push({x:count(t,'them')===0&&!host(t)?`Hi! Yes, it’s free ${span(t.r.start,t.r.end)}.`:['Sounds good.','Sure, happy to help.','Let me check and get back to you today.'][count(t,'them')%3]});
    keys.forEach(k=>{const r=reply(t,k);out.push(...r.m);if(r.s){t.settle[k]=r.s;flash=k}});
    out.forEach(m=>t.msgs.push({f:'them',t:clock(),...m}));t.when=clock();t.ord=++ORD;t.typing=false;
    if(t.id!==CUR||t.blocked)t.unread=true;checkUnlock(t);refresh(flash);if(t.q.length)runReply(t)},reduced?120:1400)}
function reply(t,k){const R=t.r;
  if(host(t))return {dates:{m:[{x:`${span(...t.want)}, if that works.`}],s:['done',span(...t.want)]},tour:{m:[{x:'Yes please! Any evening works.'}],s:['wait',`${t.p.name} would like one`]},
    money:{m:[{x:'No, that’s clear. Thanks!'}],s:['done',`${money(R.price)} / mo · ${money(R.deposit)} deposit`]},stays:{m:[{x:'The desk and bookshelf would be great.'}],s:['done',short(R.stays)]},landlord:{m:[{x:'Great, thanks for checking.'}]}}[k];
  return {dates:{m:[{x:`Yes, it’s free ${span(R.start,R.end)}.`}],s:['done',span(R.start,R.end)]},
    tour:{m:[{x:'Here’s a quick video tour.'},{vid:'img/tour.webm'}],s:['done','Received']},
    money:{m:[{x:`${money(R.price)} / mo with ${R.incl.toLowerCase()} included. ${R.extra}. Deposit ${money(R.deposit)}, refundable.`}],s:['done',`${money(R.price)} / mo · ${money(R.deposit)} deposit`]},
    stays:{m:[{x:`${listText(R.stays)} ${R.keep?'are yours to keep':'stay'}.`}],s:['done',short(R.stays)]},
    landlord:{m:[{x:R.takeover?'Yes, the landlord approved the takeover.':'Yes, my landlord is fine with a sublet.'}],s:['done',`Confirmed by ${t.p.name}`]}}[k]}

/* ---------- rail: room card, settle list, contact ---------- */
function roomCard(t){const R=t.r,sw=swapped(t),inner=`<img src="img/${R.img}.jpg" alt="" class="${R.flip?'flip':''}"><div class="rc">${host(t)?'<small>Your listing</small>':''}<h3>${esc(R.title)}</h3><p>${esc(sw?R.addr:R.area)} · ${span(R.start,R.end)}</p><div class="pr">${money(R.price)} <small>/ mo</small></div></div>`;
  return host(t)?`<a class="card rcard" href="post.html">${inner}</a>`:`<a class="card rcard" href="room.html?room=${R.key}">${inner}</a>`}
function rowDetail(t,k){const [s,d]=t.settle[k];return s==='done'?d:s==='wait'?(d||`Waiting on ${t.p.name}`):''}
function settleRow(t,k,flash){const s=t.settle[k][0],d=rowDetail(t,k);
  return `<button class="st ${s}${flash===k?' flash':''}" data-act="st" data-k="${k}" aria-haspopup="dialog"><span class="tick">${s==='done'?ic('check'):''}</span><span><b>${LABEL[k]}</b>${d?`<span class="d">${esc(d)}</span>`:''}</span>${ic('right','sm')}</button>`}
function settleCard(t,flash){return `<div class="card"><p class="tl">Settled<span>${doneN(t)} of 5</span></p><div class="settle">${KEYS.map(k=>settleRow(t,k,flash)).join('')}</div></div>`}
function lockLine(t){const a=Math.min(3,count(t,'me')),b=Math.min(3,count(t,'them')),n=t.p.name,need=a<3||b<3;
  const why=need&&!t.p.ok?`Unlocks after 3 replies each and when ${n} is verified`:need?'Unlocks after 3 replies each':`Unlocks when ${n} is verified`;
  return `<p class="lock">${ic('lock','sm')}<span>${why} · you ${a}/3 · ${esc(n)} ${b}/3</span></p>`}
function contactRow(c){return `<div class="cx"><span><small>${kindLabel(c.kind)}</small>${c.kind==='email'?`<a href="mailto:${esc(c.val)}">${esc(c.val)}</a>`:`<b>${esc(c.val)}</b>`}</span><button class="btn btn-secondary" data-act="copy" data-v="${esc(c.val)}" aria-label="Copy ${kindLabel(c.kind)}">${ic('copy','sm')}Copy</button></div>`}
function shareState(t){const n=esc(t.p.name);
  if(!unlocked(t))return lockLine(t);
  if(swapped(t))return contactRow(t.share.theirs)+`<p class="mut">You shared your ${kindWord(t.share.mine)}.</p>`;
  if(t.share.mine)return `<p class="mut">You shared your ${kindWord(t.share.mine)}. Waiting for ${n}.</p><button class="btn btn-secondary wide" data-act="withdraw">Withdraw</button>`;
  return null}
function choices(){return ['wechat','email'].map(k=>`<button class="opt" role="radio" data-act="pick" data-kind="${k}" aria-checked="${PICK===k}"><span class="rd"></span><span><small>${kindLabel(k)}</small><b>${ME[k]}</b></span></button>`).join('')}
function contactCard(t){const n=esc(t.p.name),st=shareState(t),hint=t.share.theirs?`${n} already shared. Share yours to see it.`:`${n} sees yours only when they share too.`;
  return `<div class="card swapc"><p class="tl">Contact details</p>${st||`<p class="mut">${hint}</p><button class="btn btn-primary wide" data-act="share">Share my contact</button>`}</div>`}
function railInner(t,flash){return roomCard(t)+settleCard(t,flash)+contactCard(t)}
function renderRail(flash){const el=$('#side'),t=th();if(!el)return;
  if(!t){el.innerHTML='';return}
  const sc=el.scrollTop;el.innerHTML=`<div class="side-h"><b>This room</b><button class="ibtn" data-act="rail-close" aria-label="Close">${ic('x')}</button></div>`+railInner(t,flash);el.scrollTop=sc;
  el.classList.toggle('open',RAIL)}
function renderPin(){const t=th(),el=$('#pinl');if(!t||!el)return;
  el.setAttribute('aria-label',`${t.r.title}, settled ${doneN(t)} of 5. Show room details`);
  el.innerHTML=`<img src="img/${t.r.img}.jpg" alt="" class="${t.r.flip?'flip':''}"><span style="min-width:0"><b>${esc(t.r.title)}</b><span class="s">${span(t.r.start,t.r.end)}</span></span><span class="n"><b>${money(t.r.price)} / mo</b><span>${doneN(t)} of 5 settled${ic('up','sm')}</span></span>`;}

/* ---------- profile ---------- */
const mins=x=>{const m=/^(\d+):(\d+) (AM|PM)$/.exec(x||'');return m?(+m[1]%12+(m[3]==='PM'?12:0))*60+ +m[2]:null};
/* reply time only when the thread itself shows it */
function replyTime(t){const g=[];let pend=null;t.msgs.forEach(m=>{if(m.f==='day'){pend=null;return}if(m.f==='me'&&pend==null)pend=mins(m.t);else if(m.f==='them'&&pend!=null){const x=mins(m.t);if(x!=null&&x>=pend)g.push(x-pend);pend=null}});
  return !g.length?'':Math.max(...g)<=60?'Usually replies within an hour':'Usually replies within a day'}
const MD=x=>new Date(x+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const dd=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5),days=n=>n===1?'1 day':n+' days';
function reqCard(t,P){const [a,b]=t.want,i=dd(MY.start,a),o=dd(b,MY.end);
  const pin=i===0?'Same day':i>0?`${days(i)} after you`:`${days(-i)} too early`,pout=o===0?'Same day':o>0?`${days(o)} before`:`${days(-o)} past lease`;
  const bud=MY.price<=P.budget?`Your rent fits their budget (up to ${money(P.budget)})`:`Your rent is ${money(MY.price-P.budget)} over their budget`;
  return `<article class="card reqc" aria-label="${esc(t.p.name)}’s request"><div class="ct"><b>${esc(t.p.name)} · ${esc(P.chip)}</b><span class="unit">${esc(P.kind)}</span></div><p class="meta">${span(a,b)}</p>
   <div class="legs"><div class="leg"><span class="leg-k">Move in</span><span>${MD(MY.start)} → <b>${MD(a)}</b></span><span class="pill">${pin}</span></div><div class="leg"><span class="leg-k">Move out</span><span>${MD(MY.end)} → <b>${MD(b)}</b></span><span class="pill">${pout}</span></div></div>
   <p class="bud">${bud}</p><p class="quote">“${esc(P.note)}”</p></article>`}
function listingCard(t){const R=t.r;return `<a class="card rcard pf-room" href="room.html?room=${R.key}"><img src="img/${R.img}.jpg" alt="" class="${R.flip?'flip':''}"><div class="rc"><h3>${esc(R.title)}</h3><p>${esc(R.area)} · ${span(R.start,R.end)}</p><div class="pr">${money(R.price)} <small>/ mo</small></div>${t.taken?`<span class="taken">Taken on ${t.taken}</span>`:''}</div></a>`}
function profHtml(t){const P=PF[t.id]||PF.l4,n=esc(t.p.name),rt=replyTime(t);
  return `<div class="pf"><div class="pf-top">${avatar(t.p,64)}<div><h2>${n}</h2><p><span class="rchip">${esc(P.chip)}</span>${esc(P.org)}</p></div></div>
   <ul class="pf-ver">${P.ver.map(([l,d])=>`<li class="${d?'ok':''}">${ic(d?'check':'lock','sm')}<span><b>${esc(l)}</b><small>${d?'Verified '+d:'In review'}</small></span></li>`).join('')}</ul>
   <p class="pf-m">Member since Oct 2026</p>${host(t)?reqCard(t,P):listingCard(t)}
   <p class="pf-about">${esc(P.about)}</p><div class="pf-tags">${P.life.map(x=>`<span>${esc(x)}</span>`).join('')}</div>${rt?`<p class="pf-m">${rt}</p>`:''}
   <div class="acts"><button class="btn btn-secondary wide" data-act="report">${ic('flag','sm')}Report</button><button class="btn btn-secondary wide" data-act="block">${ic('block','sm')}Block</button></div></div>`}
function openProfile(){const t=th();if(!t)return;
  const pp=$('#pp');pp.innerHTML=`<div class="pp-h"><button class="ibtn" data-act="prof-back" aria-label="Back to the conversation">${ic('back')}</button><b>Profile</b></div><div class="pp-b">${profHtml(t)}</div>`;pp.classList.add('on');closeRail();setTimeout(()=>pp.querySelector('button').focus({preventScroll:true}),30)}
function closeProfile(){const pp=$('#pp');if(pp)pp.classList.remove('on')}

/* ---------- quick messages sheet ---------- */
function qSheet(){const t=th(),G=QR[role(t)].groups,items=qItems(t),n=QSEL.size;let prev='';
  const foot=`<button class="btn btn-secondary" data-act="qins" ${n?'':'disabled'}>Insert</button><button class="btn btn-primary" data-act="qsend" ${n?'':'disabled'}>Send as one message</button>`;
  const body=items.filter(i=>QTAB==='all'||i.g===QTAB).map(i=>{const h=QTAB==='all'&&i.g!==prev?`<h3 class="qh">${G.find(x=>x[0]===i.g)[1]}</h3>`:'';prev=i.g;return h+`<button class="qrow" role="checkbox" aria-checked="${QSEL.has(i.id)}" data-act="qtog" data-id="${i.id}"><span>${esc(i.x)}</span><i class="qc">${ic('check')}</i></button>`}).join('');
  const top=`<div class="qtabs" role="tablist">${[['all','All'],...G].map(([g,l])=>`<button role="tab" data-act="qtab" data-qg="${g}" aria-selected="${QTAB===g}">${l}</button>`).join('')}</div>`;
  openSheet('quick',head('Quick messages',`To ${esc(t.p.name)} · several go as one message`),body,foot,top,true,'two')}
/* several picks read as one polite message: opener, numbered questions, any replies, a closing thanks */
function compose(t,its){const n=t.p.name,hi=`Hi ${n}! `,qs=its.filter(i=>i.x.trim().endsWith('?')),rs=its.filter(i=>!i.x.trim().endsWith('?')).map(i=>i.x);
  if(qs.length<2)return [...qs.map(i=>i.x),...(qs.length&&rs.length?['']:[]),...rs].join('\n');
  const few=qs.length>=3?'A few':'A couple of',open=host(t)?`${hi}Thanks for reaching out. ${few} quick questions:`:`${hi}Thanks for posting this. ${few} quick questions when you get a sec:`;
  const list=qs.map((i,j)=>`${j+1}. ${i.x.startsWith(hi)?i.x.slice(hi.length):i.x}`);
  return [open,'',...list,'',...(rs.length?rs:['Thanks!'])].join('\n')}
function qPicked(){const t=th(),its=qItems(t).filter(i=>QSEL.has(i.id));return [compose(t,its),[...new Set(its.map(i=>i.k).filter(Boolean))]]}

/* ---------- settle sheet bodies ---------- */
function sBody(t,k){const R=t.r,hs=host(t),n=esc(t.p.name),[s,d]=t.settle[k];
  const P=(act,l,x='')=>`<button class="btn btn-primary wide" data-act="${act}" data-k="${k}" ${x}>${esc(l)}</button>`,S=(act,l)=>`<button class="btn btn-secondary wide" data-act="${act}" data-k="${k}">${esc(l)}</button>`;
  const status=s==='done'?'Settled':s==='wait'?(d||`Waiting on ${t.p.name}`):'Open';let body='',acts='';
  if(k==='dates'){const r=hs?span(...t.want):span(R.start,R.end);body=s==='done'?`<p>${esc(d)}</p>`:hs?`<p>${n} asked for ${r}.</p>`:'';
    acts=s==='done'?S('s-reopen','Reopen'):P('s-done',`Confirm ${r}`,`data-v="${r}"`)+S('s-ins','Propose other dates')}
  if(k==='stays'){body=`<ul class="list">${R.stays.map(x=>`<li>${ic('check','sm')}${esc(x)}</li>`).join('')}</ul>${R.keep?'<p class="mut">Yours to keep.</p>':''}`;
    acts=s==='done'?S('s-reopen','Reopen'):P('s-done','Confirm what stays')+S('s-ins',hs?'Ask what they need':'Ask about an item')}
  if(k==='money'){body=`<dl class="dl"><div><dt>Rent</dt><dd>${money(R.price)} / mo</dd></div><div><dt>Deposit</dt><dd>${money(R.deposit)}, refundable</dd></div><div><dt>Included</dt><dd>${esc(R.incl)}</dd></div><div><dt>Extra</dt><dd>${esc(R.extra)}</dd></div></dl><p class="safe">${ic('lock','sm')}<span>${SAFE[t.tab]}</span></p>`;
    acts=s==='done'?S('s-reopen','Reopen'):P('s-done','Confirm money')+S('s-ins','Ask a question')}
  if(k==='tour'){body='';
    acts=s==='done'?S('s-reopen','Reopen'):s==='wait'?P('s-done',hs?'Mark as sent':'Mark as received'):P('s-ins',hs?'Offer a video tour':'Ask for a video tour')}
  if(k==='landlord'){body=s==='done'?`<p>${esc(d)}.</p>`:'';
    acts=s==='done'?S('s-reopen','Reopen'):hs||s==='wait'?P('s-done','Mark as confirmed'):P('s-ins','Ask about the landlord')}
  return {status,body,acts}}
function doneDetail(t,k,v){const R=t.r;return {dates:v,stays:(R.keep?'Yours to keep: ':'')+short(R.stays),money:`${money(R.price)} / mo · ${money(R.deposit)} deposit`,tour:host(t)?'Sent':'Received',landlord:host(t)?'You confirmed':`Confirmed by ${t.p.name}`}[k]}
function insText(t,k){if(k==='dates')return host(t)?['Would other dates work for you? I could do ',null]:['Could other dates work? I’m looking at ',null];
  if(k==='stays'&&!host(t))return ['Does the  stay too?',9];return [ask(t,k),null]}

/* ---------- sheets ---------- */
let sheetKind=null;
/* every sheet: fixed header (title, subtitle, close, tabs), a list that scrolls, a fixed footer; tabbed sheets keep one height */
function openSheet(kind,h,body,foot,top,tall,ftCls){sheetKind=kind;const s=$('#sheet');s.innerHTML=h+(top?`<div class="sh-top">${top}</div>`:'')+`<div class="sh-sc">${body}</div>`+(foot?`<div class="sh-ft${ftCls?' '+ftCls:''}">${foot}</div>`:'');s.classList.toggle('wide',kind==='quick'||kind==='profile');s.classList.toggle('tall',!!tall);s.classList.add('on');$('#scrim').classList.add('on');setTimeout(()=>{const f=s.querySelector('button:not([disabled])');f&&f.focus({preventScroll:true})},30)}
function closeSheet(){sheetKind=null;const s=$('#sheet');if(!s)return;s.classList.remove('on');if(!RAIL)$('#scrim').classList.remove('on')}
const head=(title,sub)=>`<div class="sh-h"><div><h2 id="shT">${title}</h2>${sub?`<p>${sub}</p>`:''}</div><button class="ibtn" data-act="sheet-close" aria-label="Close">${ic('x')}</button></div>`;
function settleSheet(k){const t=th(),b=sBody(t,k);openSheet('settle:'+k,head(LABEL[k],esc(b.status)),b.body?`<div class="sh-b">${b.body}</div>`:'',b.acts)}
function shareSheet(){const t=th(),n=esc(t.p.name);openSheet('share',head('Share my contact',t.share.theirs?`${n} already shared. You’ll both see each other’s.`:`${n} sees it only when they share too.`),`<div role="radiogroup" aria-label="Contact to share">${choices()}</div>`,`<button class="btn btn-primary wide" data-act="share-go" ${PICK?'':'disabled'}>Share</button><button class="btn btn-secondary wide" data-act="sheet-close">Cancel</button>`)}
const REASONS=['Asked for money before a viewing','Listing looks fake','Rude or unsafe','Something else'];
function reportSheet(){const t=th();openSheet('report',head(`Report ${esc(t.p.name)}`),`<div role="radiogroup" aria-label="Reason">${REASONS.map((r,i)=>`<button class="opt" role="radio" data-act="reason" data-i="${i}" aria-checked="${REPORT===i}"><span class="rd"></span><span><b>${r}</b></span></button>`).join('')}</div>`,`<button class="btn btn-primary wide" data-act="report-go" ${REPORT==null?'disabled':''}>Send report</button><button class="btn btn-secondary wide" data-act="sheet-close">Cancel</button>`)}
function blockSheet(){const t=th(),n=esc(t.p.name);openSheet('block',head(`Block ${n}?`,`${n} can’t message you, and this conversation leaves your inbox.`),'',`<button class="btn btn-primary wide" data-act="block-go">Block</button><button class="btn btn-secondary wide" data-act="sheet-close">Cancel</button>`)}
function redrawSheet(){if(!sheetKind)return;const sc=$('#sheet .sh-sc').scrollTop;if(sheetKind.startsWith('settle:'))settleSheet(sheetKind.slice(7));else if(sheetKind==='share')shareSheet();else if(sheetKind==='report')reportSheet();else if(sheetKind==='quick')qSheet();$('#sheet .sh-sc').scrollTop=sc}

function closeRail(){RAIL=false;const s=$('#side');if(s)s.classList.remove('open');if(!sheetKind)$('#scrim')?.classList.remove('on')}

/* ---------- swap ---------- */
let shareTimer=null;
function doShare(kind){const t=th();t.share.mine=kind;PICK=null;
  if(t.share.theirs)swapDone(t);else{clearTimeout(shareTimer);const id=t.id;shareTimer=setTimeout(()=>{const x=TH[id];if(x.share.mine&&!x.share.theirs){x.share.theirs=x.their;swapDone(x);if(x.id!==CUR)x.unread=true;refresh()}},reduced?400:4000)}
  refresh()}
function swapDone(t){if(!t.notes.swapped){t.notes.swapped=1;t.msgs.push(SY(`You and ${t.p.name} swapped contact details`))}}

/* ---------- navigation ---------- */
function openThread(id){const t=TH[id];if(!t)return;const prev=th();if(prev){const i=$('#inp');if(i)prev.draft=i.value}
  CUR=id;TAB=t.tab;t.unread=false;PENDING=[];PICK=null;closeRail();closeSheet();closeProfile();VIEW='thread';
  siteClass();renderList();renderThread();renderRail();requestAnimationFrame(()=>{const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight});
  const u=new URL(location.href);u.searchParams.set('with',id);history.replaceState(null,'',u)}
function setTab(tab){TAB=tab;Q='';$('#q').value='';const list=inTab(tab);
  if(isPhone()){VIEW='inbox';if(!th()||th().tab!==tab)CUR=null;siteClass();renderList();renderThread();renderRail();return}
  if(list[0])openThread(list[0].id);else{CUR=null;renderAll()}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  if(!site||!site.contains(e.target))return;
  const a=e.target.closest('[data-act]');
  if(e.target.id==='scrim'){if(sheetKind)closeSheet();else closeRail();return}
  if(!a)return;const t=th(),k=a.dataset.k,act=a.dataset.act;
  switch(act){
   case 'tab':return setTab(a.dataset.tab);
   case 'conv':return openThread(a.dataset.id);
   case 'back':VIEW='inbox';closeRail();siteClass();return;
   case 'rail':RAIL=true;renderRail();$('#scrim').classList.add('on');return;
   case 'rail-close':return closeRail();
   case 'st':return settleSheet(k);
   case 's-done':t.settle[k]=['done',doneDetail(t,k,a.dataset.v)];if(k==='money')moneyNote(t);refresh(k);return closeSheet();
   case 's-reopen':t.settle[k]=['open',''];refresh(k);return sheetKind?redrawSheet():null;
   case 's-ins':{const [x,c]=insText(t,k);return insert(x,[k],c)}
   case 'ask':return insert(ask(t,k),[k]);
   case 'qopen':QSEL.clear();QTAB='all';return qSheet();
   case 'qtab':QTAB=a.dataset.qg;qSheet();return $('#sheet .sh-sc').scrollTop=0;
   case 'qtog':{const id=a.dataset.id;QSEL.has(id)?QSEL.delete(id):QSEL.add(id);return redrawSheet()}
   case 'qins':{const [x,ks]=qPicked();QSEL.clear();insert(x,ks);const i=$('#inp');i.setSelectionRange(0,0);i.scrollTop=0;return}
   case 'qsend':{const [x,ks]=qPicked();QSEL.clear();closeSheet();PENDING=ks;return send(x)}
   case 'profile':closeSheet();return openProfile();
   case 'prof-back':closeProfile();return renderRail();
   case 'attach':return $('#file').click();
   case 'more':return openSheet('more',head(esc(t.p.name)),`<div class="acts" style="margin-top:6px"><button class="btn btn-secondary wide" data-act="profile">${ic('user','sm')}View profile</button><button class="btn btn-secondary wide" data-act="report">${ic('flag','sm')}Report</button><button class="btn btn-secondary wide" data-act="block">${ic('block','sm')}Block</button></div>`,'');
   case 'report':REPORT=null;return reportSheet();
   case 'reason':REPORT=+a.dataset.i;return reportSheet();
   case 'report-go':closeSheet();t.msgs.push(SY('You reported this conversation.'));refresh();return toast('Report sent');
   case 'block':return blockSheet();
   case 'block-go':{closeSheet();closeProfile();t.blocked=true;UNDO=t.id;const next=inTab(TAB)[0];CUR=null;if(next&&!isPhone())return openThread(next.id);VIEW='inbox';renderAll();return}
   case 'unblock':{const id=UNDO;UNDO=null;TH[id].blocked=false;return openThread(id)}
   case 'share':PICK=null;return shareSheet();
   case 'pick':PICK=a.dataset.kind;return shareSheet();
   case 'share-go':if(!PICK)return;{const kd=PICK;closeSheet();return doShare(kd)}
   case 'withdraw':t.share.mine=null;clearTimeout(shareTimer);return refresh();
   case 'copy':{const v=a.dataset.v;try{navigator.clipboard.writeText(v).catch(()=>{})}catch(_){}return toast('Copied '+v)}
   case 'sheet-close':return closeSheet();
  }});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!site)return;if(sheetKind)return closeSheet();if($('#pp.on'))return closeProfile();if(RAIL)closeRail()});

/* ---------- start ---------- */
stage=$('#stage');
let fm=null;try{fm=sessionStorage.getItem('cs-first-msg');sessionStorage.removeItem('cs-first-msg')}catch(_){}
const W=QS.get('with');
if(W&&ROOMS[W]&&(fm||!TH[W]))TH[W]=fresh(W);
if(W&&TH[W]){CUR=W;TAB=TH[W].tab;VIEW='thread'}
shell();if(CUR&&TH[CUR].unread){TH[CUR].unread=false;renderList()}
if(fm&&CUR===W)setTimeout(()=>send(fm),400);
let lastPhone=isPhone();addEventListener('resize',()=>{const p=isPhone();if(p!==lastPhone){lastPhone=p;if(!p&&!CUR){const f=inTab(TAB)[0];if(f)openThread(f.id)}closeRail();closeProfile();siteClass();renderRail()}});
</script>
</body>
</html>
