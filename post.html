<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Post a listing · Rentlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Post a listing: one question per screen (flow A from post-options.html). The page is one screen tall; each step
   centres when it is short and scrolls inside when it is long; the header and the Back / Next bar never move. */
:root{--canvas:#f7f7f7;--soft:#f2f2f4;--ink:#222;--ink2:#484848;--muted:#717171;--faint:#9a9aa0;--line:#dddddd;--hair:#e8e8e8;--ok:#1a7f37;--serif:"Newsreader",Georgia,serif;--ctl:52px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
.stage{container-type:inline-size;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--canvas)}
.hd{flex:none;background:#fff;border-bottom:1px solid var(--hair)}
.hd .wrap{height:64px;display:flex;align-items:center;gap:16px}
.hd img{height:26px}
.hd .r{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.hd .r .save{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0 8px;height:44px;display:inline-flex;align-items:center}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

/* one set of controls: the same height, font and radius everywhere */
h2.q{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.5px;line-height:1.15;margin:0}
.hint{margin:8px 0 0;font-size:15px;color:var(--muted);line-height:1.5}
.grp{margin-top:28px}
.grp+.grp{margin-top:22px}
.lbl{display:block;font-size:14px;font-weight:650;color:var(--ink);margin-bottom:8px}
.lbl small{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.in{height:var(--ctl);border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:16px;gap:8px;min-width:0;margin:0}
.in input{border:0;outline:0;flex:1;min-width:0;background:none;font-size:16px;font-variant-numeric:tabular-nums;padding:0}
.in .u{color:var(--muted);font-size:14px;white-space:nowrap}
.in .pre{color:var(--muted);font-size:16px}
.in.ta{height:auto;padding:12px 14px;align-items:flex-start}
.in.ta textarea{border:0;outline:0;flex:1;resize:none;font-size:16px;line-height:1.5;background:none;min-width:0;padding:0}
.in:focus-within,.in.ws-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* fields that open the homepage pickers (campus, rent) or drive the inline calendar (dates) */
.in.pk{width:100%;text-align:left;cursor:pointer;justify-content:space-between;font-variant-numeric:tabular-nums}
.in.pk:hover,.in.ws:hover{border-color:#b8b8bd}
.in.pk[aria-expanded=true],.in.pk.act{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.in.pk .pkph{color:var(--muted)}
.cal{margin-top:16px}
.in svg.ch{width:16px;height:16px;flex:none;color:var(--muted)}
.in.ws{cursor:pointer}
.in.ws .ws-in{font-size:16px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--ctl);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;width:100%}
.opt:hover{border-color:#b8b8bd}
.opt b{display:block;font-size:15px;font-weight:600}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.opt.on,.opt.on:hover{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt .tk{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.opt.on .tk{background:var(--ink);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;cursor:pointer;-webkit-user-select:none;user-select:none}
.chip:hover{border-color:#b8b8bd}
.chip.on,.chip.on:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:var(--ctl);padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.tog b{font-size:15px;font-weight:600}
.tog span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.tog .lk{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap}
.sw{width:44px;height:26px;border-radius:99px;background:var(--ink);position:relative;flex:none;border:0;padding:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.off{background:#cfcfd4}.sw.off::after{right:auto;left:3px}
.note{margin:12px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.sub{margin:0;font-size:13px;color:var(--muted);margin-bottom:8px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ph{aspect-ratio:4/3;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--muted);text-align:center;border:1px dashed #cfcfd4;position:relative;overflow:hidden;cursor:pointer;margin:0;padding:6px}
.ph:hover{border-color:#9a9aa0}
.ph.has{border:0;cursor:default}
.ph.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has img.flip{transform:scaleX(-1)}
.ph.has em{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:12px;font-weight:650;background:rgba(255,255,255,.92);border-radius:99px;padding:3px 8px;color:var(--ink)}
.ph .x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.ph b{font-size:14px;color:var(--ink)}
/* step 12: lease proof files, private to the host and the Rentlet team */
.pf{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff}
.pf-h{margin:0 0 10px;font-size:15px;font-weight:650;color:var(--ink)}
.pf-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0;border-top:1px solid var(--line)}
.pf-row:first-of-type{border-top:0}
.pf-ic{flex:none;width:36px;height:36px;border-radius:8px;background:#f2f2f4;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2)}
.pf-n{flex:1;min-width:0;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-s{flex:none;font-size:13px;color:var(--muted)}
.pf-row .x{flex:none;width:44px!important;height:44px;min-width:0;margin:0 -8px 0 0;padding:0;border:0;border-radius:50%;background:none;font-size:20px;color:var(--ink);cursor:pointer}
.pf-row .x:hover{background:#f2f2f4}
.pf-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:88px;margin-top:10px;border:1px dashed #c8c8cc;border-radius:12px;cursor:pointer;text-align:center;font-size:13px;color:var(--muted)}
.pf-add:hover{border-color:var(--ink)}
.pf-add b{font-size:14px;color:var(--ink)}
.pf-note{margin:10px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.btn{height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:650;font-size:15px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.lnk{background:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:0 8px;margin:0 -8px;height:44px}
.btn.lnk:disabled{opacity:.35;cursor:default}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}

.a-top{height:3px;background:var(--hair);position:relative;flex:none}
.a-top i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);transition:width .4s cubic-bezier(.22,1,.36,1)}
.a-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.a-q{width:min(600px,100%);margin:auto;padding:40px 24px} /* margin:auto centres a short step; a long one scrolls */
.a-step{font-size:13px;color:var(--muted);margin:0 0 8px}
.a-foot{flex:none;background:#fff;border-top:1px solid var(--hair)}
.a-foot .wrap{height:76px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.a-steps{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.a-steps button{width:32px;height:32px;border-radius:50%;border:1px solid var(--hair);background:#fff;font-size:12px;color:var(--muted);padding:0}
.a-steps button.on{border-color:var(--ink);color:var(--ink);font-weight:650}
.a-steps button.done{background:var(--soft);border-color:var(--soft);color:var(--ink2)}
.review{display:grid;margin-top:8px}
.rrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;padding:12px 0;border-top:1px solid var(--hair);font-size:14px;align-items:start}
.rrow:first-child{border-top:0}
.rrow dt{color:var(--muted)}
.rrow dd{margin:0;font-weight:600;line-height:1.4}
.rrow .edit{font-size:13px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0}
.rcard{border:1px solid var(--hair);border-radius:18px;background:#fff;overflow:hidden}
.rcard img{width:100%;aspect-ratio:16/9;object-fit:cover}
.rcard .rc{padding:14px 16px}
.rcard h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:0}
.rcard p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.rcard .pr{margin-top:8px;font-family:var(--serif);font-size:26px;font-weight:500}
.rcard .pr small{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;color:var(--muted)}
.done{text-align:center}
.done .ok{width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:22px}
.done .acts{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.done .acts .btn{flex:none;white-space:nowrap}

@container (max-width:700px){
  .hd .wrap{height:56px}.hd .r .save{display:none}
  .wrap{padding:0 16px}
  h2.q{font-size:26px}
  .a-q{padding:24px 16px 28px}
  .opts.two,.row2{grid-template-columns:minmax(0,1fr)}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .a-foot .wrap{height:auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .a-steps{display:none}
  .rrow{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
  .rrow dt{grid-column:1/-1}
}
</style>
<link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style id="rentlet-base">
/* Rentlet: the review chrome around the approved designs is hidden; the page itself is unchanged. */
.rv,.review-foot,.rv-note,.rv-toggle{display:none!important}
html,body{background:#f7f7f7}
:root{--brand:#4E2A84;--brand-dark:#3b1f64;--brand-soft:#efeaf6}
a:has(>img[src$="rentlet-logo.png"]){display:inline-flex;align-items:center;min-height:44px}
</style>
<script src="/rentlet-boot.js?v=e10eccc0"></script>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="where-search.js?v=50645075"></script>
<script src="when-picker.js?v=7860cfd6"></script>
<script src="budget-picker.js?v=552d4e21"></script>
<script>
const $=s=>document.querySelector(s);
/* everything the form knows, so a click anywhere can redraw the screen without losing anything */
const S={step:0,done:false,f:{},
  subletType:'sublet',transferChannel:'official',dep:'amount',refund:true,map:true,hasRoommates:'yes',gender:'Mixed',shuttle:'covered',route:'Intercampus Shuttle',layout:'3B2B',
  start:'2026-12-20',end:'2027-03-15',act:'in',rent:1480,orig:1600,unit:'room',bath:'shared',furn:'full',neg:'little',view:'Courtyard',terms:null,proof:'student',
  campus:'Northwestern · Evanston',campusId:'nu-evn',video:null,
  multi:{fees:['Wi-Fi','Heat'],amen:['Elevator','Package room'],habits:['Quiet weeknights','Non-smoking'],items:['Bed frame','Mattress','Bedding','Desk','Chair','Lamp']},
  prefs:{Cleaning:'Weekly clean-up',Cooking:'Cooking often is fine',Smoking:'No smoking',Pets:'No pets',Visitors:'OK with notice'},
  photos:{bedroom:[],living:[],bath:[],kitchen:[],building:[]}};
/* the campus the visitor searched on the homepage, and a draft they saved and left */
try{const p=JSON.parse(sessionStorage.getItem('cs-plan')||'{}'),row=p.school&&WhereSearch.SCHOOLS.find(x=>x[0]===p.school);if(row){S.campusId=row[0];S.campus=row[1]}}catch(_){}
try{const d=JSON.parse(sessionStorage.getItem('cs-post-draft')||'null');if(d)Object.assign(S,d,{done:false,map:true})}catch(_){} /* every listing shows on the map */
const money=v=>'$'+v.toLocaleString('en-US');
const val=(k,d)=>k in S.f?S.f[k]:d;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
/* what rooms near this campus ask, for the rent picker's histogram (the real site uses the live listings) */
const PRICES=[950,1050,1100,1150,1180,1200,1200,1250,1280,1300,1300,1320,1350,1380,1400,1400,1420,1450,1450,1480,1500,1500,1520,1550,1580,1600,1600,1650,1700,1700,1750,1800,1850,1900,1950,2000,2100,2200,2400,2800];
const CHEV=`<svg class="ch" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>`;

/* ---------- publish to Rentlet (src/listings.ts) ---------- */
let VIDEO=null,BUSY=false,PROOF=[]; /* PROOF: lease-proof files (photos or PDFs), uploaded privately when the listing is published */
/* signing in on the last step must not reload the page and lose the form */
window.RL_onAuth=()=>render();
async function publish(btn){
  if(BUSY)return;
  if(!RL.authed&&!(await RL.signIn()))return;
  if(!window.RentletListings){Rentlet.toast('Still loading. Try again in a moment.');return}
  /* the step dots and a restored draft can skip step 12's check, so publishing checks again */
  if(S.proof==='lease'&&!PROOF.length){Rentlet.toast('Add a photo of the lease or the landlord’s email, or choose Student verification.');S.step=STEPS.findIndex(x=>x.q==='Prove it’s yours');render();window.scrollTo(0,0);return}
  BUSY=true;const label=btn.textContent;btn.disabled=true;btn.textContent='Uploading photos…';
  try{
    S.code=await RentletListings.publishListing(S,VIDEO,PROOF,s=>{const b=document.querySelector('[data-next]');if(b)b.textContent=s==='photos'?'Uploading photos…':'Publishing…'});
    S.done=true;try{sessionStorage.removeItem('cs-post-draft')}catch(_){}
    render();window.scrollTo(0,0);
  }catch(e){
    const r=e&&e.reason;
    Rentlet.toast(r==='limit'?'You already have 3 listings live. Mark one as taken first.':r==='photos'?'Add at least one photo of the place before publishing.':r==='signin'?'Sign in with your Northwestern account to publish.':'Couldn’t publish. Check your connection and try again.');
    if(r==='photos'){S.step=STEPS.findIndex(x=>x.q==='Photos');render();window.scrollTo(0,0)}
  }finally{
    BUSY=false;const b=document.querySelector('[data-next]');if(b&&!S.done){b.disabled=false;b.textContent=label}
  }
}
const header=(right='')=>`<header class="hd"><div class="wrap"><a href="index.html" aria-label="Rentlet home"><img src="img/rentlet-logo.png" alt="Rentlet"></a><div class="r">${right}${RL.msgs?RL.msgs():''}${RL.menu?RL.menu():''}</div></div></header>`;
const opt=(on,b,s,attrs='')=>`<button type="button" class="opt ${on?'on':''}" ${attrs}><div><b>${b}</b>${s?`<span>${s}</span>`:''}</div><span class="tk">${on?'✓':''}</span></button>`;
const chip=(t,on,attrs='')=>`<span class="chip ${on?'on':''}" ${attrs}>${t}</span>`;
const one=(key,list)=>list.map(([v,t])=>chip(t,S[key]===v,`data-one="${key}:${v}"`)).join('');            /* single choice */
const multi=(g,list)=>list.map(t=>chip(t,S.multi[g].includes(t),`data-multi="${g}:${t}"`)).join('');       /* any number */
const grp=(label,inner,small='')=>`<div class="grp"><span class="lbl">${label}${small?`<small>${small}</small>`:''}</span>${inner}</div>`;
const inp=(k,d,u='',pre='',ph='')=>`<label class="in">${pre?`<span class="pre">${pre}</span>`:''}<input value="${esc(val(k,''))}" placeholder="${esc(ph||d)}" data-f="${k}">${u?`<span class="u">${u}</span>`:''}</label>`;
const ta=(k,d,ph='')=>`<label class="in ta"><textarea rows="2" placeholder="${esc(ph||d)}" data-f="${k}">${esc(val(k,''))}</textarea></label>`;
const pk=(kind,text,u='')=>`<button type="button" class="in pk" data-pk="${kind}" aria-haspopup="dialog" aria-expanded="false"><span>${text}${u?` <span class="u">${u}</span>`:''}</span>${CHEV}</button>`;
const sw=k=>`<button type="button" class="sw ${S[k]?'':'off'}" data-sw="${k}" role="switch" aria-checked="${S[k]}"></button>`;
/* the two date fields always show the year, and pick which side the inline calendar sets next */
const fullDay=s=>{const d=WhenPicker.day(s);return d.includes(',')?d:`${d}, ${s.slice(0,4)}`};
const side=(k,s)=>`<button type="button" class="in pk ${S.act===k?'act':''}" data-side="${k}"><span data-side-t="${k}">${s?fullDay(s):'<span class="pkph">Pick a day</span>'}</span></button>`;
let calApi=null;
function syncDates(s,e){document.querySelectorAll('[data-side-t=in]').forEach(x=>x.innerHTML=s?fullDay(s):'<span class="pkph">Pick a day</span>');document.querySelectorAll('[data-side-t=out]').forEach(x=>x.innerHTML=e?fullDay(e):'<span class="pkph">Pick a day</span>');
  document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('act',b.dataset.side===S.act));document.querySelectorAll('[data-dates]').forEach(c=>c.classList.toggle('on',c.dataset.dates===`${S.start}:${S.end}`))}

/* the mini program's option lists (utils/room-types.js, validators.js, listing-features.js), in English */
const LAYOUTS=['Studio','1B1B','2B1B','2B2B','3B2B','Other'];
const GENDER=['All men','All women','Mixed','Not sure yet','Prefer not to say'];
const AMEN=['Washer & dryer','Elevator','Gym','Store downstairs','Package room','Parking'];
const FEES=['Wi-Fi','Water','Heat','Electricity','Gas','Nothing extra'];
const FURN=[['Bedroom',['Bed frame','Mattress','Bedding','Wardrobe']],['Study',['Desk','Chair','Lamp','Monitor']],['Living',['Sofa','TV','Speaker','Floor lamp']],['Kitchen',['Dining table','Pots','Tableware','Cookware','Microwave','Rice cooker']],['Life',['Vacuum','Drying rack','Air purifier','Fan']]];
const PREFS=[['Cleaning',['Weekly clean-up','Clean after use','Basically tidy']],['Cooking',['Cooking often is fine','Less smoke, please']],['Smoking',['No smoking','Outside only']],['Pets',['No pets','Pets OK','Let’s talk']],['Visitors',['No overnight guests','OK with notice']]];
const AREAS=[['bedroom','Bedroom',2],['living','Living room',1],['bath','Bathroom',1],['kitchen','Kitchen',1],['building','Window or building',1]];
const ROUTES=['Intercampus Shuttle','Evanston Loop','Ryan Field'];
const PRESETS=[['Winter quarter','2027-01-03','2027-03-20'],['Winter + spring','2027-01-03','2027-06-12'],['Until my lease ends','2026-12-20','2027-08-31']];

/* step 12: the files that prove the lease (up to 3 photos or PDFs, 10 MB each) */
const kb=n=>n>=1048576?`${(n/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(n/1024))} KB`;
const proofHtml=()=>`<div class="pf"><p class="pf-h">Lease page or landlord’s email</p>${PROOF.map((f,i)=>`<div class="pf-row"><span class="pf-ic" aria-hidden="true">${f.type==='application/pdf'?'PDF':'IMG'}</span><span class="pf-n">${esc(f.name)}</span><span class="pf-s">${kb(f.size)}</span><button type="button" class="x" data-rmproof="${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`).join('')}${PROOF.length<3?`<label class="pf-add"><input type="file" accept="image/*,application/pdf" data-proof hidden><b>+ Add a photo or PDF</b><span>Up to 3 files, 10 MB each</span></label>`:''}<p class="pf-note">Only you and the Rentlet team can open these files. Renters see that lease proof was sent, not the files.</p></div>`;
const photoCount=()=>Object.values(S.photos).reduce((n,a)=>n+a.length,0);
const areasDone=()=>AREAS.filter(([k,,min])=>S.photos[k].length>=min).length;
const terms=()=>S.terms||(S.subletType==='takeover'?'gift':'use');

const list=a=>{const w=a.map(f=>f==='Wi-Fi'?f:f.toLowerCase());return w.length>1?w.slice(0,-1).join(', ')+' and '+w[w.length-1]:w[0]||''};
const photosHtml=()=>`<div class="photos">${AREAS.map(([k,name])=>S.photos[k].map((src,i)=>{const [u,f]=src.split('|');return `<div class="ph has"><img src="${u}" alt="" class="${f||''}"><em>${name}</em><button type="button" class="x" data-rm="${k}:${i}" aria-label="Remove">×</button></div>`}).join('')+`<label class="ph"><input type="file" accept="image/*" data-area="${k}" hidden><b>+ Add</b>${name}</label>`).join('')}</div>`;
const card=()=>`<div class="rcard"><img src="${(Object.values(S.photos).flat()[0]||'data:image/gif;base64,R0lGODlhAQABAAAAACw=').split('|')[0]}" alt=""><div class="rc"><h3>${unitName()} · ${S.layout==='Other'?val('layoutOther','')||'Other':S.layout}</h3><p>${town()} · ${typeName()} · ${WhenPicker.label(S.start,S.end)}</p><div class="pr">${money(S.rent)} <small>/ mo · ${depLine()}${S.multi.fees.length&&!S.multi.fees.includes('Nothing extra')?` · ${list(S.multi.fees)} included`:''}</small></div></div></div>`;

/* ---------- Where is it?: the Building field lists the apartment directory (src/lib/apartments.ts); the Street
   address field lists full addresses from HERE (src/place.ts, through Rentlet's Cloud Functions). A pick keeps
   S.place = {lat, lng, area, zip, walk, label, campusId}, plus id (a HERE address) or apartmentId (a directory
   building); typing over the address drops it. Without a pick, or without the functions, publishing works the same. ---------- */
const PL_ICON={address:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>',
  building:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9.5l5-2.5V20M9 20V4.5l7 3V20M16 20v-8l4 2v6M3 20h18M12 10.5h1M12 14h1"/></svg>'};
const plNorm=a=>String(a||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
/* PL_HAD: the address typed now has HERE suggestions to pick from; PL_FAILED: the picked address HERE couldn't look up */
let PL_BUSY=false,PL_OPEN=null,PL_HAD=false,PL_FAILED=null;
const plArea=a=>window.RentletPlace?RentletPlace.area(a,S.campusId):''; /* the listing's fallback area */
/* the line under the street address: what the listing will show once a place is picked, else how to get there */
function placeNote(){
  const addr=String(S.f.addr||'').trim(),p=S.place;
  if(PL_BUSY)return 'Finding the area…';
  if(p){const area=p.area||plArea(p.label),walk=p.campusId===S.campusId&&p.walk!=null?`${p.walk} min walk to campus`:'',t=[area&&`Area: ${area}`,walk].filter(Boolean).join(' · ');if(t)return t}
  if(PL_FAILED&&plNorm(PL_FAILED)===plNorm(addr)&&plArea(addr))return `Area: ${plArea(addr)}`;
  if(!RL.authed)return 'Suggestions by HERE once you sign in.';
  if(addr&&PL_HAD)return 'Pick your address from the list to show its area and walking time.';
  return 'Suggestions by HERE.'}
const plShowNote=()=>{const n=$('[data-place-note]');if(n)n.textContent=placeNote()};
addEventListener('rentlet:ready',plShowNote);
const plSet=(k,v)=>{S.f[k]=v;const el=$(`[data-f=${k}]`);if(el)el.value=v};
/* a HERE address: its point, area, ZIP and walk */
async function plLookup(id,label){
  if(!window.RentletPlace)return;PL_BUSY=true;PL_FAILED=null;plShowNote();
  const p=await RentletPlace.lookup({id},S.campusId);PL_BUSY=false;
  if(plNorm(S.f.addr)===plNorm(label)){if(p)S.place=Object.assign(p,{label});else if(!S.place)PL_FAILED=label} /* still the address they picked */
  plShowNote()}
/* a directory building has its own point and area; the walk comes from HERE routing, else the directory's estimate */
async function plWalk(){const p=S.place;if(!p||!window.RentletPlace)return;
  PL_BUSY=true;plShowNote();
  const w=await RentletPlace.walk(p.lat,p.lng,S.campusId);PL_BUSY=false;
  if(S.place===p){p.walk=w!=null?w:RentletPlace.walkEstimate(p.lat,p.lng,S.campusId);p.campusId=S.campusId}
  plShowNote()}
function plBuilding(b){
  plSet('building',b.name);plSet('addr',b.address);
  if(b.website&&!String(S.f.site||'').trim())plSet('site',b.website);
  PL_FAILED=null;S.place={lat:b.lat,lng:b.lng,area:b.area,zip:null,walk:null,label:b.address,apartmentId:b.id,campusId:S.campusId};
  plWalk()}
/* a new campus: a building from another place is cleared, with what picking it filled in; otherwise the walk is measured again */
function placeCampus(){const p=S.place;if(!p||!window.RentletPlace)return;
  if(p.apartmentId&&!RentletPlace.building(p.apartmentId,S.campusId)){const b=RentletPlace.building(p.apartmentId);
    if(b){if(S.f.building===b.name)S.f.building='';if(plNorm(S.f.addr)===plNorm(b.address))S.f.addr='';if(b.website&&S.f.site===b.website)S.f.site=''}
    S.place=null;return}
  if(p.campusId!==S.campusId){if(p.id)plLookup(p.id,p.label);else plWalk()}}
function placeField(el){
  const kind=el.dataset.f==='building'?'building':'address',box=el.closest('.in');
  const pop=document.createElement('div');pop.className='ws-pop';pop.hidden=true;pop.id='pl-'+kind;pop.setAttribute('role','listbox');pop.setAttribute('aria-label',kind==='building'?'Buildings':'Addresses');
  document.body.appendChild(pop);
  el.setAttribute('autocomplete','off');el.setAttribute('role','combobox');el.setAttribute('aria-autocomplete','list');el.setAttribute('aria-expanded','false');el.setAttribute('aria-controls',pop.id);
  let list=[],sel=-1,seq=0,timer=0;
  /* under the field, or above it when the screen has no room below (a phone with its keyboard up) */
  const place=()=>{const r=box.getBoundingClientRect(),vh=window.visualViewport?visualViewport.height:innerHeight,w=Math.min(r.width,innerWidth-24);
    if(r.bottom<0||r.top>vh){close();return}
    pop.style.width=w+'px';pop.style.left=(Math.max(12,Math.min(r.left,innerWidth-w-12))+scrollX)+'px';
    const ls=pop.querySelector('.ws-list');if(ls)ls.style.maxHeight='';
    const hd=$('.hd'),top0=hd?hd.getBoundingClientRect().bottom:0,full=pop.offsetHeight,below=vh-r.bottom-16,above=r.top-top0-16,down=below>=full||below>=above,room=down?below:above;
    if(ls&&full>room)ls.style.maxHeight=Math.max(92,ls.offsetHeight-(full-room))+'px';
    pop.style.top=((down?r.bottom+8:r.top-8-pop.offsetHeight)+scrollY)+'px'};
  /* a building row: name, then street · area; an address row: street line, then city, state and ZIP */
  const lines=x=>kind==='building'?[x.name,`${x.street} · ${x.area}`]:[x.title,x.sub];
  const draw=()=>{pop.innerHTML=(kind==='building'&&!el.value.trim()?'<p class="ws-lab">Popular buildings</p>':'')+`<div class="ws-list">${list.map((x,i)=>{const [t,s]=lines(x);return `<div class="ws-it${i===sel?' on':''}" role="option" id="${pop.id}-${i}" aria-selected="${i===sel}" data-i="${i}"><span class="ws-ic">${PL_ICON[kind]}</span><span class="ws-tx"><b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:''}</span></div>`}).join('')}</div>${kind==='address'?'<p class="ws-hint">Suggestions by HERE</p>':''}`;
    if(sel>=0)el.setAttribute('aria-activedescendant',`${pop.id}-${sel}`);else el.removeAttribute('aria-activedescendant')};
  function open(){if(!list.length){close();return}sel=-1;draw();pop.hidden=false;place();el.setAttribute('aria-expanded','true');PL_OPEN=place;requestAnimationFrame(()=>pop.classList.add('on'))}
  function close(){pop.classList.remove('on');pop.hidden=true;el.setAttribute('aria-expanded','false');el.removeAttribute('aria-activedescendant');if(PL_OPEN===place)PL_OPEN=null}
  function pick(x){close();if(!x)return;seq++;
    if(kind==='building'){plBuilding(x);return}
    plSet('addr',x.label);S.place=null;plLookup(x.id,x.label)}
  /* the directory answers at once, from the first focus (popular buildings) to every letter typed */
  const directory=()=>{if(!window.RentletPlace)return;list=RentletPlace.buildings(el.value,S.campusId);open()};
  if(kind==='building')el.addEventListener('focus',directory);
  el.addEventListener('input',()=>{
    if(kind==='building'){S.f.building=el.value;const p=S.place,b=p&&p.apartmentId&&window.RentletPlace?RentletPlace.building(p.apartmentId):null;
      if(p&&p.apartmentId&&(!b||el.value!==b.name))delete p.apartmentId; /* their own name now; the address still decides the place */
      directory();return}
    if(S.place&&plNorm(el.value)!==plNorm(S.place.label))S.place=null;PL_FAILED=null;if(el.value.trim().length<3)PL_HAD=false;S.f.addr=el.value;plShowNote();
    clearTimeout(timer);const q=el.value.trim(),my=++seq;
    if(q.length<3||!window.RentletPlace){list=[];close();return}
    timer=setTimeout(async()=>{const r=await RentletPlace.suggest(q,S.campusId);if(my!==seq)return;
      PL_HAD=r.length>0;plShowNote();
      if(document.activeElement!==el)return;list=r;open()},250)});
  el.addEventListener('keydown',e=>{
    if(e.key==='Escape'){clearTimeout(timer);seq++;if(!pop.hidden){e.preventDefault();close()}return} /* and a list still on its way stays shut */
    if(pop.hidden||!list.length)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=sel<0?(e.key==='ArrowDown'?0:list.length-1):(sel+(e.key==='ArrowDown'?1:-1)+list.length)%list.length;draw()}
    else if(e.key==='Enter'&&sel>=0){e.preventDefault();pick(list[sel])}});
  el.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement!==el)close()},150));
  pop.addEventListener('pointerdown',e=>e.preventDefault()); /* keep the field focused while picking */
  pop.addEventListener('click',e=>{const it=e.target.closest('.ws-it');if(it)pick(list[+it.dataset.i])});
  pop.addEventListener('mousemove',e=>{const it=e.target.closest('.ws-it');if(it&&+it.dataset.i!==sel){sel=+it.dataset.i;draw()}})}
/* the list rides with its field while the step scrolls */
addEventListener('scroll',()=>{if(PL_OPEN)PL_OPEN()},true);addEventListener('resize',()=>{if(PL_OPEN)PL_OPEN()});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(PL_OPEN)PL_OPEN()});

const page=()=>{const n=STEPS.length,i=Math.min(S.step,n-1),s=STEPS[i];
  if(S.done)return `${header()}<div class="a-top"><i style="width:100%"></i></div><div class="a-scroll"><div class="a-q done"><div class="ok">✓</div><h2 class="q">Your listing is live</h2><p class="hint">Listing #${S.code}. Northwestern students can find it now, and you can mark it as taken from your page.</p><div class="grp" style="text-align:left">${card()}</div><div class="acts"><a class="btn sec" href="room.html?room=${S.code}">See your listing</a><a class="btn" href="index.html">Back to home</a></div></div></div>`;
  return `${header('<button type="button" class="save" data-save>Save and exit</button>')}<div class="a-top"><i style="width:${(i+1)/n*100}%"></i></div><div class="a-scroll" id="ascroll"><div class="a-q"><p class="a-step">Step ${i+1} of ${n}</p><h2 class="q">${s.q}</h2><p class="hint">${s.h}</p>${s.body()}</div></div>
  <div class="a-foot"><div class="wrap"><button class="btn lnk" data-back ${i===0?'disabled':''}>Back</button><div class="a-steps">${STEPS.map((x,k)=>`<button data-go="${k}" class="${k===i?'on':k<i?'done':''}" title="${x.q}">${k+1}</button>`).join('')}</div><button class="btn" data-next>${i===n-1?'Publish':'Next'}</button></div></div>`};

function render(){
  if(window.BudgetPicker)BudgetPicker.close();
  const st=$('#stage');st.innerHTML=page();
  /* the dates step carries the homepage calendar itself; a pick updates the two fields and the chips in place */
  calApi=null;st.querySelectorAll('[data-cal]').forEach(m=>{calApi=WhenPicker.mount({mount:m,start:S.start,end:S.end,act:S.act,onChange:(s,e,act)=>{S.act=act;if(s&&e&&e>s){S.start=s;S.end=e}syncDates(s,e)}})});
  /* the campus field is the homepage's city → campus list */
  document.querySelectorAll('.ws-pop').forEach(p=>p.remove());
  st.querySelectorAll('[data-wform]').forEach(f=>{f.addEventListener('submit',e=>e.preventDefault());
    WhereSearch.attach({form:f,seg:f.querySelector('[data-wseg]'),valueEl:f.querySelector('[data-wval]'),current:S.campus,onCampus:(v,name)=>{S.campusId=v;S.campus=name;placeCampus();render()}})});
  /* the building field lists the apartment directory, the street address field HERE addresses */
  PL_OPEN=null;st.querySelectorAll('[data-f=building],[data-f=addr]').forEach(placeField)}
const draft=()=>{try{const {photos,...rest}=S;sessionStorage.setItem('cs-post-draft',JSON.stringify(rest))}catch(_){}}; /* photos are files; they are not kept in the draft */

document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('[data-next]')){if(STEPS[S.step].q==='Prove it’s yours'&&S.proof==='lease'&&!PROOF.length){Rentlet.toast('Add a photo of the lease or the landlord’s email, or choose Student verification.');return}
    if(S.step>=STEPS.length-1){publish(t.closest('[data-next]'));return}S.step++;render();window.scrollTo(0,0);return}
  const rp=t.closest('[data-rmproof]');if(rp){PROOF.splice(+rp.dataset.rmproof,1);render();return}
  if(t.closest('[data-back]')){S.step=Math.max(0,S.step-1);render();return}
  if(t.closest('[data-edit]')){S.done=false;S.step=STEPS.length-1;render();return}
  if(t.closest('[data-save]')){draft();location.href='index.html';return}
  const g=t.closest('[data-go]');if(g){S.step=+g.dataset.go;render();return}
  const set=t.closest('[data-set]');if(set){const [k,v]=set.dataset.set.split(':');S[k]=v;render();return}
  const o1=t.closest('[data-one]');if(o1){const [k,v]=o1.dataset.one.split(':');S[k]=v;render();return}
  const pr=t.closest('[data-pref]');if(pr){const [k,v]=pr.dataset.pref.split(':');S.prefs[k]=S.prefs[k]===v?'':v;render();return}
  const m=t.closest('[data-multi]');if(m){const [g,v]=m.dataset.multi.split(':'),a=S.multi[g],i=a.indexOf(v);
    if(i>=0)a.splice(i,1);else{if(g==='fees'){if(v==='Nothing extra')a.length=0;else{const j=a.indexOf('Nothing extra');if(j>=0)a.splice(j,1)}}a.push(v)}render();return}
  const dd=t.closest('[data-dates]');if(dd){[S.start,S.end]=dd.dataset.dates.split(':');S.act='in';if(calApi)calApi.set(S.start,S.end);syncDates(S.start,S.end);return}
  const sd=t.closest('[data-side]');if(sd){S.act=sd.dataset.side;if(calApi)calApi.setAct(S.act);syncDates(S.start,S.end);return}
  const rm=t.closest('[data-rm]');if(rm){const [k,i]=rm.dataset.rm.split(':');S.photos[k].splice(+i,1);render();return}
  if(t.closest('[data-video-rm]')){VIDEO=null;S.video=null;render();return}
  const w=t.closest('[data-sw]')||(t.closest('.tog')&&t.closest('.tog').querySelector('[data-sw]'));if(w&&!t.closest('.lk,label,input')){S[w.dataset.sw]=!S[w.dataset.sw];render();return} /* the whole row toggles its switch */
  /* the homepage price picker, in its rent mode, opened from the two rent fields */
  const p=t.closest('[data-pk]');if(p){const k=p.dataset.pk;
    return BudgetPicker.open({anchor:p,mode:'rent',value:S[k],prices:PRICES,title:k==='orig'?'What you pay now':'Your rent a month',note:k==='orig'?'Shown struck through next to your rent.':'You can change it any time.',onDone:v=>{S[k]=v;render()}})}});
/* typed text survives every redraw */
document.addEventListener('input',e=>{const k=e.target.dataset.f;if(k)S.f[k]=e.target.value});
/* photos and the video come from real files */
document.addEventListener('change',e=>{const el=e.target,file=el.files&&el.files[0];if(!file)return;
  if(el.dataset.area){const a=el.dataset.area,fr=new FileReader();fr.onload=()=>{S.photos[a].push(fr.result);render()};fr.readAsDataURL(file)}
  else if('video' in el.dataset){VIDEO=file;S.video=file.name;render()}
  else if('proof' in el.dataset){el.value='';
    if(!/^image\/|^application\/pdf$/.test(file.type))return Rentlet.toast('Add a photo or a PDF.');
    if(file.size>=10*1024*1024)return Rentlet.toast('That file is over 10 MB. Try a smaller photo or PDF.');
    if(PROOF.length<3){PROOF.push(file);render()}}});
render();
</script>
