name: Rentlet CI

on: [push]

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci

      # Root `npm test` also collects functions/src/*.test.ts, which need the
      # functions' own dependencies; build them too so CI typechecks them.
      - run: npm ci
        working-directory: functions
      - run: npm run build --if-present
      - run: npm test
      - run: npm run build
        working-directory: functions

  e2e:
    name: E2E tests (Playwright on Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      # The Firestore/Auth/Storage emulators run on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g firebase-tools
      - run: npm run test:e2e
