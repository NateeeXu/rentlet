<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Requests · Rentlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* Requests near a campus: a two-column waterfall feed of the people who need a room, with the matches for your
   own listing on top. */
:root{--canvas:#f7f7f7;--soft:#f2f2f4;--ink:#222;--ink2:#484848;--muted:#717171;--line:#dddddd;--hair:#e8e8e8;--warn:#8a5200;--warn-bg:#fff4e5;--serif:"Newsreader",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.site{container-type:inline-size;background:var(--canvas);min-height:100vh;overflow-x:clip}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* the site header */
.hdr{background:#fff;border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:16px;height:72px;position:relative}
.logo{display:flex;align-items:center;min-height:44px}
.logo img{height:30px;display:block}
/* the right end: Saved and Messages (signed in), then the menu (rentlet-boot.js draws all three) */
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:600;white-space:nowrap;width:auto;flex:0 0 auto;margin:0;background:none;text-decoration:none;color:var(--ink)}
.btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{max-width:100%}.btn .bl{min-width:0;overflow:hidden;text-overflow:ellipsis} /* a long first name never pushes a button out of its row */
.btn-secondary{background:#fff;border-color:var(--line)}
.btn-secondary:hover{border-color:var(--ink)}
.btn-lg{height:48px;padding:0 22px;font-size:15px}
.lnk{font-size:14px;font-weight:650;color:var(--ink);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;display:inline-flex;align-items:center;min-height:44px}

/* title and filters */
.main{padding:28px 0 48px}
h1{font-family:var(--serif);font-size:38px;font-weight:500;letter-spacing:-.6px;line-height:1.1;margin:0}
h1 .cnt{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px;vertical-align:middle}
.fld{height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;font-weight:600;min-width:0;position:relative;margin:0}
.fld:hover{border-color:#b8b8bd}
.fld.ws-on,.fld:focus-within{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fld .ic{color:var(--ink2)}
.fld.ws{cursor:pointer}
.fld [data-wval],.fld .fdl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-camp{width:280px;min-width:160px;flex:0 1 280px}
.f-camp .fld{width:100%}
.f-date{padding:0;flex:none}
/* the date label never shortens; the campus field gives way first */
.f-date .fdl{overflow:visible}
.f-date .fd{height:calc(100% + 2px);margin:-1px 0;border:0;background:none;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:600;font-size:14px;min-width:0;flex:1;border-radius:999px;text-align:left;font-variant-numeric:tabular-nums}
.f-date .fx{width:32px;height:32px;margin-right:6px;border-radius:50%;border:0;background:var(--soft);font-size:16px;line-height:1;flex:none;display:grid;place-items:center;padding:0}
.f-sort{margin-left:auto;cursor:pointer;width:44px;padding:0;justify-content:center;flex:none} /* icon only (Founder, Nov 4); the menu still names each order */
.f-sort .fd{width:100%;justify-content:center}
.f-sort .ic{width:18px;height:18px}
.f-sort .fd{display:flex;align-items:center;gap:8px;height:42px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.sort-pop{position:absolute;top:calc(100% + 8px);right:0;z-index:60;min-width:220px;padding:6px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 28px rgba(0,0,0,.12)}
.sort-pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;white-space:nowrap}
.sort-pop button:hover,.sort-pop button[aria-selected=true]{background:var(--soft,#f2f2f4)}
.sort-pop .sp-gap{display:inline-block;width:16px;flex:none}
.chev{width:14px;height:14px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;margin:0}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 1px;border:1px solid var(--line);border-radius:999px;background:#fff}
.seg button{height:44px;margin:-1px 0!important;padding:0 12px;border:0;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;min-width:0}
.seg button.on{background:var(--ink);color:#fff}
.dbar{position:sticky;top:72px;z-index:10;background:transparent;display:flex;align-items:center;gap:10px;padding:12px 0;margin:8px 0 8px}
/* one bar: Where | When | Layout (Founder, Nov 4), like the homepage search bar */
.rbar{flex:0 1 720px;min-width:0;display:flex;align-items:stretch;height:64px;border-radius:999px}
/* frosted glass, the same material as the homepage search bar: whatever scrolls behind shows through, blurred */
.rbar,.dbar .f-sort{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.14),0 2px 6px rgba(30,25,40,.06)}
.dbar .f-sort{width:48px;height:48px}
.dbar .f-sort:hover{background:rgba(255,255,255,.75)}
.rseg{position:relative;display:flex;align-items:center;min-width:0;margin:0}
.rseg+.rseg::before{content:"";position:absolute;left:0;top:24%;bottom:24%;width:1px;background:rgba(0,0,0,.1)}
.r-where{flex:1.5 1 0}.r-when{flex:1.2 1 0}.r-lay{flex:.9 1 0}
.rsb{display:flex!important;flex-direction:column;justify-content:center;gap:2px;width:100%!important;height:100%;min-width:0;margin:0;padding:0 24px;border:0;border-radius:999px;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative;z-index:1}
.rsb:hover{background:rgba(255,255,255,.55)}
.rsb.ws-on,.rsb[aria-expanded=true]{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.rseg:has(.rsb:hover)::before,.rseg:has(.rsb:hover)+.rseg::before,.rseg:has(.ws-on)::before,.rseg:has(.ws-on)+.rseg::before{opacity:0}
.rbl{font-size:12px;font-weight:700;letter-spacing:.2px;color:var(--ink)}
.rbv{font-size:15px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.r-when .rx{position:absolute;right:10px;z-index:2;width:32px;height:32px;margin:0;border-radius:50%;border:0;background:var(--soft);font-size:16px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.r-when:has(.rx) .rsb{padding-right:48px}
.lay-pop{min-width:200px}
.dd{display:flex;gap:10px;align-items:center;flex:1;min-width:0}
.fpill{display:none;flex:none;cursor:pointer}
.tk{display:inline-grid;place-items:center;width:14px;height:14px;margin-left:6px;color:var(--ink2);vertical-align:-1px}
.tk .ic{width:14px;height:14px;stroke-width:2}
.qtag{font-size:12px;font-weight:650;border:1px solid var(--ink);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* matches for your listing: a white panel with a soft lift */
.mbox{background:#fff;border-radius:18px;padding:22px 24px;margin-top:24px;box-shadow:0 18px 44px rgba(30,25,40,.12),0 2px 6px rgba(30,25,40,.06)}
.mbox h2{margin:0;font-size:20px;font-weight:650}
.mline{margin:6px 0 0;font-size:14px;color:var(--muted);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.mline b{color:var(--ink);font-weight:600}
.mline .lnk{min-height:44px;margin:-13px 0}
.mlist{display:grid;margin-top:12px}
.mr{display:grid;grid-template-columns:44px minmax(0,1fr) 200px;column-gap:16px;align-items:center;padding:16px 0;border-top:1px solid var(--hair)}
.mr>.av{align-self:start}
.mc{min-width:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:16px}
.mr h3{margin:0;font-size:16px;font-weight:650;line-height:1.3}
.need{margin:4px 0 0;font-size:14px;color:var(--ink2);line-height:1.45}
.nw{white-space:nowrap}
.rs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;background:#f2f2f4;font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rc .ic{width:12px;height:12px}
.rc.warn{background:var(--warn-bg);color:var(--warn)}
.mx{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;min-width:0}
.tier{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.tier.strong{background:var(--ink);color:#fff;border-color:var(--ink)}
.tier.good{border-color:var(--ink);color:var(--ink)}
.fh{margin:32px 0 0;font-size:20px;font-weight:650}

/* the waterfall feed: two columns of request cards. Each card leads with the person, then three
   lines with icons (the room, the dates, the budget). Cards float on a soft layered shadow and lift on hover. */
.feed{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:20px;align-items:start;margin-top:8px}
.fcol{display:grid;gap:20px;min-width:0;align-content:start}
.fc{position:relative;display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:20px;padding:20px 22px;margin:0;color:inherit;min-width:0;font:inherit;cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);transition:box-shadow .2s ease,transform .2s ease}
.fc:hover{box-shadow:0 0 0 1px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.07),0 14px 34px rgba(0,0,0,.13);transform:translateY(-2px)}
.fc:has(>.fco:focus-visible){box-shadow:0 0 0 1px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.07),0 14px 34px rgba(0,0,0,.13);transform:translateY(-2px)}
.fc:has(>.fco:active){transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.fc:hover{transform:none}.fc:has(>.fco:focus-visible){transform:none}}
/* the whole card opens the request: a bare button stretched over it. The heart sits above that button,
   so pressing the heart never opens the request. */
.fco{position:absolute;inset:0;z-index:1;width:100%!important;height:100%;min-width:0;margin:0;padding:0;border:0;border-radius:inherit;background:none;cursor:pointer}
.fco:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
/* the heart's whole 44px square is its hit area; the round hover and focus shapes are drawn inside it */
.fsv{position:relative;z-index:2;flex:none;width:44px!important;height:44px;min-width:0;margin:0 -12px 0 0;padding:0;border:0;border-radius:0;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.fsv::before{content:"";position:absolute;inset:2px;border-radius:50%}
.fsv:hover::before{background:var(--soft)}
.fsv:focus-visible{outline:0}
.fsv:focus-visible::before{outline:2px solid var(--ink);outline-offset:0}
.fsv .ic{position:relative;width:20px;height:20px;stroke-width:1.8}
.fsv[aria-pressed=true] .ic{fill:currentColor}
.fc .fhd{display:flex;align-items:center;gap:12px;min-width:0}
.fav{position:relative;width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;overflow:hidden}
.fwho{flex:1;min-width:0}
.fwho b{display:block;font-size:17px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwho .rl{display:block;font-size:14px;color:var(--muted);line-height:1.35;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} /* never runs under the heart or the Live pill */
.fwho .tk{margin-left:4px;color:var(--muted)}
.flive{display:inline-flex;align-items:center;gap:6px;flex:none;height:26px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:650;white-space:nowrap}
.flive i{width:7px;height:7px;border-radius:50%;background:#1a7f37}
.fc .fhr{height:1px;background:var(--hair);margin:16px 0 6px}
.fc .fli{display:flex;align-items:flex-start;gap:12px;padding:6px 0;font-size:15px;line-height:1.4;min-width:0}
.fli .ic{width:20px;height:20px;flex:none;margin-top:0;color:var(--ink2);stroke-width:1.6}
.fli span{min-width:0;overflow-wrap:anywhere}
.fli .num{font-variant-numeric:tabular-nums}
.fli b{font-weight:650}
.fli .g{color:var(--muted)}
.fq{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--muted);display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.fm{font-size:15px;overflow-wrap:anywhere}.fm b{font-weight:650}.fm .rl{color:var(--ink2)}
.fend{text-align:center;color:var(--muted);font-size:14px;margin:28px 0 0}
.empty{text-align:center;padding:40px 16px;border:1px solid var(--hair);border-radius:16px;background:#fff;margin-top:8px}
.empty h3{margin:0 0 16px;font-size:17px}
.empty .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* glass sheets: one request, or the filters on phones */
.gscrim{position:fixed;inset:0;z-index:300;background:rgba(20,18,26,.28);display:grid;place-items:center;padding:16px}
.gs{position:relative;width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;border-radius:24px;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.16),0 2px 6px rgba(30,25,40,.06)}
.gs .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;margin:0;padding:0}
.gq{margin:4px 52px 14px 0;font-family:var(--serif);font-size:22px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.gd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:16px 0 20px;font-size:14px}
.gd dt{color:var(--muted)}.gd dd{margin:0;font-weight:600}
.gs .full{width:100%;height:48px;font-size:15px}
.gs .gh{display:flex;align-items:center;min-height:44px;margin:-8px 52px 8px 0;font-size:17px;font-weight:650}
.gs .lbl{display:block;font-size:14px;font-weight:650;margin:18px 0 8px}
.gs .seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);width:100%}
.gs .full{margin-top:20px}
/* someone else's request: the main action, with Save beside it (any explaining line sits above both) */
.gact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 10px;align-items:center;margin-top:40px}
.gact>.fm{grid-column:1/-1;margin:0}
.gs .gact .full{margin-top:0}
.gsv{height:48px;padding:0 18px;font-size:15px}
.gsv .ic{width:18px;height:18px}
.gsv[aria-pressed=true] .ic{fill:currentColor}
.gsv .s1,.gsv[aria-pressed=true] .s0{display:none}
.gsv[aria-pressed=true] .s1{display:inline}

.nudge{background:#fff;border-top:1px solid var(--hair);padding:28px 0}
.nudge p{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin:0;font-size:16px;color:var(--ink2)}
.nudge b{color:var(--ink);font-weight:650}
.foot{border-top:1px solid var(--hair);padding:32px 0 calc(28px + env(safe-area-inset-bottom))}
.fcols{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:24px}
.fcols h4{margin:0 0 10px;font-size:13px}
.fcols a{display:block;font-size:14px;color:var(--muted);text-decoration:none;padding:3px 0}
.fcols a:hover{color:var(--ink);text-decoration:underline}
.fcols .brand img{height:28px}
.fcols .brand p{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0 0}

@container (max-width:860px){
  .fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.fcols .brand{grid-column:1/-1}
  .dd .seg button{padding:0 9px}
  .dbar .f-camp{width:220px}
}
/* when the layouts no longer fit beside dates and sort, they move into the Filters sheet */
@container (max-width:940px){
  .dd .seg{display:none}.fpill{display:inline-flex}
}
@container (max-width:760px){
  .dbar .f-camp{width:auto;flex:1 1 auto}.dd{display:none}.fpill{display:inline-flex}
}
@container (max-width:640px){
  .fcols a{display:flex;align-items:center;min-height:44px;padding:0}
  .wrap{padding:0 16px}
  .hdr .wrap{height:60px;gap:8px}
  .logo img{height:24px}
  .hide-s{display:none}
  .main{padding:24px 0 36px}
  h1{font-size:28px;letter-spacing:-.4px}
  .dbar{top:60px}
  .feed,.fcol{gap:14px}.fc{padding:18px}
  .mbox{padding:16px 14px}
  .mr{grid-template-columns:40px minmax(0,1fr);column-gap:12px}
  .av{width:40px;height:40px;font-size:15px}
  .mx{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
  .nudge .btn{width:100%;height:44px}
  .gscrim{place-items:end stretch;padding:0}
  .gs{width:100%;max-height:88vh;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
}
@container (max-width:640px){
  .rbar{flex:1 1 auto;height:56px}.rsb{padding:0 14px}.rbl{font-size:11px}.rbv{font-size:14px}
  .r-where{flex:2 1 0}.r-when{flex:1.25 1 0}.r-lay{flex:.85 1 0}.rsb{padding:0 10px}
  .r-when:has(.rx) .rsb{padding-right:40px}.r-when .rx{right:6px}
}
@container (max-width:360px){
  .rsb{padding:0 10px}
  .fld{padding:0 10px;gap:6px}
  .fld .ic.pin{display:none}
}
</style>

/* Rentlet: the review chrome around the approved designs is hidden; the page itself is unchanged. */
.rv,.review-foot,.rv-note,.rv-toggle{display:none!important}
html,body{background:#f7f7f7}
:root{--brand:#4E2A84;--brand-dark:#3b1f64;--brand-soft:#efeaf6}
a:has(>img[src$="rentlet-logo.png"]){display:inline-flex;align-items:center;min-height:44px}

<script>
const $=(s,r=document)=>r.querySelector(s);
const QS=new URLSearchParams(location.search);
const ICONS={
  chat:'<path d="M5 6.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8l-4.5 3v-3H5A1.5 1.5 0 0 1 3.5 16V8A1.5 1.5 0 0 1 5 6.5z"/>',

  sort:'<path d="M7 5v14M4 16l3 3 3-3M17 19V5M14 8l3-3 3 3"/>',
  check:'<path d="M5.5 12.5l4 4 9-9"/>',
  warn:'<path d="M12 4.5 21 19.5H3z"/><path d="M12 10v4M12 16.8v.2"/>',

  heart:'<path d="M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6z"/>'
};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const T=s=>Date.parse(s+'T00:00:00Z');
const iso=t=>new Date(t).toISOString().slice(0,10);
const add=(s,d)=>iso(T(s)+d*864e5);
const nights=(a,b)=>Math.round((T(b)-T(a))/864e5);
const now=new Date(),TODAY=iso(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const md=s=>`${MO[+s.slice(5,7)-1]} ${+s.slice(8)}`;
const wl=(s,e)=>WhenPicker.label(s,e);
const SCH=WhereSearch.SCHOOLS;

/* open requests from people looking for a place, live from Firestore (src/requests.ts fills it through
   RL_onRequests): first name, Google photo and the answers the request form collects. null until it loads. */
let REQ=null,REQ_ERR=false;
/* once you're signed in: your own open request and your active listings (src/requests.ts, RL_onMine) */
let ME=null;
const myUid=()=>RL.authed&&RL.user?RL.user.uid:null;
const others=()=>(REQ||[]).filter(q=>q.uid!==myUid());
const LS=()=>ME&&ME.listings||[];
const mhref=(code,uid)=>`messages.html?listing=${encodeURIComponent(code)}&with=${encodeURIComponent(uid)}`;

/* matching (decided Oct 30): hard filters, then dates 35, money 25, verified 20, commute 10, furnished 10.
   L is one of your listings; a listing without a walking time counts as half for "walkable". */
const FLEXD={exact:0,'3d':3,'1w':7},UTIL=['Heat','Water','Electricity','Gas'];
function score(q,L){
  if(q.campusId!==L.campusId)return null;
  const f=FLEXD[q.flex]||0,fs=add(q.start,-f),fe=add(q.end,f),term=nights(L.start,L.end);
  const os=T(fs)>T(L.start)?fs:L.start,oe=T(fe)<T(L.end)?fe:L.end,ov=Math.max(0,nights(os,oe));
  if(ov<30||ov<term/2)return null;
  if(q.budget!=null&&L.rent>q.budget*1.05)return null;
  if(!(q.kind==='Room or whole place'||(L.unit==='room'?q.kind==='Private room':q.kind==='Whole place')))return null;
  if((q.layouts||[]).length&&!q.layouts.includes(L.layout))return null;
  if(!(T(q.start)>T(TODAY)))return null;
  const s={},R=[],C=[];
  const share=Math.min(1,ov/term);s.dates=share>=1?35:Math.round(35*share*share);
  if(share>=1)R.push(['dates','Covers your whole term']);else if(share>=.75)R.push(['dates','Covers most of your term']);
  const head=T(fs)>T(L.start)?nights(L.start,fs):0,tail=T(fe)<T(L.end)?nights(fe,L.end):0;
  if(Math.max(head,tail)>14)C.push(['dates',head>=tail?`Leaves ${md(L.start)} – ${md(add(fs,-1))} open`:`Leaves ${md(add(fe,1))} – ${md(L.end)} open`]);
  const ratio=q.budget==null?0:L.rent/q.budget;
  s.money=q.budget==null||ratio<=.9?25:ratio<=1?18:8;
  if(q.budget==null)R.push(['money','No budget limit']);else if(ratio<=.9)R.push(['money','Budget fits with room to spare']);else if(ratio<=1)R.push(['money','Within budget']);else C.push(['money',`${money(L.rent-q.budget)} over budget`]);
  const utilIn=L.fees.filter(x=>UTIL.includes(x));
  if(q.util){if(utilIn.length){s.money=Math.min(25,s.money+3);R.push(['util',`${utilIn.join(' and ')} included`])}else C.push(['util','Wants utilities included'])}
  s.ver=q.verified?20:0;if(q.verified)R.push(['ver','Verified']);
  if(q.near==='any')s.commute=10;
  else if(q.near==='walk'){if(L.walk==null)s.commute=5;else{s.commute=L.walk<=15?10:L.walk<=25?5:0;if(L.walk<=15)R.push(['commute',`${L.walk} min walk, as wanted`]);else if(L.walk>25)C.push(['commute','Wants to walk to campus'])}}
  else{s.commute=L.shuttle==='covered'?10:L.shuttle==='unknown'?5:0;if(L.shuttle==='covered')R.push(['commute','On the shuttle line, as wanted']);else if(L.shuttle==='not_covered')C.push(['commute','Wants the shuttle line'])}
  if(q.furn==='any')s.furn=10;
  else if(q.furn==='full'){s.furn=L.furn==='full'?10:L.furn==='part'?5:0;if(L.furn==='full')R.push(['furn','Furnished, as wanted']);else C.push(['furn','Wants it fully furnished'])}
  else{s.furn=L.furn==='none'?5:10;if(L.furn!=='none')R.push(['furn','Furnished, as wanted']);else C.push(['furn','Wants some furniture'])}
  const total=Math.min(100,s.dates+s.money+s.ver+s.commute+s.furn);
  const TIERS=['Strong','Good','Possible',null];let ti=total>=85?0:total>=65?1:total>=45?2:3;
  if(nights(q.active,TODAY)>30){if(ti<3)ti++;C.push(['stale',`Last active ${Math.round(nights(q.active,TODAY)/7)} weeks ago`])}
  const reasons=['dates','money','ver','furn','commute','util'].flatMap(k=>R.filter(r=>r[0]===k).map(r=>r[1])).slice(0,3);
  const caution=['stale','dates','money','furn','commute','util'].flatMap(k=>C.filter(c=>c[0]===k).map(c=>c[1]))[0]||'';
  return ti<3?{q,L,total,tier:TIERS[ti],reasons,caution}:null}
const TR={Strong:0,Good:1,Possible:2};
const matchesFor=L=>others().map(q=>score(q,L)).filter(Boolean).sort((a,b)=>TR[a.tier]-TR[b.tier]||b.total-a.total||T(b.q.posted)-T(a.q.posted));
/* the count beside Requests in the header menu: people who are a strong or good match for any of your listings */
const badge=()=>new Set(LS().flatMap(L=>matchesFor(L).filter(m=>m.tier!=='Possible').map(m=>m.q.id))).size;
/* which of your listings a message to this person is about: the best match, else one at their campus, else your newest */
function listingFor(q){let best=null;
  for(const L of LS()){const m=score(q,L);if(m&&(!best||TR[m.tier]<TR[best.tier]||(m.tier===best.tier&&m.total>best.total)))best=m}
  if(best)return best.L;
  const here=LS().filter(L=>L.campusId===q.campusId);
  return here.find(L=>L.start<q.end&&q.start<L.end)||here[0]||LS()[0]||null}

/* filters. The campus starts from ?campus=, else your own request's, your listing's, or the homepage's */
const R={campusId:SCH[0][0],start:null,end:null,layout:'any',sort:'soon',sheet:null,auto:true,sortOpen:false,layOpen:false};
let PLAN={};try{PLAN=JSON.parse(sessionStorage.getItem('cs-plan')||'{}')}catch(_){}
const known=x=>x&&SCH.some(s=>s[0]===x);
{const want=QS.get('campus');if(known(want)){R.campusId=want;R.auto=false}else if(known(PLAN.school))R.campusId=PLAN.school}
function autoCampus(){if(!R.auto)return;const my=myHere(true),L=LS()[0];
  const id=[my&&my.campusId,L&&L.campusId,PLAN.school].find(known);if(id)R.campusId=id;
  if(REQ&&(!RL.authed||ME))R.auto=false} /* settled once everything has loaded */
const campus=()=>(SCH.find(s=>s[0]===R.campusId)||SCH[0])[1];
const campusOf=id=>(SCH.find(s=>s[0]===id)||SCH[0])[1];
const LAYOUTS=[['any','Any'],['Studio','Studio'],['1B1B','1B1B'],['2B1B','2B1B'],['2B2B','2B2B'],['3B2B','3B2B']],SORTS=[['soon','Soonest move-in'],['budget','Highest budget']];
const inCampus=()=>others().filter(q=>q.campusId===R.campusId);
function shown(){
  let l=inCampus();
  if(R.start&&R.end)l=l.filter(q=>Math.min(T(q.end),T(R.end))-Math.max(T(q.start),T(R.start))>0);
  /* a request with no layouts picked takes any layout */
  if(R.layout!=='any')l=l.filter(q=>!(q.layouts||[]).length||q.layouts.includes(R.layout));
  const b=q=>q.budget==null?Infinity:q.budget;
  return l.sort(R.sort==='budget'?(x,y)=>b(y)-b(x)||T(x.start)-T(y.start):(x,y)=>T(x.start)-T(y.start)||b(y)-b(x))}
/* your own request, shown first at its campus */
function myHere(any){const u=myUid();const my=u&&REQ?REQ.find(q=>q.uid===u):null;return my&&(any||my.campusId===R.campusId)?my:null}
const chip=(t,on,attrs)=>`<button type="button" class="chip ${on?'on':''}" aria-pressed="${on}" ${attrs}>${t}</button>`;
const seg=()=>`<div class="seg" role="group" aria-label="Layout">${LAYOUTS.map(([v,t])=>`<button type="button" class="${R.layout===v?'on':''}" aria-pressed="${R.layout===v}" data-one="layout:${v}">${t}</button>`).join('')}</div>`;
/* the filter bar (Founder, Nov 4): Where / When / Layout in one bar like the homepage search, then the sort icon */
const layName=()=>R.layout==='any'?'Any':R.layout;
const whenTx=()=>R.start?wl(R.start,R.end):'Any dates';
const rbar=()=>`<div class="rbar" role="group" aria-label="Filter requests"><form class="rseg r-where" data-wform><div class="rsb" data-wseg aria-label="Campus: ${esc(campus())}"><span class="rbl">Where</span><span class="rbv" data-wval>${esc(campus())}</span></div></form><div class="rseg r-when"><button type="button" class="rsb" data-when aria-haspopup="dialog" aria-expanded="false" aria-label="Dates: ${whenTx()}"><span class="rbl">When</span><span class="rbv">${whenTx()}</span></button>${R.start?'<button type="button" class="rx" data-clear aria-label="Clear dates">×</button>':''}</div><div class="rseg r-lay${R.layOpen?' open':''}"><button type="button" class="rsb" data-laybtn aria-haspopup="listbox" aria-expanded="${R.layOpen}" aria-label="Layout: ${layName()}"><span class="rbl">Layout</span><span class="rbv">${layName()}</span></button>${R.layOpen?`<div class="sort-pop lay-pop" role="listbox" aria-label="Layout">${LAYOUTS.map(([v,t])=>`<button type="button" role="option" aria-selected="${R.layout===v}" data-one="layout:${v}">${R.layout===v?ic('check','sm'):'<span class="sp-gap"></span>'}${v==='any'?'Any layout':t}</button>`).join('')}</div>`:''}</div></div>`;
const campusFld=()=>`<form class="f-camp" data-wform><div class="fld ws" data-wseg aria-label="Campus">${ic('pin','sm pin')}<span data-wval>${esc(campus())}</span>${ic('down','chev')}</div></form>`;

/* sort: a button whose options open in a small menu right below it */
const sortFld=()=>`<div class="fld f-sort${R.sortOpen?' open':''}"><button type="button" class="fd" data-sortbtn aria-haspopup="listbox" aria-expanded="${R.sortOpen}" aria-label="Sort: ${SORTS.find(s=>s[0]===R.sort)[1]}" title="Sort: ${SORTS.find(s=>s[0]===R.sort)[1]}">${ic('sort')}</button>`
  +(R.sortOpen?`<div class="sort-pop" role="listbox" aria-label="Sort">${SORTS.map(([v,t])=>`<button type="button" role="option" aria-selected="${R.sort===v}" data-one="sort:${v}">${R.sort===v?ic('check','sm'):'<span class="sp-gap"></span>'}${t}</button>`).join('')}</div>`:'')+`</div>`;

/* pieces */
const tick=v=>v?`<span class="tk" title="Verified" role="img" aria-label="Verified">${ic('check')}</span>`:'';

const mrow=m=>{const q=m.q;return `<article class="mr" data-mid="${esc(q.id)}"><span class="av" aria-hidden="true" style="overflow:hidden">${face(q)}</span><div class="mc"><h3>${esc(q.who)} · ${esc(q.role)}${tick(q.verified)}</h3>
  <p class="need">${esc(q.kind)} · <span class="nw">${wl(q.start,q.end)}</span> · <span class="nw">${budTxt(q.budget)}</span></p>
  <div class="rs">${m.reasons.map(r=>`<span class="rc">${esc(r)}</span>`).join('')}${m.caution?`<span class="rc warn">${ic('warn')}${esc(m.caution)}</span>`:''}</div></div>
  <div class="mx"><span class="tier ${m.tier.toLowerCase()}">${m.tier}</span><a class="btn btn-secondary" href="${mhref(m.L.code,q.uid)}">${ic('chat','sm')}<span class="bl">Message ${esc(q.who)}</span></a></div></article>`};
const fav=q=>`<span class="fav" aria-hidden="true">${face(q)}</span>`;

/* saving a request: the heart (data-rl-save) is handled by rentlet-boot.js and src/rentlet.ts, which sign in
   when needed and repaint aria-pressed; markup reads the saved state when it is drawn. An old cached boot
   script has no saves, so every heart starts empty. */
const isSaved=id=>!!(RL.isSaved&&RL.isSaved('request',id));
const heart=q=>`<button type="button" class="fsv" data-rl-save="request:${esc(q.id)}" aria-pressed="${isSaved(q.id)}" aria-label="Save ${esc(q.who)}’s request">${ic('heart')}</button>`;
const saveBtn=q=>`<button type="button" class="btn btn-secondary gsv" data-rl-save="request:${esc(q.id)}" aria-pressed="${isSaved(q.id)}">${ic('heart')}<span class="s0">Save</span><span class="s1">Saved</span></button>`;
/* a request card: the person (with a heart, or Live on your own), then the room, dates and budget. The
   stretched .fco button opens it and speaks for the card, so the text under it is hidden from screen readers. */
const fcard=(q,isMine)=>`<article class="fc${isMine?' mine':''}"><button type="button" class="fco" data-fc="${isMine?'mine':esc(q.id)}" aria-label="${isMine?'Your request, live. ':''}${esc(q.who)}, ${esc(q.role)}${q.verified?', verified':''}. ${esc(q.kind)}, ${wl(q.start,q.end)}, ${budTxt(q.budget)}"></button>
  <div class="fhd">${fav(q)}<div class="fwho" aria-hidden="true"><b>${esc(q.who)}</b><span class="rl">${esc(q.role)}${q.verified?' · Verified':''}</span></div>${isMine?`<span class="flive" aria-hidden="true"><i></i>${myTag()}</span>`:heart(q)}</div>
  <div aria-hidden="true"><div class="fhr"></div>
  <div class="fli">${ic('home')}<span>${esc(q.kind)}${(q.layouts||[]).length?` · ${q.layouts.join(' / ')}`:''}</span></div>
  <div class="fli">${ic('cal')}<span class="num">${wl(q.start,q.end)}</span></div>
  <div class="fli">${ic('wallet')}<span>${budLine(q.budget)}</span></div>${q.note?`<p class="fq">${esc(q.note)}</p>`:''}</div></article>`;

/* the header: the logo, then Saved and Messages (signed in) and the menu, which holds posting, the pages and
   the account. rentlet-boot.js draws and runs all of it. */

const footer=()=>`<footer class="foot"><div class="wrap"><div class="fcols">

/* the feed: two columns on anything wider than a phone; each card goes to the shortest column, so it reads left to right like a waterfall.
   FEED holds [request, isMine]; cards are drawn here, so a re-layout after a save shows the current hearts. */
let FEED=[],feedW=0;
function layoutFeed(){const f=$('[data-feed]');if(!f)return;const W=$('#site').clientWidth,n=W>=600?2:1;
  f.style.setProperty('--n',n);f.innerHTML=Array.from({length:n},()=>'<div class="fcol"></div>').join('');const cols=[...f.children];
  FEED.forEach(([q,m])=>{const t=document.createElement('template');t.innerHTML=fcard(q,m).trim();cols.reduce((a,b)=>b.offsetHeight<a.offsetHeight?b:a).appendChild(t.content.firstChild)});feedW=W}
/* Message on someone's request: about one of your listings. Sign in first; no listing yet, post one first. */
function msgAction(q){
  if(!myUid())return `<button type="button" class="btn btn-primary full" data-msg>${ic('chat','sm')}<span class="bl">Message ${esc(q.who)}</span></button>`;
  if(!ME)return `<button type="button" class="btn btn-primary full" disabled>Checking your listings…</button>`;
  if(ME.error)return `<p class="fm">Couldn’t check your listings.</p><button type="button" class="btn btn-secondary full" data-reload>Try again</button>`;
  const L=listingFor(q);
  if(!L)return `<p class="fm">You message people about a place you’ve posted. Post yours first.</p><a class="btn btn-primary full" href="post.html">Post a listing</a>`;
  return `<a class="btn btn-primary full" href="${mhref(L.code,q.uid)}">${ic('chat','sm')}<span class="bl">Message ${esc(q.who)}</span></a>`}
/* your own request: edit it, or take it down (asks once more first) */

  :`<a class="btn btn-secondary full" href="request.html?edit=1">Edit</a><div style="text-align:center;margin-top:8px"><button type="button" class="lnk" data-ask-close>Take it down</button></div>`;

    <span class="lbl">Layout</span>${seg()}<span class="lbl">Sort</span><div class="chips">${SORTS.map(([v,t])=>chip(t,R.sort===v,`data-one="sort:${v}"`)).join('')}</div>
    <button type="button" class="btn btn-primary full" data-close>Show ${list.length+(my?1:0)}</button></div></div>`;
  const isMine=R.sheet.id==='mine',q=isMine?my:others().find(x=>x.id===R.sheet.id);if(!q)return '';
  return `<div class="gscrim"><div class="gs" role="dialog" aria-modal="true" aria-label="${esc(q.who)}’s request"><button type="button" class="x" data-close aria-label="Close">×</button>
    ${isMine?`<span class="qtag" style="display:inline-block;margin-bottom:10px">${myTag()}</span>`:''}${q.note?`<p class="gq">${esc(q.note)}</p>`:''}<p class="fm"><b>${esc(q.who)}</b><span class="rl"> · ${esc(q.role)}</span>${tick(q.verified)}</p>
    <dl class="gd"><dt>Room</dt><dd>${esc(q.kind)}</dd><dt>Layouts</dt><dd>${(q.layouts||[]).length?q.layouts.join(', '):'Any'}</dd><dt>Dates</dt><dd>${wl(q.start,q.end)} · ${WhenPicker.nights(q.start,q.end)} nights</dd><dt>Budget</dt><dd>${budTxt(q.budget)}</dd></dl>
    ${isMine?mineActs(q):`<div class="gact">${msgAction(q)}${saveBtn(q)}</div>`}</div></div>`}

function render(){
  if(window.WhenPicker)WhenPicker.close();
  const list=shown(),my=myHere(),n=inCampus().length;
  if(R.sheet&&R.sheet.t==='req'&&!(R.sheet.id==='mine'?my:others().some(x=>x.id===R.sheet.id)))R.sheet=null; /* taken down meanwhile */
  if(!WANT&&!(R.sheet&&R.sheet.t==='req'))dropReq(); /* a request opened from ?req= has closed */
  FEED=[...(my?[[my,1]]:[]),...list.map(q=>[q,0])];
  const top=`<h1>Requests near ${esc(campus())}${n?`<span class="cnt" aria-label="${n} requests">${n}</span>`:''}</h1>`;
  /* matches for each of your listings at this campus */
  const boxes=REQ?LS().filter(L=>L.campusId===R.campusId).map(L=>[L,matchesFor(L)]).filter(([,m])=>m.length):[];
  const matches=boxes.length?`<section class="mbox" aria-label="Matches for your listing"><h2>Matches for your listing</h2>
    ${boxes.map(([L,M])=>`<p class="mline"><b>${esc(L.title)}</b><span>${wl(L.start,L.end)}</span><span>${money(L.rent)} / mo</span><a class="lnk" href="room.html?room=${encodeURIComponent(L.code)}">See listing</a></p>
    <div class="mlist">${M.map(mrow).join('')}</div>`).join('')}</section><h2 class="fh">Everyone near ${esc(campus())}</h2>`:'';
  const bar=`<div class="dbar">${rbar()}${sortFld()}</div>`;
  const elsewhere=SCH.find(s=>s[0]!==R.campusId&&others().some(q=>q.campusId===s[0]));
  let body;
  if(REQ_ERR&&!REQ)body=`<div class="empty"><h3>Couldn’t load requests</h3><div class="acts"><button type="button" class="btn btn-secondary" data-reload>Try again</button></div></div>`;
  else if(!REQ)body=`<div class="empty"><h3>Loading requests…</h3></div>`;
  else if(!n&&!my)body=`<div class="empty"><h3>No requests near ${esc(campus())} yet</h3><div class="acts"><a class="btn btn-primary" href="request.html">Post a request</a>${elsewhere?`<button type="button" class="btn btn-secondary" data-campus="${elsewhere[0]}">See ${esc(elsewhere[1])}</button>`:''}</div></div>`;
  else if(!list.length&&!my)body=`<div class="empty"><h3>No requests match</h3><div class="acts"><button type="button" class="btn btn-secondary" data-reset>Clear filters</button></div></div>`;
  else body=`<div class="feed" data-feed></div><p class="fend">That’s everyone near ${esc(campus())}</p>`;
  const nudge=n?`<section class="nudge"><div class="wrap"><p><span>Leaving a room near ${esc(campus())}? <b>${n} ${n===1?'person':'people'}</b> above need${n===1?'s':''} one.</span><a class="btn btn-secondary btn-lg" href="post.html">Post a listing</a></p></div></section>`:'';
  const oh=$('#site>.hdr'),hf=oh&&oh.contains(document.activeElement)?document.activeElement:null,hd=header();
  $('#site').innerHTML=`${hd}<main class="main"><div class="wrap">${top}${matches}${bar}${body}</div></main>${nudge}${footer()}${sheet(list,my)}`;
  keepHeader(oh,hd,hf);
  document.body.style.overflow=R.sheet?'hidden':'';
  layoutFeed();
  const fc=$('[data-fcal]');if(fc)WhenPicker.mount({mount:fc,start:R.start,end:R.end,act:'in',onChange:(s,e)=>{if(s&&e&&e>s){R.start=s;R.end=e;render()}}});
  document.querySelectorAll('.ws-pop').forEach(p=>p.remove());
  document.querySelectorAll('[data-wform]').forEach(f=>{f.addEventListener('submit',e=>e.preventDefault());
    WhereSearch.attach({form:f,seg:f.querySelector('[data-wseg]'),valueEl:f.querySelector('[data-wval]'),current:campus(),onCampus:v=>{R.campusId=v;R.auto=false;render()}})})}
new ResizeObserver(()=>requestAnimationFrame(()=>{if($('#site').clientWidth!==feedW)layoutFeed()})).observe(document.getElementById('site'));

/* live data (src/requests.ts). A redraw keeps an open sheet open; while the date picker is open, it waits for it to close. */
function refresh(){if(document.querySelector('[data-when][aria-expanded="true"]')){clearTimeout(refresh.t);refresh.t=setTimeout(refresh,400);return}
  autoCampus();const x=$('.gs .x'),had=document.activeElement===x;render();if(had){const nx=$('.gs .x');if(nx)nx.focus()}}
/* requests.html?req=<id> (a saved request on the Saved page) opens that request once requests have loaded,
   at its campus; closing it takes ?req off the address. A request that is gone or closed gets a toast. */
let WANT=QS.get('req')||null;
function dropReq(){const u=new URL(location.href);if(!u.searchParams.has('req'))return;u.searchParams.delete('req');history.replaceState(history.state,'',u.pathname+u.search+u.hash)}
function openWanted(){const q=REQ.find(x=>x.id===WANT);WANT=null;
  if(!q){dropReq();if(window.Rentlet)Rentlet.toast('This request is no longer open.');return false}
  R.campusId=q.campusId;R.auto=false;R.sheet={t:'req',id:q.uid===myUid()?'mine':q.id};return true}
window.RL_onRequests=rows=>{let open=false;if(rows){REQ=rows;REQ_ERR=false;if(WANT)open=openWanted()}else REQ_ERR=true;refresh();
  if(open){const x=$('.gs .x');if(x)x.focus()}};
window.RL_onMine=m=>{ME=m;refresh()};
window.RL_onAuth=()=>{if(!RL.authed)ME=null;refresh()};

document.addEventListener('click',e=>{const t=e.target;
  const fc=t.closest('[data-fc]');if(fc){R.sheet={t:'req',id:fc.dataset.fc};render();$('.gs .x').focus();return}
  if(t.closest('[data-fsheet]')){R.sheet={t:'f'};render();$('.gs .x').focus();return}
  if(t.closest('[data-close]')||t.matches('.gscrim')){R.sheet=null;render();return}
  if(t.closest('[data-msg]')){RL.signIn();return} /* signing in redraws the sheet with the right button */
  if(t.closest('[data-reload]')){location.reload();return}
  if(t.closest('[data-ask-close]')){R.sheet.confirm=true;render();return}
  if(t.closest('[data-keep]')){R.sheet.confirm=false;render();return}
  const cr=t.closest('[data-close-req]');if(cr){cr.disabled=true;cr.textContent='Taking it down…';
    RentletRequests.closeRequest(cr.dataset.closeReq).then(()=>{R.sheet=null;render();Rentlet.toast('Your request is down.');RentletRequests.refreshMine()},()=>{Rentlet.toast('Couldn’t take it down. Check your connection and try again.');render()});return}
  if(t.closest('[data-sortbtn]')){R.sortOpen=!R.sortOpen;R.layOpen=false;render();return}
  if(t.closest('[data-laybtn]')){R.layOpen=!R.layOpen;R.sortOpen=false;render();return}
  const o=t.closest('[data-one]');if(o){const [k,v]=o.dataset.one.split(':');R[k]=v;R.sortOpen=R.layOpen=false;render();return}
  if((R.sortOpen&&!t.closest('.f-sort'))||(R.layOpen&&!t.closest('.r-lay'))){R.sortOpen=R.layOpen=false;render()}
  const w=t.closest('[data-when]');if(w){const L=LS().find(x=>x.campusId===R.campusId);return WhenPicker.open({anchor:w,mode:'leave',start:R.start||(L&&L.start),end:R.end||(L&&L.end),onDone:(s,e2)=>{R.start=s;R.end=e2;render()}})}
  if(t.closest('[data-clear]')){R.start=R.end=null;render();return}
  if(t.closest('[data-reset]')){R.start=R.end=null;R.layout='any';render();return}
  const c=t.closest('[data-campus]');if(c){R.campusId=c.dataset.campus;R.auto=false;render();return}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!(R.sortOpen||R.layOpen))return;const sel=R.sortOpen?'[data-sortbtn]':'[data-laybtn]';R.sortOpen=R.layOpen=false;render();const b=document.querySelector(sel);if(b)b.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&R.sheet){R.sheet=null;render()}});
render();
</script>
