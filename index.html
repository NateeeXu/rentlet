<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rentlet · Sublets near Northwestern</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root{
  --canvas:#f7f7f7;--card:#fff;--soft:#f2f2f4;--ink:#222;--ink2:#484848;--muted:#717171;--faint:#9a9aa0;--serif:"Newsreader",Georgia,"Times New Roman",serif;
  --line:#ddd;--hair:#ebebeb;--brand:#542992;--brand-dark:#3f216c;--brand-soft:#f1ebff;--empty:#f1eefb;
  --ok:#1a7f37;--ok-dot:#34c759;--ok-bg:#e9f7ee;--warn:#b86e00;--warn-bg:#fff4e5;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.06);
  --lift:0 1px 3px rgba(23,20,28,.05),0 8px 20px rgba(66,49,91,.10);
  --deep:0 2px 6px rgba(23,20,28,.08),0 24px 48px rgba(66,49,91,.18);
  --tile:linear-gradient(135deg,#efe9ff,#ffe9f0);
  --price:linear-gradient(90deg,#1d1d1f 0%,#4b3b8f 55%,#7b61ff 100%);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e6e6ea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- review chrome (not part of the design) ---------- */
.rv{position:relative;z-index:50;background:#fff;border-bottom:1px solid var(--hair);box-shadow:0 2px 10px rgba(0,0,0,.04)}
.rv-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.rv-title{font-size:14px;font-weight:700;margin-right:8px}
.rv-tabs,.rv-dev{display:flex;gap:6px;flex-wrap:wrap}
.rv-tabs button,.rv-dev button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.rv-tabs button[aria-selected=true],.rv-dev button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.rv-tabs .rec{font-size:11px;font-weight:600;color:var(--brand);margin-left:4px}
.rv-tabs button[aria-selected=true] .rec{color:#d9ccf5}
.rv-dev{margin-left:auto}
.rv-l{font-size:13px;color:var(--muted);align-self:center;margin-right:2px}
.rv-note{padding:0 16px 12px;font-size:13px;line-height:1.65;color:var(--ink2);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 28px}
.rv-note p{margin:0}
.rv-note b{color:var(--ink)}
.rv-toggle{border:0;background:none;color:var(--brand);font-size:13px;font-weight:600;padding:0 16px 10px}
.rv.closed .rv-note{display:none}
.stage.phone{width:390px;height:844px;margin:28px auto 48px;padding:0;border-radius:34px;overflow:hidden;transform:translateZ(0);box-shadow:0 0 0 10px #1d1d1f,0 30px 70px rgba(0,0,0,.25)}
/* the phone frame is the screen: fixed sheets, toasts and pickers inside it stay inside it */
.stage.phone .site{width:100%;height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0;border-radius:0;box-shadow:none}
.review-foot{max-width:1120px;margin:0 auto;padding:20px 24px 40px;font-size:13px;line-height:1.7;color:var(--ink2)}
.review-foot b{color:var(--ink)}

/* ---------- site ---------- */
.site{container-type:inline-size;background:var(--canvas);position:relative;overflow-x:clip}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.hdr{background:rgba(255,255,255,.96);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:20}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;min-height:44px}
.logo img{height:30px;display:block}
.hdr .wrap{position:relative}
/* jump targets land below the sticky header instead of under it */
#res,#cxAlerts{scroll-margin-top:96px}
/* the compact search bar in the header (A4) */
.mini4{position:absolute;left:50%;top:50%;z-index:2;display:flex;max-width:calc(100% - 480px);align-items:center;height:50px;padding:5px 5px 5px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06),0 8px 22px rgba(0,0,0,.08);transform:translate(-50%,-50%) scale(1.12);opacity:0;pointer-events:none;transition:opacity .22s,transform .32s cubic-bezier(.22,1,.36,1)}
.hdr.compact .mini4{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
/* while the compact search bar is in the header, Requests and Post a listing step back into the menu */
.hdr.compact .rl-top{display:none!important}
.mini4 .m-seg{border:0;background:none;height:38px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;cursor:pointer}
.mini4 .m-seg:hover,.mini4 .m-seg[aria-expanded=true]{background:var(--soft)}
.mini4 .m-where{max-width:220px;min-width:0;flex:0 1 auto} /* "Northwestern · Evanston" fits without an ellipsis */
.mini4 .m-when,.mini4 .m-bud{flex:none}
.mini4>i{width:1px;height:20px;background:var(--hair);flex:none}
.mini4 .m-ai,.mini4 .m-go{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;cursor:pointer;margin-left:4px;transition:transform .18s}
.mini4 .m-ai:active,.mini4 .m-go:active{transform:scale(.94)}
.mini4 .m-ai{margin-left:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.mini4 .m-ai:hover{background:var(--soft)}
.mini4 .m-ai svg{width:15px;height:15px;fill:#222}
.mini4 .m-go{background:#222;color:#fff}
.mini4 .m-go .ic{width:17px;height:17px}
.mini4 .mw-s{display:none}
/* as the bar narrows, Budget steps out first so the campus name stays readable */
@container (max-width:1020px){.mini4 .m-bud,.mini4 .m-i2{display:none}}
/* narrower: the compact bar fills the room between the logo and the right-end group (in the flow, so it can
   never run into Saved, Messages or the menu, signed in or out) */
@container (max-width:900px){
  .mini4{position:relative;left:auto;top:auto;order:1;flex:1 1 0;min-width:0;max-width:none;transform:scale(.98)}
  .hdr.compact .mini4{transform:none}
  .hdr-right{order:2}
  .mini4 .m-where{flex:1 1 auto;max-width:none}
}
/* tablets and phones: one summary button (where, then dates and budget) opens the full search */
@container (max-width:800px){
  .mini4{height:56px;padding-left:4px}
  .mini4 .m-where{height:46px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-align:left}
  .mini4 .mw-t,.mini4 .mw-s{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini4 .mw-s{font-size:13px;font-weight:500;color:var(--muted)}
  .mini4 .m-when,.mini4 .m-bud,.mini4>i{display:none}
  .mini4 .m-ai,.mini4 .m-go{width:44px;height:44px}
}
/* phones: the bar floats under the header */
@container (max-width:640px){
  .mini4{position:absolute;left:12px;right:12px;top:calc(100% + 8px);transform:translateY(-8px) scale(.98)}
  .hdr.compact .mini4{transform:none}
  #res,#cxAlerts{scroll-margin-top:140px}
}
@media (prefers-reduced-motion:reduce){.mini4{transition:opacity .15s}}
.hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-size:14px;font-weight:600;white-space:nowrap;width:auto;flex:0 0 auto;margin:0;background:none;transition:transform .18s,opacity .18s,background .18s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-secondary{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-secondary:hover{border-color:var(--ink)}
.btn-ghost{color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}
.btn-lg{height:48px;padding:0 22px;font-size:15px}
.icon-btn{width:44px;height:44px;padding:0;border-radius:999px;border:0;background:none;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--soft)}
.link{color:var(--brand);font-weight:600;background:none;border:0;padding:0;font-size:inherit}
.link:hover{text-decoration:underline}

/* hero shared */
.hero{position:relative;overflow:hidden}
.hero-in{position:relative;z-index:2}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--hair);border-radius:999px;padding:6px 12px 6px 10px;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--ok-dot);box-shadow:0 0 0 0 rgba(52,199,89,.5);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px rgba(52,199,89,0)}}
.display{font-size:68px;line-height:.94;letter-spacing:-2px;font-weight:800;text-transform:uppercase;margin:18px 0 0}
.display span{display:block;white-space:nowrap}
.display em{font-style:normal;background:var(--price);-webkit-background-clip:text;background-clip:text;color:transparent}
.h1{font-size:44px;line-height:1.08;letter-spacing:-1px;font-weight:800;margin:18px 0 0}
.h1 em{font-style:normal;color:var(--brand)}
.lead{font-size:16.5px;line-height:1.55;color:var(--ink2);margin:16px 0 0;max-width:460px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.seg button{height:36px;padding:0 16px;border-radius:999px;border:0;background:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-selected=true]{background:var(--ink);color:#fff}

/* search pill */
.search{text-align:left;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1.6fr) minmax(0,.85fr) auto;align-items:center;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--lift);padding:6px;position:relative;z-index:3}
.field{padding:6px 18px;border-right:1px solid var(--hair);min-width:0;border-radius:999px}
.field:last-of-type{border-right:0}
.field:focus-within{box-shadow:inset 0 0 0 2px var(--brand)}
.field label{display:block;font-size:12px;font-weight:700}
.field input,.field select{display:block;width:100%;border:0;background:transparent;font-size:14px;color:var(--ink2);padding:2px 0;outline:none;min-width:0;-webkit-appearance:none;appearance:none}
.search .btn{height:52px;padding:0 22px;font-size:15px}
.field .wbtn{display:block;width:100%;border:0;background:none;padding:2px 0;font:inherit;font-size:14px;color:var(--ink2);text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.field.fwhen{cursor:pointer}
.field.fwhen:has(.wbtn[aria-expanded=true]){box-shadow:inset 0 0 0 2px #222}
.search-row{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.search-row small{font-size:13px;color:var(--muted)}

/* ---------- H1: ticket reel ---------- */
.h-reel{padding:56px 0 0;min-height:700px}
.h-reel .hero-in{max-width:600px;min-height:470px;padding-bottom:40px}
.reel{position:absolute;top:0;left:calc(50% + 20px);right:0;height:600px;perspective:1200px;perspective-origin:10% 50%;z-index:1;pointer-events:none;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 140px);mask-image:linear-gradient(90deg,transparent 0,#000 140px)}
.reel-plane{position:absolute;left:0;top:200px;transform-style:preserve-3d;transform-origin:0 50%;transform:rotateX(20deg) rotateY(22deg) rotateZ(-20deg)}
.reel-track{transform-style:preserve-3d;display:flex;gap:26px;width:max-content;animation:drift 70s linear infinite;pointer-events:auto}
.reel:hover .reel-track,.reel.paused .reel-track{animation-play-state:paused}
@keyframes drift{to{transform:translateX(-50%)}}
.tk{width:210px;flex:none;background:#fff;border-radius:18px;box-shadow:var(--deep);overflow:hidden;transition:transform .3s var(--ease)}
.tk:hover{transform:translateZ(40px) translateY(-6px)}
.tk-ph{height:220px;overflow:hidden;background:var(--soft)}
.tk-ph img{width:100%;height:100%;object-fit:cover;display:block}
.tk-stub{position:relative;padding:14px 16px 16px;border-top:1.5px dashed #e2dcec}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;top:-10px;width:20px;height:20px;border-radius:99px;background:var(--canvas)}
.tk-stub::before{left:-10px}.tk-stub::after{right:-10px}
.tk-row{display:flex;align-items:flex-end;justify-content:space-between}
.tk-row small{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--muted)}
.tk-row b{display:block;font-size:22px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.tk-row .in b{color:var(--brand)}
.tk-row .ic{color:var(--muted);margin-bottom:5px}
.tk-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.tk-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tk-meta b{color:var(--ink);font-weight:700}
.sq{display:block;color:inherit;text-decoration:none;cursor:pointer;position:relative;flex:none;width:236px;height:236px;border-radius:32px;overflow:hidden;background:var(--soft);box-shadow:var(--deep);transition:transform .3s var(--ease)}
.sq img{width:100%;height:100%;object-fit:cover;display:block}
.sq img.flip{transform:scaleX(-1)}
.sq-view{position:absolute;right:12px;top:12px;display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .25s var(--ease);white-space:nowrap}
.sq-view .ic{width:14px;height:14px}
.sq:hover .sq-view,.sq:focus-visible .sq-view{opacity:1;transform:none}
.reel:focus-within .reel-track{animation-play-state:paused}
.sq:hover{transform:translateZ(40px) translateY(-6px)}
.sq-chip{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.96);border-radius:999px;padding:7px 13px;font-size:15px;font-weight:800;letter-spacing:-.2px;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.sq-chip .ic{width:14px;height:14px;color:var(--muted)}
.sq-chip .in,.sq-info .in{color:var(--brand)}
.sq-info{display:none}
.sq-info .d,.sq-info small{display:flex}
.reel[data-style=strip] .sq{height:auto;background:#fff;padding:10px}
.reel[data-style=strip] .sq img{height:216px;border-radius:24px}
.reel[data-style=strip] .sq-chip{display:none}
.reel[data-style=strip] .sq-info{display:block;padding:12px 6px 4px}
.sq-info .d{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.sq-info .d .ic{width:16px;height:16px;color:var(--muted)}
.sq-info small{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:4px}
.sq-info small span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sq-info small b{color:var(--ink)}
.reel[data-style=mosaic] .reel-track{align-items:center}
.reel[data-style=mosaic] .sq:nth-child(3n+1){width:268px;height:268px}
.reel[data-style=mosaic] .sq:nth-child(3n+2){width:204px;height:256px;margin-top:-60px}
.reel[data-style=mosaic] .sq:nth-child(3n){width:224px;height:224px;margin-top:50px}
@supports (corner-shape:squircle){
  .sq{border-radius:60px;corner-shape:squircle}
  .reel[data-style=strip] .sq img{border-radius:44px;corner-shape:squircle}
}
.dt{padding:20px 0 56px}
.dt .back{margin-left:-12px}
.dt-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:10px}
.dt-ph{position:relative;border-radius:32px;overflow:hidden;aspect-ratio:1/1;box-shadow:var(--lift);background:var(--soft)}
.dt-ph img{width:100%;height:100%;object-fit:cover;display:block}
.dt-ph img.flip{transform:scaleX(-1)}
.dt-side{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:22px}
.dt-school{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.dt-side h1{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:6px 0 0}
.dt-price{margin:14px 0 0}
.dt-price .price b{font-size:28px}
.dt-k{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:20px 0 0}
.dt .leg-d{white-space:normal;flex-wrap:wrap;overflow:visible}
.dt .leg{font-size:15px;padding:11px 0;grid-template-columns:70px minmax(0,1fr) auto}
.poster{display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)}
.poster b{display:block;font-size:15px}
.poster span{white-space:nowrap;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.poster span .ic{color:var(--ok)}
.poster .acts{margin-left:auto;display:flex;gap:8px}
/* Save on the placeholder room page: the label follows aria-pressed, which src/rentlet.ts keeps current */
.poster [data-rl-save]::after{content:'Save'}
.poster [data-rl-save][aria-pressed=true]::after{content:'Saved'}
.poster [data-rl-save][aria-pressed=true] .ic{fill:var(--ink)}
.dt-note{font-size:13px;color:var(--muted);margin:18px 0 0}
@supports (corner-shape:squircle){.dt-ph{border-radius:64px;corner-shape:squircle}}
::view-transition-group(hero-photo){animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.28s}
.rv-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 16px 10px;font-size:13px;color:var(--muted)}
.rv-sub[hidden]{display:none}
.rv-sub button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.rv-sub button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.reel-ctl{position:absolute;right:24px;top:24px;z-index:4}
.reel-ctl .icon-btn{background:#fff;box-shadow:var(--shadow)}
.h-reel .search-wrap{position:relative;z-index:3;padding:0 0 48px}

/* ---------- results ---------- */
.results{padding:12px 0 48px}
.res-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.res-head h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
.res-head .sub{font-size:13px;color:var(--muted);margin:6px 0 0;font-variant-numeric:tabular-nums}
.example{font-size:12px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.grid.one{grid-template-columns:minmax(0,1fr)}
.more-note{font-size:13px;color:var(--muted);margin:16px 0 0}

.card{background:#fff;border-radius:16px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:box-shadow .25s,transform .25s var(--ease);position:relative}
.card:hover{box-shadow:var(--lift);transform:translateY(-3px)}
.ph{position:relative;aspect-ratio:4/3;background:linear-gradient(100deg,#eeeef1 30%,#fafafb 50%,#eeeef1 70%);background-size:300% 100%;animation:shimmer 1.5s ease-in-out infinite;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .36s,transform .6s var(--ease)}
.ph img.flip{transform:scaleX(-1)}
.ph img.in{opacity:1}
.card:hover .ph img{transform:scale(1.04)}
.card:hover .ph img.flip{transform:scaleX(-1) scale(1.04)}
.ph.done{animation:none;background:var(--soft)}
.ph-tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.walk{position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,.94);border-radius:999px;padding:5px 10px 5px 8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.save{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center}
.save[aria-pressed=true]{color:var(--brand)}
.save[aria-pressed=true] .ic{fill:var(--brand);animation:pop .35s var(--ease)}

/* ---------- A4: search bar on top, one reel across the page ---------- */

   Each card keeps its cover photo's shape and size tier (a4Card sets --w and --h in px); every card
   sits centred on one line (Founder, Nov 4), and --k scales the whole strip down on phones. */

/* ---------- A4 search bar, four materials ---------- */
.h-a4{padding-top:28px}
.h-a4{padding-bottom:12px}
/* first screen: a serif headline and one line of plain words above the search bar (Founder, Oct 30: A) */
.h-head{position:relative;z-index:8;max-width:940px;margin:22px auto 0;padding:0 8px}
.h-head h1{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1.08;letter-spacing:-.8px;margin:0;max-width:720px;color:var(--ink);white-space:nowrap} /* one line everywhere; fitHead() shrinks the size on narrow phones */
.h-head h1 .camp{color:var(--sc,var(--ink))} /* the campus word in its school's official colour, as published (Founder, Oct 30: A1) */
.bar4{position:relative;z-index:8;margin:18px auto 0;max-width:940px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(150px,max-content) minmax(0,1fr) auto;transform-origin:50% 0;align-items:center;border-radius:999px;padding:8px;--mx:30%;--my:20%;isolation:isolate}
.seg4{position:relative;display:flex;flex-direction:column;gap:3px;padding:12px 24px;border-radius:999px;cursor:pointer;min-width:0;transition:background .2s,box-shadow .2s}

/* the Where field is a real text box, not a hidden picker */
.seg4 input.ws-in{position:static;opacity:1;height:auto;cursor:text;font-size:15px;color:var(--vc,var(--ink));margin-top:2px}
.seg4:focus-within .ws-in{color:var(--ink)}
/* the Where field lights up as a whole while its list is open (the text is not selected) */
.seg4.ws-on,.bar4[data-skin=glass] .seg4.ws-on{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.seg4.ws-on::before,.seg4.ws-on+.seg4::before{opacity:0}

.find4{padding:0 22px;background:#222;color:#fff}
.ai4:active,.find4:active{transform:scale(.97)}
.spec{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1}
.h-a4 .reel{z-index:1;position:relative;left:auto;right:auto;top:auto;bottom:auto;width:auto;height:auto;margin:40px calc(50% - 50vw) 0;padding:14px 0 34px;perspective:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 64px,#000 calc(100% - 64px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 64px,#000 calc(100% - 64px),transparent)}
.h-a4 .reel-plane{position:relative;left:0;top:0;transform:none;transform-style:flat}
.h-a4 .reel-track{align-items:center;gap:20px;transform-style:flat;padding-left:32px}
@container (max-width:860px){
  /* phones: smaller cards; the pause button sits under the strip, not on a card */

}
/* 2 · frosted glass: the reel shows through, blurred */
.bar4[data-skin=glass]{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),0 18px 44px rgba(30,25,40,.14),0 2px 6px rgba(30,25,40,.06)}
.bar4[data-skin=glass] .seg4:hover{background:rgba(255,255,255,.55)}
.bar4[data-skin=glass] .find4{color:#17151f;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.56));-webkit-backdrop-filter:blur(16px) saturate(1.8);backdrop-filter:blur(16px) saturate(1.8);border:1px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 8px 18px -8px rgba(20,16,40,.3)}
.bar4[data-skin=glass] .find4:hover{background:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 10px 22px -8px rgba(20,16,40,.42)}
.bar4[data-skin=glass] .find4:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* Apple-style liquid glass: a real lens. The backdrop is refracted by an SVG displacement filter,
   with a bright rim and a highlight that follows the pointer */
.bar4[data-skin=liquid]{background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(3px) saturate(1.8) brightness(1.05);backdrop-filter:url(#lg4) blur(2px) saturate(1.9) brightness(1.05);border:1px solid rgba(255,255,255,.55);box-shadow:inset 1.5px 1.5px 0 -.5px rgba(255,255,255,.95),inset -1.5px -1.5px 0 -.5px rgba(255,255,255,.55),inset 0 0 18px rgba(255,255,255,.35),inset 0 -14px 24px -16px rgba(80,70,120,.35),0 24px 60px rgba(30,25,40,.18),0 2px 8px rgba(30,25,40,.08);--vc:#2f2f36;--sep:rgba(0,0,0,.08)}
.bar4[data-skin=liquid] .spec{background:radial-gradient(220px 90px at var(--mx) var(--my),rgba(255,255,255,.75),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.55),transparent 40%);mix-blend-mode:overlay}
.bar4[data-skin=liquid] .seg4:hover{background:rgba(255,255,255,.22);box-shadow:inset 1px 1px 0 rgba(255,255,255,.8)}
.bar4[data-skin=liquid] .find4{background:rgba(20,20,24,.78);box-shadow:inset 1px 1px 0 rgba(255,255,255,.3),0 8px 20px rgba(0,0,0,.22)}
/* Airbnb-style deboss: white pill at rest; while you edit, the bar sinks to grey and the active field lifts out */
.bar4[data-skin=airbnb]{background:#fff;border:1px solid #ddd;box-shadow:0 3px 12px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.08);transition:background .25s,box-shadow .25s}
.bar4[data-skin=airbnb].engaged{background:#ebebeb;box-shadow:inset 0 2px 4px rgba(0,0,0,.06)}
.bar4[data-skin=airbnb] .seg4:hover{background:#f2f2f2}
.bar4[data-skin=airbnb].engaged .seg4:hover{background:#dddddd}
.bar4[data-skin=airbnb] .seg4.on,.bar4[data-skin=airbnb].engaged .seg4.on:hover{background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.bar4[data-skin=airbnb] .seg4.on::before,.bar4[data-skin=airbnb] .seg4.on+.seg4::before{opacity:0}
.bar4[data-skin=airbnb] .find4{background:#222}
/* AI pick: a white outline pill with a small ink star next to the black Search. While picking, a faint grey
   sheen sweeps across and the star turns; the label never changes. */
.ai4{position:relative;isolation:isolate;overflow:hidden;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink);padding:0 20px 0 16px;gap:9px}
.ai4:hover{background:var(--soft)}
.ai4 .ic,.ai4 .t{position:relative;z-index:2}
.ai4 .ic{width:18px;height:18px;display:grid;place-items:center}
.ai4 .ic svg{width:15px;height:15px;fill:currentColor;stroke:none;display:block}
.ai4 .sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1}
.ai4 .sheen{background:linear-gradient(105deg,transparent 35%,rgba(0,0,0,.07) 50%,transparent 65%);background-size:250% 100%;background-position:130% 0;transition:background-position .9s var(--ease)}
.ai4:hover .sheen{background-position:-30% 0}
.ai4.go .sheen{animation:a4sweep 1s linear infinite}
.ai4.go .ic{animation:spinic .8s var(--ease) infinite}
@keyframes a4sweep{from{background-position:130% 0}to{background-position:-30% 0}}
/* three picks: a lineup in perspective */
.fly4{perspective:1700px;perspective-origin:50% 30%}
.fly4-card{transition:transform .75s cubic-bezier(.16,1,.3,1),filter .5s,box-shadow .5s;cursor:pointer;transform-origin:50% 50%}
.fly4-card.side{filter:brightness(.86) saturate(.85)}
.fly4-card .rk{position:absolute;left:50%;top:3cqw;transform:translateX(-50%);background:rgba(20,16,40,.82);color:#fff;border-radius:999px;padding:.42em .95em;font-size:clamp(11px,1.8cqw,16px);font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:.4em;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.fly4-card.side .rk{opacity:0}
.fly4-dots{position:absolute;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.fly4-dots i{width:8px;height:8px;border-radius:99px;background:#d4d4d8;transition:width .3s,background .3s}
.fly4-dots i.on{width:22px;background:#222}
.fly4-nav{position:absolute;z-index:12;width:46px;height:46px;border-radius:99px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.fly4-nav[disabled]{opacity:.35}
.reel-swap{animation:reelswap .7s cubic-bezier(.22,1,.36,1)}
@keyframes reelswap{0%{opacity:1}35%{opacity:0;transform:translateY(18px)}36%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:none}}
@container (max-width:860px){
  .bar4{grid-template-columns:repeat(2,minmax(0,1fr));border-radius:28px;padding:8px}
  .s-camp,.go4{grid-column:1/-1}
  .seg4{padding:10px 14px;min-height:48px;justify-content:center}
  .cx-chips .cx-chip,.cx-acts .cx-svs{height:40px}
  .seg4+.seg4::before{display:none}
  .h-a4 .reel-ctl{top:auto;bottom:16px}
  .h-head{margin-top:8px;padding:0}
  .h-head h1{font-size:32px;letter-spacing:-.5px}
  /* phones: one field per row, so a date with its year is never cut off */
  .s-when,.s-bud{grid-column:1/-1}
  .go4{padding:6px 0 0}.go4 button{flex:1;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.bar4 .spec{transition:none}}
.c5frame{display:block;width:100%;height:calc(100vh - 8px);border:0;background:#f7f7f7}
.stage.phone .c5frame{height:844px}

/* ---------- below the reel: Airbnb-like sections (option C) ---------- */
.cx-sec{padding:52px 0;background:#fff;border-top:1px solid var(--hair)}
.results.cx{background:#fff;padding:44px 0 52px}
.cx-sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.cx-sh h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.3px;line-height:1.2}
.cx-sh p{margin:6px 0 0;font-size:14px;color:var(--muted);line-height:1.55;max-width:560px}
.cx-acts{display:flex;gap:16px;align-items:center}
.cx-lnk{border:0;background:none;padding:0;font-size:14px;font-weight:650;color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap;cursor:pointer}
.cx-svs{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.cx-svs:hover{border-color:var(--ink)}
.cx-svs .ic{width:15px;height:15px}
.cx-tbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:-4px 0 18px}
.cx-chips{display:flex;gap:8px;flex-wrap:wrap}
.cx-chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.cx-chip:hover{border-color:var(--ink)}
.cx-chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.cx-chip em{font-style:normal;font-weight:600;color:var(--muted);font-size:12px}
.cx-chip[aria-pressed=true] em{color:#bdbdc2}
.cx-seg{position:relative;display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.cx-seg button{position:relative;z-index:1;border:0;background:none;height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:650;color:var(--muted);white-space:nowrap;cursor:pointer;transition:color .2s}
.cx-seg button[aria-selected=true]{color:var(--ink)}
.cx-seg .ind{position:absolute;z-index:0;top:4px;left:0;height:32px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);transition:transform .32s cubic-bezier(.22,1,.36,1),width .32s cubic-bezier(.22,1,.36,1)}
.cx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px}
.cx-swap>*{animation:cxin .42s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes cxin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cx-card{display:block;color:inherit;text-decoration:none;cursor:pointer;outline:none;min-width:0}
.cx-card .cph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--soft)}
.cx-card .cph img{width:100%;height:100%;object-fit:cover;display:block}
.cx-card .cph img.flip{transform:scaleX(-1)}
.cx-card .ctg{position:absolute;left:12px;top:12px;z-index:2;background:#fff;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:600}
.cx-card .csv{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer}
/* the heart looks 34px but takes taps across a 44px square */
.cx-card .csv::after{content:'';position:absolute;inset:-5px}
.cx-card .csv .ic{width:17px;height:17px}
.cx-card .csv[aria-pressed=true] .ic{fill:var(--ink)}
.cx-card .cbd{padding:10px 2px 0}
.cx-card .ct{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:600}

.cx-card .ct b small{font-weight:500;color:var(--muted);font-size:13px}
.cx-card .cm,.cx-card .cf,.cx-card .cf2{font-size:14px;color:var(--muted);margin-top:2px}
.cx-card .cf2{display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-card .cfx{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:13px;font-weight:600;color:var(--ink);opacity:0;transform:translateY(14px);transition:opacity .22s,transform .3s cubic-bezier(.22,1,.36,1);pointer-events:none}
.cx-card .cfx span{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-card .fi{width:16px;height:16px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cx-card .cph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.18));opacity:0;transition:opacity .25s}
.cx-card:hover .cfx,.cx-card:focus-visible .cfx{opacity:1;transform:none}
.cx-card:hover .cph::after,.cx-card:focus-visible .cph::after{opacity:1}
.cx-card:focus-visible .cph{box-shadow:0 0 0 2px var(--ink)}
.cx-rail .cx-card .cfx{grid-template-columns:minmax(0,1fr);gap:6px}
@media (hover:none){.cx-card .cfx,.cx-card .cph::after{display:none}.cx-card .cf2{display:block}}
.cx-rail,.cx-ppl{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;margin:0 -24px;padding:4px 24px 8px;scroll-padding-inline:24px}
.cx-rail::-webkit-scrollbar,.cx-ppl::-webkit-scrollbar{display:none}
.cx-rail .cx-card{flex:1 0 250px;max-width:380px;scroll-snap-align:start}
.cx-rail .cx-card .cph{aspect-ratio:4/3}
.cx-nav{display:flex;gap:8px}
.cx-nb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.cx-nb:hover{border-color:var(--ink)}
.cx-nb .ic{width:16px;height:16px}
.cx-empty{grid-column:1/-1;text-align:center;padding:28px 16px;border:1px solid var(--hair);border-radius:16px}
.cx-empty h3{margin:0;font-size:16px}
.cx-empty p{margin:6px 0 12px;font-size:14px;color:var(--muted)}
/* rooms near the campus: the list beside a map of price pins (src/homemap.ts); narrow screens open the map full screen */
.cx-cnt{margin-left:2px;font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);white-space:nowrap}
.cx-split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:start}

/* the way into the shuttle map (Founder, Nov 4): top-left on the map, beside the close button when full screen */
.cx-shuttle{position:absolute;top:12px;left:12px;z-index:900;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:14px;font-weight:650;color:#222;text-decoration:none;white-space:nowrap}
.cx-shuttle:hover{background:#fff}
.leaflet-container a.cx-shuttle{color:#222} /* Leaflet colours every link in a map blue */
.cx-shuttle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hm-full .cx-shuttle{top:calc(12px + env(safe-area-inset-top,0px));left:calc(64px + env(safe-area-inset-left,0px));height:44px}
.cx-mapbar{display:none}
.cx-showmap{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto!important;min-width:0;flex:0 0 auto;height:48px;margin:0;padding:0 20px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:650;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer;pointer-events:auto;transition:transform .18s}

@container (min-width:901px){.cx-split:not(.nomap) .cx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

}
/* email alerts */
.cx-subs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:48px;align-items:center}
.cx-subs h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.3px}

.cx-crit{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:16px}
.cx-crit span{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.cx-crit .ic{width:14px;height:14px}
.cx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cx-srow{display:flex;gap:8px;padding:6px;border:1px solid #b0b0b5;border-radius:12px;background:#fff;transition:border-color .15s,box-shadow .15s}

.cx-srow button{height:44px;padding:0 18px;flex:none;border:0;border-radius:8px;background:var(--ink);color:#fff;font-size:15px;font-weight:650;cursor:pointer}
.cx-err{margin:8px 2px 0;font-size:13px;color:#c13515}
.cx-freq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.cx-freq button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.cx-freq button[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.cx-fine{margin:12px 2px 0;font-size:12px;color:var(--muted);line-height:1.5}
.cx-fine a{color:var(--muted)}
.cx-done{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;border-radius:14px;border:1px solid var(--line)}

.cx-done b{font-size:15px}
.cx-done p{margin:4px 0 10px;font-size:14px;color:var(--muted);line-height:1.55}
.cx-done p b{font-size:inherit;color:var(--ink);font-weight:600}
/* people looking for a place */
.cx-ppl{gap:28px}
.cx-pc{flex:0 0 230px;scroll-snap-align:start;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;color:inherit}
.cx-pc .pt{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:8px}
.cx-pc .av{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:17px;font-style:normal}
.cx-pc .nm{min-width:0}
.cx-pc .nm b{display:block;font-size:15px;font-weight:600}
.cx-pc:hover .nm b{text-decoration:underline;text-underline-offset:3px}
.cx-pc .nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.35;color:var(--muted);min-height:2.7em} /* two lines kept for every card so the dates line up across the row */
.cx-pc .pt{align-items:flex-start}
.cx-pc .pd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.cx-pc .pf{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-pc .pf b{color:var(--ink);font-weight:600}
.cx-pnav{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.cx-mdl{position:fixed;inset:0;z-index:300;background:rgba(20,18,26,.36);display:grid;place-items:center;padding:16px;animation:cxfade .2s both}
.cx-mdl .sheet{width:min(440px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:cxpop .32s cubic-bezier(.22,1,.36,1) both}
@keyframes cxfade{from{opacity:0}}@keyframes cxpop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.cx-mdl .pt{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center}
.cx-mdl .av{width:48px;height:48px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:18px;font-style:normal}
.cx-mdl h3{margin:0;font-size:18px}
.cx-mdl small{font-size:13px;color:var(--muted)}

.cx-mdl dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;margin:18px 0;font-size:14px}
.cx-mdl dt{color:var(--muted)}
.cx-mdl dd{margin:0;font-weight:600}

.cx-mdl .acts button{flex:1;height:46px;border-radius:8px;border:0;font-size:15px;font-weight:650;cursor:pointer}
.cx-mdl .acts .pri{background:var(--ink);color:#fff}
.cx-mdl .acts .sec2{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
/* leaving early */
.cx-post{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.cx-post h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.cx-post p{margin:12px 0 18px;font-size:15px;color:var(--muted);line-height:1.55;max-width:440px}
.cx-post ul{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:8px;font-size:14px}
.cx-post li{display:flex;gap:8px;align-items:center}
.cx-post li .ic{width:15px;height:15px}
.cx-post .go{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:650;cursor:pointer}
.cx-post .go .ic{width:16px;height:16px}
.cx-postline{padding:26px 0}
.cx-postline p{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin:0;font-size:16px;color:var(--ink2)}
.cx-postline p b{color:var(--ink);font-weight:650}
.cx-post.strip{grid-template-columns:minmax(0,1fr);max-width:600px}
.cx-post.strip h2{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.5px}
.cx-post.strip p{font-size:16px;color:var(--ink2);max-width:none}
.cx-pimg{border-radius:14px;overflow:hidden;aspect-ratio:4/3}
.cx-pimg img{width:100%;height:100%;object-fit:cover;display:block}
/* FAQ */
.cx-faq{max-width:760px}
.cx-faq details{border-bottom:1px solid var(--hair);padding:16px 2px}
.cx-faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:650}
.cx-faq summary::-webkit-details-marker{display:none}
.cx-faq summary::after{content:"+";font-size:20px;font-weight:400;line-height:1;color:var(--muted)}
.cx-faq details[open] summary::after{content:"–"}
.cx-faq details p{margin:10px 0 0;font-size:14px;color:var(--muted);line-height:1.6;overflow:hidden}
/* footer */
.cx-foot{background:var(--canvas);border-top:1px solid var(--hair);padding:40px 0 28px}
.cx-fcols{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:24px}
.cx-fcols h4{margin:0 0 10px;font-size:13px}
.cx-fcols a{display:block;font-size:14px;color:var(--muted);text-decoration:none;padding:3px 0}
.cx-fcols a:hover{color:var(--ink);text-decoration:underline}
.cx-fcols .brand img{height:28px}
.cx-fcols .brand p{font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.cx-fbot{margin-top:28px;padding-top:18px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
@container (max-width:900px){.cx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cx-fcols{grid-template-columns:repeat(2,minmax(0,1fr))}.cx-fcols .brand{grid-column:1/-1}.cx-subs{grid-template-columns:minmax(0,1fr);gap:22px}.cx-post{grid-template-columns:minmax(0,1fr);gap:24px}}
@container (max-width:640px){
  .cx-sec{padding:38px 0}.results.cx{padding:32px 0 38px}
  .cx-sh h2{font-size:21px}
  .cx-grid{grid-template-columns:minmax(0,1fr)}
  .cx-card .cfx,.cx-card .cph::after{display:none}.cx-card .cf2{display:block}
  .cx-tbar{flex-direction:column;align-items:stretch}.cx-tbar .cx-seg{align-self:flex-start}
  .cx-tbar .cx-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;min-width:0;max-width:calc(100% + 32px)}
  .cx-rail,.cx-ppl{margin:0 -16px;padding:4px 16px 8px;scroll-padding-inline:16px}
  .cx-rail .cx-card{flex-basis:220px}.cx-pnav,.cx-sh .cx-nav{display:none}
  .cx-srow{flex-direction:column;padding:8px}.cx-srow input{height:44px;padding:0 8px}.cx-srow button{width:100%}
  .cx-post h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.cx-swap>*{animation:none}.cx-seg .ind,.cx-card .cfx{transition:none}}

/* Rentlet: no rooms at this place yet */
.h-a4 .reel.none,.h-a4 .reel.none~.reel-ctl{visibility:hidden}
.reel-none{position:relative;z-index:2;max-width:420px;margin:96px auto 0;text-align:center}
.reel-none p{margin:0 0 16px;font-size:16px;color:var(--ink2)}
.reel-none[hidden]{display:none}
/* frosted glass on everything that sits on a photo or the map: the search bar's material (Founder, Nov 6).
   src/homemap.ts uses the same values for the map's price pills and buttons. Where a browser can't blur behind
   an element, or someone asks for less transparency, these stay solid. */
:root{--gl-bg:linear-gradient(135deg,rgba(255,255,255,.62),rgba(255,255,255,.34));--gl-fx:blur(16px) saturate(1.8);--gl-bd:1px solid rgba(255,255,255,.72);--gl-sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.2),0 8px 22px -6px rgba(20,16,40,.32);--gl-ink:#17151f}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .h-a4 .sq .sq-chip,.cx-card .ctg,.cx-card .csv,.ph-tag,.walk,.save,.cx-shuttle{color:var(--gl-ink);background:var(--gl-bg);-webkit-backdrop-filter:var(--gl-fx);backdrop-filter:var(--gl-fx);border:var(--gl-bd);box-shadow:var(--gl-sh)}
  .cx-shuttle:hover{background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.55))}
  /* several lines of small text, so a little more white behind them */
  .cx-card .cfx{background:linear-gradient(135deg,rgba(255,255,255,.76),rgba(255,255,255,.56));-webkit-backdrop-filter:var(--gl-fx);backdrop-filter:var(--gl-fx);border:var(--gl-bd);box-shadow:var(--gl-sh)}
}
@media (prefers-reduced-transparency:reduce){.h-a4 .sq .sq-chip,.cx-card .ctg,.cx-card .csv,.ph-tag,.walk,.save,.cx-shuttle,.cx-card .cfx{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}}

<script src="where-search.js?v=50645075"></script>

<script>
const ICONS={close:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  heart:'<path d="M12 19.5s-7-4.3-7-9.6A3.9 3.9 0 0 1 12 7.6a3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6z"/>',
  check:'<path d="M5.5 12.5l4 4 9-9"/>',
  cal:'<rect x="4" y="5.5" width="16" height="14.5" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/>',
  walk:'<circle cx="13" cy="4.8" r="1.6"/><path d="M10.5 21l2-6.5-2.5-2.5 1.5-4.5 3 2.5 2.5 1M10 8.5L7 10v3.5M12.5 14.5l2.5 2.5V21"/>',
  key:'<circle cx="8" cy="12" r="3.8"/><path d="M11.8 12H21M18 12v3M15 12v2.2"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  shield:'<path d="M12 3.5l7 2.8v5.2c0 4.4-3 7.7-7 9-4-1.3-7-4.6-7-9V6.3z"/><path d="M9 12l2.2 2.2L15.5 10"/>',
  chat:'<path d="M5 6.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-8l-4.5 3v-3H5A1.5 1.5 0 0 1 3.5 16V8A1.5 1.5 0 0 1 5 6.5z"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/>',
  home:'<path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>',
  pause:'<path d="M9 6v12M15 6v12"/>',
  back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  play:'<path d="M8 5.5l11 6.5-11 6.5z"/>'
};
const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* dates & money */
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const T=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const nights=(a,b)=>Math.round((T(b)-T(a))/864e5);
const md=s=>{const[,m,d]=s.split('-').map(Number);return `${MN[m-1]} ${d}`};
/* a date range for the When fields: the year is written out only when the stay crosses into a new year */
/* dates use the one site format in when-picker.js */
const wl=(s,e)=>WhenPicker.label(s,e);
const range=wl;
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

/* example data — listings only at Northwestern · Evanston */
const SCHOOLS=[
  {group:'Chicago area',items:[['nu-evn','Northwestern · Evanston'],['nu-chi','Northwestern · Chicago'],['chi-dt','Downtown Chicago']]}
];
const schoolName=id=>SCHOOLS.flatMap(g=>g.items).find(i=>i[0]===id)?.[1]||'';
const schoolSelect=(id,sel)=>`<select id="${id}">${SCHOOLS.map(g=>`<optgroup label="${g.group}">${g.items.map(([v,t])=>`<option value="${v}" ${v===sel?'selected':''}>${t}</option>`).join('')}</optgroup>`).join('')}</select>`;
/* live listings from Firestore (src/listings.ts toCard rows), newest first; filled by RL_onListings */
const L=[];let LOADED=false;
/* a listing photo is a full URL; the bundled images are short names */
const pic=x=>!x?'data:image/gif;base64,R0lGODlhAQABAAAAACw=':(/[\/:]/.test(x)?x:`img/${x}.jpg`);
const agoOf=ms=>{const m=Math.max(0,Math.round((Date.now()-ms)/6e4));if(m<2)return 'Posted just now';if(m<60)return `Posted ${m} minutes ago`;const h=Math.round(m/60);if(h<24)return `Posted ${h} hour${h>1?'s':''} ago`;const d=Math.round(h/24);if(d<2)return 'Posted yesterday';if(d<7)return `Posted ${d} days ago`;const w=Math.round(d/7);return w<2?'Posted last week':`Posted ${w} weeks ago`};
/* requests from people looking for a place, live from Firestore (src/requests.ts calls RL_onRequests):
   QALL is every open request, Q the ones at the chosen place (plan.school). First name and Google photo only. */
const QALL=[],Q=[];
const syncQ=()=>Q.splice(0,Q.length,...QALL.filter(q=>q.campusId===plan.school));
/* redraw "People looking for a place" and the count under it in place, so the reel above keeps running */
function cxPeopleSync(){const was=JSON.stringify(Q);syncQ();if(JSON.stringify(Q)===was)return;
  const box=$('#cxNearBox');if(!box)return;
  $$('[data-cxpeople]').forEach(x=>x.remove());if(Q.length)box.insertAdjacentHTML('afterend',cxPeople());
  $$('[data-pcount]').forEach(x=>x.innerHTML=cxCount())}
window.RL_onRequests=rows=>{if(rows)QALL.splice(0,QALL.length,...rows);cxPeopleSync()};
/* a new campus in the search bar (its own change handler sets plan.school first) */
document.addEventListener('change',e=>{if(e.target&&e.target.id==='aCamp')cxPeopleSync()});
/* showcase pairs for the heroes (illustrative, not inventory) */
const DEFAULT={school:'nu-evn',start:'2027-01-03',end:'2027-04-30',budget:1500};
const MINE={school:'nu-evn',start:'2027-01-02',end:'2027-04-30',budget:1390};
/* reel rooms: example rooms near Northwestern (replaced by live listings) */
const ROOMS=[
  {link:1},{link:2},
  {link:4},
  {img:'kitchen',flip:1,who:'Grace',school:'Northwestern · Chicago',title:'Entire 1-bed apartment',area:'Streeterville',walk:10,type:'Lease takeover',price:1720,start:'2027-08-31',end:'2028-06-30',youIn:'2027-09-01',youOut:'2028-06-15'}
].map((x,i)=>x.link?{...L.find(l=>l.id===x.link),school:'Northwestern · Evanston',youIn:DEFAULT.start,youOut:DEFAULT.end,budget:DEFAULT.budget,key:'l'+x.link}:{...x,key:'r'+i});

/* matching: same campus, overlap ≥ 30 nights and ≥ half the stay, rent ≤ budget + 5% (existing rules) */
function fit(l,p){
  const need=nights(p.start,p.end);
  const s=T(l.start)>T(p.start)?l.start:p.start, e=T(l.end)<T(p.end)?l.end:p.end;
  const ov=Math.max(0,nights(s,e));
  const whole=T(l.start)<=T(p.start)&&T(l.end)>=T(p.end);
  const diff=p.budget-l.price;
  const ok=need>0&&(whole||(ov>=30&&ov>=need/2))&&l.price<=p.budget*1.05;
  return{need,ov,whole,diff,ok,score:(whole?1e4:0)+ov*10+Math.min(diff,0)};
}
/* with No max there is no budget line to show */
const budgetText=d=>!isFinite(d)?'':d>0?`${money(d)} under budget`:d<0?`${money(-d)} over budget`:'Right on budget';
function fitLine(l,p){
  const r=fit(l,p);
  const dates=r.whole?'Covers your whole stay':`${Math.floor(r.ov/r.need*100)}% fits your dates`;
  return `<p class="fit ${r.whole?'full':'part'}">${ic(r.whole?'check':'cal')}<span><b>${dates}</b>${budgetText(r.diff)?` <span class="bud">· ${budgetText(r.diff)}</span>`:''}</span></p>`;
}
const gapDays=(a,b)=>nights(a,b);
function legStart(l,p){if(T(l.start)<=T(p.start)){const d=gapDays(l.start,p.start);return['ok',d===0?'Same day':`${plural(d,'day')} early`]}return['warn',`${gapDays(p.start,l.start)}-day gap`]}
function legEnd(l,p){if(T(l.end)>=T(p.end)){const d=gapDays(p.end,l.end);return['ok',d===0?'Same day':`+${plural(d,'day')}`]}return['warn',`${plural(gapDays(l.end,p.end),'day')} short`]}
const priceTag=l=>`<span class="price"><b>${money(l.price)}</b><span class="unit"> / mo</span></span>`;
/* a room's heart, only on a real listing (8-digit number). The boot script owns the click (the card under it
   never opens); src/rentlet.ts signs the visitor in, saves it to their account and keeps aria-pressed current */
const ROOM_CODE=/^[1-9][0-9]{7}$/;
const roomSaved=c=>!!(window.RL&&typeof RL.isSaved==='function'&&RL.isSaved('room',String(c)));
/* a room's name on the homepage: its building, else its type */
const roomName=l=>l.building||l.title;
const heartBtn=(l,cls)=>ROOM_CODE.test(String(l.code||''))?`<button type="button" class="${cls}" data-rl-save="room:${l.code}" aria-pressed="${roomSaved(l.code)}" aria-label="Save ${roomName(l)}">${ic('heart')}</button>`:'';
function hcard(l,p,i){
  const [s1,t1]=legStart(l,p),[s2,t2]=legEnd(l,p);
  return `<article class="card rise" style="--i:${Math.min(i,7)}" data-id="${l.id}" tabindex="0" aria-label="${roomName(l)}, ${l.area}, ${money(l.price)} per month">
    <div class="ph"><img src="${pic(l.img)}" alt="" class="${l.flip?'flip':''}" style="object-position:${l.pos||'50% 50%'}"><span class="ph-tag">${l.type}</span>${heartBtn(l,'save')}<span class="walk">${ic('walk','sm')}${l.walk} min to campus</span></div>
    <div class="cb">
      <div class="ct"><h3>${roomName(l)}</h3>${priceTag(l)}</div>
      <p class="meta">${l.area} · ${ic('shield','sm')}${l.who}, verified school email</p>
      ${fitLine(l,p)}
      <div class="legs">
        <div class="leg"><span class="leg-k">Move in</span><span class="leg-d"><span>${md(l.start)}</span><span class="hand">${ic('arrow','sm')}</span><b>${md(p.start)}</b><span class="sr">${l.who} leaves ${md(l.start)}, you arrive ${md(p.start)}</span></span><span class="pill ${s1}">${t1}</span></div>
        <div class="leg"><span class="leg-k">Move out</span><span class="leg-d"><span>${md(l.end)}</span><span class="hand">${ic('arrow','sm')}</span><b>${md(p.end)}</b><span class="sr">lease ends ${md(l.end)}, you leave ${md(p.end)}</span></span><span class="pill ${s2}">${t2}</span></div>
      </div>
      <p class="leg-cap" aria-hidden="true">${l.who}’s dates → <b>your dates</b></p>
    </div></article>`;
}
function rcard(q,mine,i){
  const st=T(mine.start)<=T(q.start)?['ok',T(mine.start)===T(q.start)?'Same day':`${plural(nights(mine.start,q.start),'day')} after you`]:['warn',`${plural(nights(q.start,mine.start),'day')} too early`];
  const en=T(mine.end)>=T(q.end)?['ok',T(mine.end)===T(q.end)?'Same day':`${plural(nights(q.end,mine.end),'day')} before`]:['warn',`${plural(nights(mine.end,q.end),'day')} past lease`];
  const bud=mine.budget<=q.budget?`Your rent fits their budget (up to ${money(q.budget)})`:`Your rent is ${money(mine.budget-q.budget)} over their budget`;
  return `<article class="card rcard rise" style="--i:${Math.min(i,7)}">
    <div class="avatar">${q.who[0]}</div>
    <div>
      <div class="ct"><h3>${q.who} · ${q.role}</h3><span class="unit">${q.kind}</span></div>
      <p class="meta">${ic('shield','sm')}Verified school email · ${range(q.start,q.end)}</p>
      <div class="legs">
        <div class="leg"><span class="leg-k">Move in</span><span class="leg-d"><span>${md(mine.start)}</span><span class="hand">${ic('arrow','sm')}</span><b>${md(q.start)}</b><span class="sr">you leave ${md(mine.start)}, ${q.who} arrives ${md(q.start)}</span></span><span class="pill ${st[0]}">${st[1]}</span></div>
        <div class="leg"><span class="leg-k">Move out</span><span class="leg-d"><span>${md(mine.end)}</span><span class="hand">${ic('arrow','sm')}</span><b>${md(q.end)}</b><span class="sr">your lease ends ${md(mine.end)}, ${q.who} leaves ${md(q.end)}</span></span><span class="pill ${en[0]}">${en[1]}</span></div>
      </div>
      <div class="hfoot"><span class="bud">${bud}</span><button class="btn btn-secondary" data-toast="Opens a message to ${q.who}.">${ic('chat','sm')}Message ${q.who}</button></div>
    </div></article>`;
}
const skeleton=n=>Array.from({length:n},()=>`<div class="sk-card"><div class="sk sk-ph"></div><div class="sk sk-l w60"></div><div class="sk sk-l w40"></div><div class="sk sk-l tall"></div></div>`).join('');
const empty=(t,x,a)=>`<div class="empty rise"><div class="tile">${ic('home')}</div><h3>${t}</h3><p>${x}</p><div class="acts">${a}</div></div>`;
function load(el,html,skel,ms=520){el.innerHTML=skel;clearTimeout(el._t);el._t=setTimeout(()=>{el.innerHTML=html;wire(el)},ms)}
function wire(root){$$('.ph img',root).forEach(img=>{const done=()=>{img.classList.add('in');img.parentElement.classList.add('done')};img.complete&&img.naturalWidth?done():img.addEventListener('load',done)})}

/* ---------- shared page ---------- */
/* the header's right end is the same on every page: Saved and Messages (signed in), then the menu, which holds
   posting, the site's pages and the account (rentlet-boot.js draws both and runs the menu) */
const header=()=>`<header class="hdr"><div class="wrap">
  <a class="logo" href="#" aria-label="Rentlet home"><img src="img/rentlet-logo.png" alt="Rentlet"></a>
  <div class="hdr-right">${RL.msgs?RL.msgs():''}${RL.menu?RL.menu():''}</div></div></header>`;
/* dates carry over to the room page (and back) through the same session key the room page uses */
const savePlan=(s,e)=>{try{sessionStorage.setItem('cs-plan',JSON.stringify({start:s,end:e,school:plan.school}))}catch(_){}};
const storedPlan=()=>{try{const p=JSON.parse(sessionStorage.getItem('cs-plan')||'null');if(!(p&&p.start&&p.end))return{};const o={start:p.start,end:p.end};if(p.school&&SCHOOLS.some(g=>g.items.some(i=>i[0]===p.school)))o.school=p.school;return o}catch(_){return{}}};
let mode='need',plan={...DEFAULT,...storedPlan(),budget:BudgetPicker.load(DEFAULT.budget)},mine={...MINE};
const budPer=b=>b===Infinity?'any price':`up to ${money(b)} / mo`;
const searchBlock=()=>{

const cxHi=code=>{if(code===cxHot)return;cxHot=code;if(window.RentletHomeMap)RentletHomeMap.highlight(code)};
site.addEventListener('mouseover',e=>cxHi(cxPinOf(e.target)));
site.addEventListener('mouseleave',()=>cxHi(null));
site.addEventListener('focusin',e=>cxHi(cxPinOf(e.target)));
$$('[data-opt]').forEach(b=>b.onclick=()=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search);show(b.dataset.opt)});
$$('[data-skin]').forEach(b=>b.onclick=()=>{barSkin=b.dataset.skin;$$('[data-skin]').forEach(x=>x.setAttribute('aria-pressed',x===b));const br=$('#bar4');if(br)br.dataset.skin=barSkin});
$$('[data-cs]').forEach(b=>b.onclick=()=>{cardStyle=b.dataset.cs;$$('[data-cs]').forEach(x=>x.setAttribute('aria-pressed',x===b));const re=$('#reel');if(re)re.dataset.style=cardStyle});
$$('[data-dev]').forEach(b=>b.onclick=()=>{$$('[data-dev]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#stage').classList.toggle('phone',b.dataset.dev==='phone');site.scrollTop=0});
$$('[data-post]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.post===postMode);b.onclick=()=>{postMode=b.dataset.post;try{localStorage.setItem('cs-home-post',postMode)}catch(_){}$$('[data-post]').forEach(x=>x.setAttribute('aria-pressed',x===b));show(current,true)}});
$('#noteToggle').onclick=()=>{const c=$('#rv').classList.toggle('closed');$('#noteToggle').textContent=c?'Show notes':'Hide notes'};
const rvh=()=>{const r=$('#rv');if(r)document.documentElement.style.setProperty('--rvh',r.offsetHeight+'px')};
new ResizeObserver(rvh).observe($('#rv'));
/* the homepage is A4 (straight reel + frosted-glass search bar); the other versions were retired */
current='orbit';
cardStyle=new URLSearchParams(location.search).get('cs')||'chip';$$('[data-cs]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cs===cardStyle));
const wantAi=false; /* AI pick is taken down for now; ?ai=1 no longer starts it */
window.RL_onAuth=()=>show(current,true);
let booted=false;const boot=()=>{if(booted)return;booted=true;if(location.hash)renderRoute();else show(current)};
/* the room page's search button lands here with ?find=1: go straight to the results for that search */
if(/[?&]find=1/.test(location.search)){history.replaceState(null,'',location.pathname+location.hash);
  const toRes=()=>{const r=document.getElementById('res');if(r)r.scrollIntoView({block:'start'})};setTimeout(toRes,500);setTimeout(toRes,1600)}
window.RL_onListings=list=>{LOADED=true;if(list)L.splice(0,L.length,...list.map(d=>RentletListings.toCard(d)));
  for(const k of ['nu-evn','nu-chi','chi-dt'])CAMPUS_ROOMS[k]=L.filter(l=>l.school===k);
  window.RL_SEARCH_ROOMS=L.map(l=>({key:l.key,code:l.code,title:l.title,area:l.area,layout:l.layout,price:l.price}));
  if(!booted)boot();else show(current,true)};
setTimeout(()=>{if(!booted){LOADED=true;boot()}},2500);
/* from another page's AI pick button: open A4 and pick right away */
if(wantAi&&current==='orbit')setTimeout(()=>window.__a4&&window.__a4.spin(),reduced?0:1100);
</script>
